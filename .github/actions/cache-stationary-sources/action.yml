name: Stationary AOT semantic sources
description: Reuse verified source-only lowering independently of compiler flags and binary caches
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/stationary-aot-source-cache
        key: stationary-aot-source-v2-${{ hashFiles('python/generativeqc_compiler/**', 'src/integrals/**', 'src/dft/**', 'src/runtime/**', 'tools/generate_stationary_force_aot.py', 'tools/generate_native_stationary_cuda.py', '!**/__pycache__/**', '!**/*.pyc', '!**/*.pyo') }}
