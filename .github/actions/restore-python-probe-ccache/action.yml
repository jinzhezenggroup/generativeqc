name: Restore trusted master Python probe snapshot
description: Bounded optional successful-master qualification fallback after a true cache miss
inputs:
  github-token:
    description: Read-only Actions token for this repository
    required: true
  shard:
    description: Closed Python CI shard identity
    required: true
runs:
  using: composite
  steps:
    - name: Discover trusted Python probe snapshot
      id: discover
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PROBE_SHARD: ${{ inputs.shard }}
      run: timeout --kill-after=2s 25s python3 tools/ci_cpu_ccache_snapshot.py discover --profile probe --shard "$PROBE_SHARD"
    - name: Download trusted Python probe snapshot
      id: download
      if: steps.discover.outcome == 'success' && steps.discover.outputs.artifact_id != ''
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        artifact-ids: ${{ steps.discover.outputs.artifact_id }}
        run-id: ${{ steps.discover.outputs.run_id }}
        repository: ${{ github.repository }}
        github-token: ${{ inputs.github-token }}
        path: ${{ steps.discover.outputs.stage }}/download
        merge-multiple: true
        digest-mismatch: error
    - name: Verify Python probe snapshot
      id: verify
      if: steps.download.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        PROBE_CACHE_STAGE: ${{ steps.discover.outputs.stage }}
        PROBE_SHARD: ${{ inputs.shard }}
      run: timeout --kill-after=2s 45s python3 tools/ci_cpu_ccache_snapshot.py verify --profile probe --shard "$PROBE_SHARD"
    - name: Activate Python probe snapshot
      if: steps.verify.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        PROBE_CACHE_STAGE: ${{ steps.discover.outputs.stage }}
        PROBE_SHARD: ${{ inputs.shard }}
      run: python3 tools/ci_cpu_ccache_snapshot.py activate --profile probe --shard "$PROBE_SHARD"
    - name: Discard owned probe snapshot staging
      if: always() && steps.discover.outputs.stage != ''
      continue-on-error: true
      shell: bash
      env:
        PROBE_CACHE_STAGE: ${{ steps.discover.outputs.stage }}
        PROBE_SHARD: ${{ inputs.shard }}
      run: python3 tools/ci_cpu_ccache_snapshot.py cleanup --profile probe --shard "$PROBE_SHARD"
