name: Scoped concurrent review refresh
on:
  push:
    branches: [agent/astra-review-all-20261001-1535]
    paths: [.github/workflows/astra-refresh-review.yml]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install pyyaml
      - name: Run the exact previously reviewed source-only snapshot script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,yaml
          source=subprocess.check_output(['git','show','5922eac47608b169561c27d48aa586fda19e656b:.github/workflows/astra-review-all.yml'],text=True)
          script=yaml.safe_load(source)['jobs']['snapshot']['steps'][1]['run']
          subprocess.run(['bash','-e','-c',script],check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: astra-concurrent-review-refresh
          path: ${{ runner.temp }}/all-pr-review/
          retention-days: 1
