name: Array API conformance

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - python/generativeqc/experimental/**
      - python/generativeqc_compiler/array_api/**
      - python/generativeqc_compiler/tensor/**
      - tests/python/test_array_api*.py
      - tests/python/test_experimental_array_api.py
      - tools/check_array_api_conformance.py
      - manifests/array_api_conformance.json
      - pyproject.toml
      - .github/workflows/array-api.yml
  merge_group:

permissions:
  contents: read

jobs:
  cpu-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - python: "3.11"
            numpy: "numpy==2.1.3"
          - python: "3.13"
            numpy: "numpy>=2.1.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: data-apis/array-api-tests
          ref: 6c0b59f9ecd654f0c356614f2e421c9993f676d2
          submodules: true
          path: .array-api-tests
      - name: Install CPU test dependencies
        run: >-
          python -m pip install "${{ matrix.numpy }}" "array-api-compat==1.15.0"
          "pytest>=8" "hypothesis>=6.151.0" "ndindex>=1.8"
          "pytest-json-report>=1.5" "tomli>=2" "typing-extensions>=4.0"
          "array-api-strict==2.6.1"
          "sccache>=0.16.0"
      - name: Compiler cache provenance
        run: sccache --version && sccache --show-stats
      - name: Complete upstream conformance gate
        run: python tools/check_array_api_conformance.py .array-api-tests
      - name: Scientific boundary regressions
        env:
          PYTHONPATH: python
        run: >-
          python -m pytest -q tests/python/test_array_api*.py
          tests/python/test_experimental_array_api.py
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
