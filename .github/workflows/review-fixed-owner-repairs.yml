name: One-shot PR merge audit

on:
  push:
    branches: [agent/review-fixed-owner-repairs]
    paths: [.github/workflows/review-fixed-owner-repairs.yml]

permissions:
  contents: read

concurrency:
  group: one-shot-reviewed-pr-repairs
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'jinzhezenggroup/generativeqc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture fixed-head three-way merge evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          ROOT = Path.cwd()
          OUTPUT = Path(os.environ['RUNNER_TEMP']) / 'pr-merge-audit'
          OUTPUT.mkdir()
          MASTER = 'fbca33876e0a2382ec23f4d00a70b92310961c04'
          TARGETS = (
              (1510, '20f80b7e7c8d4351d6815f81a51a8977a0fc2ebf', MASTER),
              (1573, 'be77d0828d27e5b7b2966974b2a935d948a25ee5', MASTER),
              (1589, '3dafb9b17eae914ebfdeb2f21ee6f85732f2ec2c', MASTER),
              (1595, '0e77a96aec26a93b4d3707c13182e1b7165718bb', MASTER),
              (1597, 'feff34cc199fec72e83804d160db87ade4917b8e', MASTER),
              (1611, '5e1434347eed7c2e8cf81de3b1e70e45cf47d2a7', '489d0f68adec513de9ea4e6b4d273a5b69f9db4e'),
              (1612, '23e42ece2ae7e261fa442bd1a7209a0f6c4b939d', '5e1434347eed7c2e8cf81de3b1e70e45cf47d2a7'),
              (1613, '26abeb90ff12bcf2a2532af25be9a7a50e802818', '23e42ece2ae7e261fa442bd1a7209a0f6c4b939d'),
          )

          def run(*args, cwd=ROOT, check=True):
              result = subprocess.run(args, cwd=cwd, capture_output=True)
              if check and result.returncode:
                  raise RuntimeError(result.stderr.decode(errors='replace'))
              return result

          def text(*args, **kwargs):
              return run(*args, **kwargs).stdout.decode(errors='replace').strip()

          report = []
          for number, head, target in TARGETS:
              destination = OUTPUT / str(number)
              destination.mkdir()
              record = {'pr': number, 'head': head, 'target': target}
              try:
                  base = text('git', 'merge-base', head, target)
                  record['merge_base'] = base
                  paths = text('git', 'diff', '--name-only', base, head).splitlines()
                  with tempfile.TemporaryDirectory(prefix='review-merge-') as temporary:
                      work = Path(temporary) / 'checkout'
                      run('git', 'worktree', 'add', '--detach', str(work), head)
                      try:
                          result = run('git', '-c', 'user.name=ChatGPT',
                                       '-c', 'user.email=chatgpt@users.noreply.github.com',
                                       '-c', 'merge.conflictStyle=zdiff3',
                                       'merge', '--no-commit', '--no-ff', target,
                                       cwd=work, check=False)
                          record['merge_returncode'] = result.returncode
                          record['merge_output'] = (result.stdout + result.stderr).decode(errors='replace')
                          conflicts = text('git', 'diff', '--name-only', '--diff-filter=U', cwd=work).splitlines()
                          record['conflicts'] = conflicts
                          record['tree'] = text('git', 'write-tree', cwd=work) if not conflicts else None
                          (destination / 'conflicts.diff').write_bytes(run('git', 'diff', '--cc', cwd=work).stdout)
                          (destination / 'head-to-merged.patch').write_bytes(run('git', 'diff', '--binary', head, cwd=work).stdout)
                          (destination / 'target-to-merged.patch').write_bytes(run('git', 'diff', '--binary', target, cwd=work).stdout)
                          for path in sorted(set(paths) | set(conflicts)):
                              if path.startswith('.git/') or '..' in Path(path).parts:
                                  raise RuntimeError('unsafe source path')
                              for label, revision in (('base', base), ('ours', head), ('theirs', target)):
                                  value = run('git', 'show', f'{revision}:{path}', check=False)
                                  if value.returncode == 0:
                                      output = destination / label / path
                                      output.parent.mkdir(parents=True, exist_ok=True)
                                      output.write_bytes(value.stdout)
                              source = work / path
                              if source.is_file() and not source.is_symlink():
                                  output = destination / 'merged' / path
                                  output.parent.mkdir(parents=True, exist_ok=True)
                                  output.write_bytes(source.read_bytes())
                      finally:
                          run('git', 'worktree', 'remove', '--force', str(work), check=False)
              except Exception as error:
                  record['error'] = str(error)
              report.append(record)
              print(json.dumps(record), flush=True)
              (OUTPUT / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Retain review-only source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-merge-audit
          path: ${{ runner.temp }}/pr-merge-audit/
          retention-days: 1
