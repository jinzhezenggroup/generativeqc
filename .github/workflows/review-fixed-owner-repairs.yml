name: One-shot WB97M-V master integration

on:
  push:
    branches: [agent/review-fixed-owner-repairs]
    paths: [.github/workflows/review-fixed-owner-repairs.yml]
permissions:
  contents: read
concurrency:
  group: one-shot-reviewed-pr-repairs
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'jinzhezenggroup/generativeqc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check pytest numpy scipy pyyaml
      - name: Prepare a clean single-parent master landing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'wb97mv-master'
          out.mkdir()
          head = 'd3b8fb51d74aaf84f41a09e3d6fa0a29959336c6'
          master = '268e7112ebb81db46755054ac1cc42374379040c'
          branch = 'agent/review-wb-residency-master'
          report = {'source_head': head, 'master': master, 'branch': branch}
          def run(*args, cwd=root, check=True, env=None):
              result = subprocess.run(args, cwd=cwd, capture_output=True, text=True, env=env)
              if check and result.returncode:
                  raise RuntimeError(result.stderr or result.stdout)
              return result
          try:
              if run('git', 'ls-remote', 'origin', 'refs/heads/' + branch).stdout.strip():
                  raise RuntimeError('replacement ref already exists; no overwrite')
              with tempfile.TemporaryDirectory(prefix='wb-master-') as temporary:
                  work = Path(temporary) / 'checkout'
                  run('git', 'worktree', 'add', '--detach', str(work), head)
                  try:
                      merge = run('git', '-c', 'user.name=ChatGPT', '-c', 'user.email=chatgpt@users.noreply.github.com', 'merge', '--no-commit', '--no-ff', master, cwd=work, check=False)
                      if merge.returncode:
                          (out / 'conflicts.patch').write_text(run('git', 'diff', '--cc', cwd=work).stdout)
                          raise RuntimeError('clean master integration failed; no branch created')
                      tests = ['test_dft_mp_v1_capacity.py', 'test_stationary_owner_kernel_abi.py', 'test_stationary_geometry_kernel_host.py', 'test_stationary_resident_nonlocal_join.py', 'test_wb97mv_resident_grid_points.py', 'test_grid_cuda_publication.py', 'test_wb97mv_resident_grid_weights.py', 'test_production_tensor_preparation.py']
                      env = dict(os.environ)
                      env['PYTHONPATH'] = str(work / 'python') + os.pathsep + str(work)
                      result = run('python3', '-m', 'pytest', '-q', '-o', 'addopts=', '--import-mode=importlib', *['tests/python/' + name for name in tests], cwd=work, env=env, check=False)
                      (out / 'tests.log').write_text(result.stdout + result.stderr)
                      report['test_returncode'] = result.returncode
                      report['test_summary'] = '\n'.join((result.stdout + result.stderr).splitlines()[-15:])
                      if result.returncode:
                          raise RuntimeError('integrated tests failed; no branch created')
                      run('git', 'diff', '--cached', '--check', cwd=work)
                      tree = run('git', 'write-tree', cwd=work).stdout.strip()
                      message = 'perf(dft): land reviewed WB97M-V owner/point/weight residency\n\nIntegrate the repaired #1611/#1612/#1613 slices on master after GitHub\nrefused native-stack retargeting. Preserve the P1 owner/ABI repairs, all\ncapacity mutation guards and concurrent publication/kernel regressions.\nFocused integrated tests pass; normal PR CI and review remain required.\n\nAgent: ChatGPT\nModel: GPT-6 Astra Pro'
                      commit = run('git', '-c', 'user.name=ChatGPT', '-c', 'user.email=chatgpt@users.noreply.github.com', 'commit-tree', tree, '-p', master, '-m', message, cwd=work).stdout.strip()
                      report['commit'] = commit
                      report['tree'] = tree
                      (out / 'master-relative.patch').write_text(run('git', 'diff', master, commit, cwd=work).stdout)
                      (out / 'source-integration.patch').write_text(run('git', 'diff', head, commit, cwd=work).stdout)
                      run('git', 'push', 'origin', commit + ':refs/heads/' + branch, cwd=work)
                      report['pushed'] = True
                  finally:
                      run('git', 'worktree', 'remove', '--force', str(work), check=False)
          except Exception as error:
              report['error'] = str(error)
          (out / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report), flush=True)
          if 'error' in report:
              raise SystemExit(1)
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wb97mv-master-integration
          path: ${{ runner.temp }}/wb97mv-master/
          retention-days: 1
