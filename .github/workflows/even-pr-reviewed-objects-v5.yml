name: Stage reviewed compiler stack regressions v5
on:
  push:
    branches: [agent/even-pr-repair-20260930]
    paths: [.github/workflows/even-pr-reviewed-objects-v5.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_AUTHOR_NAME: ChatGPT
      GIT_AUTHOR_EMAIL: noreply@openai.com
      GIT_COMMITTER_NAME: ChatGPT
      GIT_COMMITTER_EMAIL: noreply@openai.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Stage exact tested regressions without modifying original PR refs
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          rows=[
           (1604,'3372b2081769eade14d726bea004eaa0c015ea59','11893b3f77d2f9bcc7cd9b91920052faae9fddcc'),
           (1606,'4f5f938521ffa443dd1ffbdeaa1d75d92e8b568a','a1244f6085b5ca6b3757f8a33d40369b2d1f2506'),
          ]
          def git(*args,input=None,check=True):
           return subprocess.run(['git',*args],input=input,text=True,capture_output=True,check=check)
          def repair():
           p=Path('tests/python/test_rccsd_arena_expression_depth.py')
           s=p.read_text().replace('import pytest\n','import pytest\nfrom generativeqc_compiler.tensor.prepare import prepare_for_backend\n',1)
           old='    expected = sum(node.spec.size for node in program.live_nodes if node.op != "input")'
           if s.count(old)!=1:raise RuntimeError('arena expectation anchor changed')
           s=s.replace(old,'    prepared = prepare_for_backend(program, backend="cpu")\n    expected = sum(node.spec.size for node in prepared.live_nodes if node.op != "input")')
           p.write_text(s)
           p=Path('tests/python/test_tensor_ad_program.py');s=p.read_text()
           a=s.index('def test_generated_programs_are_cpu_plannable_for_cuda_lowering()')
           b=s.index('\n\ndef test_generated_reverse_plan_supports',a)
           s=s[:a]+'''@pytest.mark.parametrize("reassociate", (True, False))
          def test_generated_programs_are_cpu_plannable_for_cuda_lowering(
              reassociate: bool,
          ) -> None:
              program, feeds, tangents, cotangents = _supported_dense_program()
              forward = linearize(program, list(tangents))
              reverse = transpose_program(program, list(cotangents))
              references = (
                  (forward.program, tangents, "d", jvp(program, feeds, tangents).output_tangents),
                  (
                      reverse.program,
                      cotangents,
                      "bar",
                      vjp(program, feeds, cotangents).input_cotangents,
                  ),
              )
              for generated, seeds, prefix, reference in references:
                  original = generated.dumps()
                  plan = plan_cuda(generated, TARGET, reassociate_contractions=reassociate)
                  assert plan.peak_bytes > 0
                  assert generated.dumps() == original
                  generated_feeds = {
                      **feeds,
                      **{f"{prefix}_{name}": value for name, value in seeds.items()},
                  }
                  actual = execute(plan.program, generated_feeds).outputs
                  assert set(actual) == {f"{prefix}_{name}" for name in reference}
                  for name, value in reference.items():
                      np.testing.assert_allclose(
                          actual[f"{prefix}_{name}"], value, rtol=1e-12, atol=1e-12
                      )
          '''+s[b:]
           p.write_text(s)
           p=Path('tests/python/test_matrix_function.py');s=p.read_text()
           a=s.index('def test_response_graph_can_be_planned_for_cuda_without_a_device()')
           b=s.index('\n\ndef _reference_pseudoinverse',a)
           s=s[:a]+'''@pytest.mark.parametrize("reassociate", (True, False))
          def test_response_graph_can_be_planned_for_cuda_without_a_device(
              reassociate: bool,
          ) -> None:
              from generativeqc_compiler.common.cuda_target import cuda_target_info
              from generativeqc_compiler.tensor.cuda_plan import plan_cuda

              vectors, _ = np.linalg.qr(np.random.default_rng(466).normal(size=(3, 3)))
              roots = np.array([1.0, 2.0, 3.0])
              divided = -1.0 / (
                  roots[:, None] * roots[None, :] * (roots[:, None] + roots[None, :])
              )
              seed = np.arange(9, dtype=float).reshape(3, 3) / 10
              root = (vectors * roots) @ vectors.T
              inverse = np.linalg.inv(root)
              operator = np.kron(root, np.eye(3)) + np.kron(np.eye(3), root)
              expected = np.linalg.solve(
                  operator, (-inverse @ ((seed + seed.T) / 2) @ inverse).ravel()
              ).reshape(3, 3)
              program = SymmetricMatrixFunctionSpec(3, "lowering", 0.1).response_program()
              original = program.dumps()
              plan = plan_cuda(
                  program, cuda_target_info("sm_80"), reassociate_contractions=reassociate
              )
              assert plan.peak_bytes > 0
              assert program.dumps() == original
              actual = execute(
                  plan.program, {"vectors": vectors, "divided": divided, "seed": seed}
              ).outputs
              assert set(actual) == {"response"}
              np.testing.assert_allclose(actual["response"], expected, atol=2e-14, rtol=2e-13)
              # Prepared IR versus an independent Sylvester solve, not GPU execution.
          '''+s[b:]
           p.write_text(s)
          git('fetch','--no-tags','--depth=1','origin',*[r[1] for r in rows])
          results=[]
          for pr,head,expected in rows:
           try:
            git('reset','--hard');git('checkout','--detach',head)
            repair();git('add','-A')
            tree=git('write-tree').stdout.strip()
            if tree!=expected:raise RuntimeError('unreviewed final tree: '+tree)
            git('diff','--cached','--check')
            message=(f'test(compiler): validate prepared response and AD programs for PR #{pr}\n\n'
                     'Retain compilation depth/overflow checks and compare the emitted arena\n'
                     'against the prepared DAG. Replace object-identity assumptions with\n'
                     'primal AD and independent Sylvester numerical oracles for both\n'
                     'contraction-order policies. Preserve source immutability/output ABI.\n'
                     'No production optimizer, tolerance, or CI policy is weakened.\n\n'
                     'Agent: ChatGPT\nModel: GPT-6 Astra Pro\n')
            commit=git('commit-tree',tree,'-p',head,input=message).stdout.strip()
            ref=f'agent/even-pr-v5-{pr}-{head[:8]}'
            git('push','origin',f'{commit}:refs/heads/{ref}')
            result={'pr':pr,'head':head,'tree':tree,'commit':commit,'scratch_ref':ref}
           except Exception as e:result={'pr':pr,'error':str(e)}
           results.append(result);print('REVIEW_RESULT '+json.dumps(result),flush=True)
          Path('/tmp/review-round5.json').write_text(json.dumps(results,indent=2))
          if any('error' in row for row in results):raise SystemExit('failed closed; original PR refs unchanged')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-even-pr-round5
          path: /tmp/review-round5.json
          retention-days: 1
