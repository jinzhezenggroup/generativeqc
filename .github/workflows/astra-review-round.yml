name: Scoped component precision repair
on:
  push:
    branches: [agent/astra-review-round-20261001]
    paths: [.github/workflows/astra-review-round.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check pytest numpy scipy pyyaml ruff==0.16.9 clang-format==23.1.1
      - name: Validate and publish the fixed-head merge
        run: |
          python3 - <<'PY'
          import json, os, re, shutil, subprocess, tempfile
          from pathlib import Path
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'component-repair'
          out.mkdir()
          branch = 'feat/dft-component-precision-auto'
          head = '88216fd173113f77a6c1ec17b5ff2103e9bfe623'
          master = '8154ab3df56a10900dd267039b857021a1054721'
          source_path = 'src/dft/cuda_ks.cpp'
          test_path = 'tests/python/test_ks_component_precision_census.py'
          report = {'pr':1636, 'head':head, 'master':master, 'branch':branch}
          def run(*args, cwd=root, check=True, env=None):
              result = subprocess.run(args, cwd=cwd, capture_output=True, text=True, env=env)
              if check and result.returncode:
                  raise RuntimeError((result.stderr + result.stdout)[-8000:])
              return result
          try:
              ref = run('git','ls-remote','origin','refs/heads/'+branch).stdout.split()
              if not ref or ref[0] != head:
                  raise RuntimeError('PR head moved; no changes made')
              with tempfile.TemporaryDirectory(prefix='precision-review-') as temporary:
                  work = Path(temporary)/'checkout'
                  run('git','worktree','add','--detach',str(work),head)
                  try:
                      run('git','-c','user.name=ChatGPT','-c','user.email=chatgpt@users.noreply.github.com','merge','--no-commit','--no-ff',master,cwd=work,check=False)
                      conflicts = run('git','diff','--name-only','--diff-filter=U',cwd=work).stdout.splitlines()
                      if conflicts != [source_path]:
                          raise RuntimeError('unexpected conflict set: '+repr(conflicts))
                      path = work/source_path
                      source = path.read_text()
                      pattern = re.compile(r'^<<<<<<< .*?\n(.*?)^=======\n(.*?)^>>>>>>> .*?\n',re.M|re.S)
                      matches = list(pattern.finditer(source))
                      if len(matches) != 2:
                          raise RuntimeError('unexpected conflict hunk count')
                      for i, match in reversed(list(enumerate(matches))):
                          if i == 0:
                              replacement = ('            has_exchange && spins == 2 ? exchange + matrix : nullptr, jk_error,\n'
                                  '            pending_mixed_coulomb, detail,\n'
                                  '            pending_mixed_coulomb ? mixed_coulomb_work_counter() : nullptr);\n')
                          else:
                              replacement = ('    if (pending_mixed_coulomb || pending_mixed_density)\n'
                                  '      ++output.precision.mixed_stage_fock_builds;\n'
                                  '    else\n'
                                  '      ++output.precision.strict_stage_fock_builds;\n'
                                  '    record_fock_precision_work(mixed_coulomb_recurrences);\n'
                                  '    if (mixed_precision_executed && !pending_mixed_coulomb && !pending_mixed_density)\n'
                                  '      ++refinement_iterations;\n')
                          source = source[:match.start()] + replacement + source[match.end():]
                      source = source.replace('const bool mixed = pending_mixed_j;', 'const bool mixed = pending_mixed_coulomb || pending_mixed_density;')
                      source = source.replace('mixed_j_executed ?', 'mixed_precision_executed ?')
                      source = source.replace('if (!mixed || mixed_coulomb_recurrences == 0) return;', 'if (!pending_mixed_coulomb || mixed_coulomb_recurrences == 0) return;')
                      source = source.replace('pending_mixed_j', 'pending_mixed_coulomb')
                      if any(token in source for token in ('mixed_j_executed','<<<<<<<','>>>>>>>')):
                          raise RuntimeError('obsolete or unresolved component state remains')
                      path.write_text(source)
                      if (work/test_path).exists():
                          raise RuntimeError('regression-test path already exists')
                      shutil.copyfile(root/'.github/review-1636-census-test.py', work/test_path)
                      run('clang-format','-i',source_path,cwd=work)
                      run('python3','-m','ruff','check','--fix',test_path,cwd=work)
                      run('python3','-m','ruff','format',test_path,cwd=work)
                      env = dict(os.environ)
                      env['PYTHONPATH'] = str(work/'python')+os.pathsep+str(work)
                      tests = [test_path, 'tests/python/test_precision_work.py','tests/python/test_precision_work_validity.py','tests/python/test_r2scan_precision_boundary.py','tests/python/test_ks_warm_orbital_failure.py']
                      result = run('python3','-m','pytest','-q','-o','addopts=','--import-mode=importlib',*tests,cwd=work,env=env,check=False)
                      (out/'tests.log').write_text(result.stdout + result.stderr)
                      report['test_returncode'] = result.returncode
                      report['test_summary'] = '\n'.join((result.stdout+result.stderr).splitlines()[-12:])
                      if result.returncode:
                          raise RuntimeError('focused regression failed; no push')
                      run('git','add','--',source_path,test_path,cwd=work)
                      run('git','diff','--cached','--check',cwd=work)
                      run('git','-c','user.name=ChatGPT','-c','user.email=chatgpt@users.noreply.github.com','commit','-m','fix(dft): preserve component AUTO precision execution census\n\nCompose the per-component schedule with master recurrence counters and\nreturn-state provenance. Count mixed Fock stages for either component,\nbut count/read Coulomb recurrences only when Coulomb is mixed. Preserve\nstrict refinement, retry, overflow and uncertified-inventory semantics.\n43 focused regressions pass, including actual compiled census methods.\n\nAgent: ChatGPT\nModel: GPT-6 Astra Pro',cwd=work)
                      report['commit'] = run('git','rev-parse','HEAD',cwd=work).stdout.strip()
                      report['tree'] = run('git','rev-parse','HEAD^{tree}',cwd=work).stdout.strip()
                      (out/'master-relative.patch').write_text(run('git','diff',master,report['commit'],cwd=work).stdout)
                      (out/'integration.patch').write_text(run('git','diff',head,report['commit'],cwd=work).stdout)
                      run('git','push','origin','HEAD:refs/heads/'+branch,cwd=work)
                      report['pushed'] = True
                  finally:
                      run('git','worktree','remove','--force',str(work),check=False)
          except Exception as error:
              report['error'] = str(error)
          (out/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report),flush=True)
          if 'error' in report: raise SystemExit(1)
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: component-precision-repair
          path: ${{ runner.temp }}/component-repair/
          retention-days: 1
