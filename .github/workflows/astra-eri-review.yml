name: Scoped generated CPU ERI review
on:
  push:
    branches: [agent/astra-review-all-20261001-1535]
    paths: [.github/workflows/astra-eri-review.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 192829ce9aa8a49d7f260b599d654f20ae976fc0
          persist-credentials: false
      - run: python3 -m pip install pytest numpy scipy pyscf==2.14.0
      - name: Execute independent compiled primitive and symmetry gates
        env:
          PYTHONPATH: python:.
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -o pipefail
          python3 -m pytest -q -o addopts= --import-mode=importlib tests/python/test_eri_cpu_codegen.py | tee "$RUNNER_TEMP/eri-review.log"
          git rev-parse HEAD > "$RUNNER_TEMP/eri-review-head.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-eri-review-1535
          path: |
            ${{ runner.temp }}/eri-review.log
            ${{ runner.temp }}/eri-review-head.txt
          retention-days: 1
