name: Scoped review follow-up
on:
  push:
    branches: [agent/astra-open-pr-round-20261002]
    paths: [.github/workflows/astra-review-followup.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: |
          python3 -m venv "$RUNNER_TEMP/review-venv"
          "$RUNNER_TEMP/review-venv/bin/pip" install numpy scipy pytest pyyaml ruff==0.16.9
      - name: Check the final staged evidence bytes
        env:
          REVIEW_PR: '1651'
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: |
          "$RUNNER_TEMP/review-venv/bin/python" - <<'PY'
          import ast
          from pathlib import Path
          import yaml
          workflow=yaml.safe_load(Path('.github/workflows/astra-open-pr-repairs.yml').read_text())
          step=next(s for s in workflow['jobs']['repair']['steps'] if s.get('name')=='Validate exact repair and publish isolated result ref')
          source=step['run'].split("python3 - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          old='            extras=[]'
          assert source.count(old)==1
          source=source.replace(old,"            run('git','add','--',*sorted(allowed),cwd=work)\n"+old)
          ast.parse(source)
          exec(compile(source,'<reviewed evidence validation>','exec'))
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: astra-evidence-final
          path: ${{ runner.temp }}/review-repair-1651/
          retention-days: 1
  concurrent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pr: [1654, 1659, 1664]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: |
          python3 -m venv "$RUNNER_TEMP/review-venv"
          "$RUNNER_TEMP/review-venv/bin/pip" install numpy scipy pytest pyyaml ruff==0.16.9
      - name: Preserve concurrent descendants and execute focused regressions
        env:
          REVIEW_PR: ${{ matrix.pr }}
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: |
          python3 - <<'PY'
          import ast,base64,gzip,hashlib,json,os,subprocess,tempfile
          from pathlib import Path
          root=Path.cwd();number=os.environ['REVIEW_PR'];out=Path(os.environ['RUNNER_TEMP'])/('verify-'+number);out.mkdir()
          heads={'1654':'0b568b8aeccf92d997bffa50f348d4e9880c96d9','1659':'2e141cbeeafb7b53272ef5422e9e52fd690a1ec9','1664':'e04d270fccada65d8fa4bc53e4df22a6b79b33de'}
          report={'pr':int(number),'head':heads[number]}
          def run(*args,cwd=root,check=True,env=None,input=None):
              result=subprocess.run(args,cwd=cwd,capture_output=True,text=True,env=env,input=input)
              if check and result.returncode: raise RuntimeError((result.stdout+result.stderr)[-12000:])
              return result
          try:
              encoded=(root/'.github/astra-open-pr-repairs.b64').read_text().strip()
              for old,new in [('fzXG7bbrug7','fzXG7rug7'),('hsBG0FUFFyj','hsBG0UFFyj'),('PB9mbLqBqB5','PB9mbLqB5')]: encoded=encoded.replace(old,new)
              decoded=gzip.decompress(base64.b64decode(encoded,validate=True))
              assert hashlib.sha256(decoded).hexdigest()=='2dd7f58a16ff27a8c61749ebb0d3a5d2afc050f80b62e78e5c77778b85b1daa2'
              record=json.loads(decoded)[number];head=heads[number];branch=record['branch'];report['branch']=branch
              remote=run('git','ls-remote','origin','refs/heads/'+branch).stdout.split()
              if not remote or remote[0]!=head: raise RuntimeError('head moved; no changes made')
              run('git','fetch','--no-tags','origin',head)
              run('git','merge-base','--is-ancestor',record['head'],head)
              with tempfile.TemporaryDirectory() as temporary:
                  work=Path(temporary)/'checkout';run('git','worktree','add','--detach',str(work),head)
                  try:
                      tests=list(record['tests']);changed=[]
                      if number=='1654':
                          name='tests/python/test_stationary_df_fail_closed.py'
                          run('git','apply','--include='+name,'-',cwd=work,input=record['patch'])
                          tests += ['test_ks_snapshot_native_cpu_gradient.py','test_ks_snapshot_native_functional.py']
                          # This independent source-executing test is temporary;
                          # the already-published concurrent implementation is not rewritten.
                      if number=='1664':
                          name='tests/python/test_coulomb_optional_allocation.py'
                          run('git','apply','--include='+name,'-',cwd=work,input=record['patch'])
                          path=work/'tests/python/test_direct_shell_derivative_owner.py'
                          source=path.read_text()
                          old='    assert "auto* output = exchange->force" in bridge'
                          if source.count(old)!=1: raise RuntimeError('unexpected owner-test anchor')
                          source=source.replace(old,'    assert "exchange && exchange->force_capability && exchange->shared && exchange->force" in bridge\n    assert "auto* output = generated_owner ? exchange->force : source->derivative" in bridge')
                          path.write_text(source)
                          changed=[name,str(path.relative_to(work))]
                          ruff=str(Path(os.environ['RUNNER_TEMP'])/'review-venv/bin/ruff')
                          run(ruff,'check','--fix',*changed,cwd=work);run(ruff,'format',*changed,cwd=work)
                      python=str(Path(os.environ['RUNNER_TEMP'])/'review-venv/bin/python');env=dict(os.environ)
                      env['PYTHONPATH']=os.pathsep.join([str(work/'python'),str(work),str(work/'tests/python')])
                      result=run(python,'-m','pytest','-q','-o','addopts=',*['tests/python/'+t for t in tests],cwd=work,env=env,check=False)
                      (out/'tests.log').write_text(result.stdout+result.stderr);report['test_returncode']=result.returncode
                      report['test_summary']='\n'.join((result.stdout+result.stderr).splitlines()[-16:])
                      if result.returncode: raise RuntimeError('focused validation failed')
                      if changed:
                          run('git','add','--',*changed,cwd=work)
                          actual=set(run('git','diff','--cached','--name-only',cwd=work).stdout.splitlines())
                          if actual!=set(changed): raise RuntimeError('unexpected changed paths')
                          run('git','diff','--cached','--check',cwd=work)
                          run('git','-c','user.name=ChatGPT','-c','user.email=chatgpt@users.noreply.github.com','commit','-m','fix(tests): preserve through-f allocation and owner regressions\n\nRetain concurrent parent fixes and test actual current owner dispatch.\nNo scientific implementation, tolerance or capability is changed.\n\nAgent: ChatGPT\nModel: GPT-6 Astra Pro',cwd=work)
                          report['commit']=run('git','rev-parse','HEAD',cwd=work).stdout.strip();report['tree']=run('git','rev-parse','HEAD^{tree}',cwd=work).stdout.strip()
                          report['result_branch']='agent/astra-fixed-1664-20261002'
                          if run('git','ls-remote','origin','refs/heads/'+report['result_branch']).stdout.strip(): raise RuntimeError('result ref exists')
                          (out/'repair.patch').write_text(run('git','diff',head,'HEAD',cwd=work).stdout)
                          for p in changed:
                              dest=out/'files'/p;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes((work/p).read_bytes())
                          run('git','push','origin','HEAD:refs/heads/'+report['result_branch'],cwd=work);report['published_result']=True
                      else: report['verified_concurrent_head']=True
                  finally: run('git','worktree','remove','--force',str(work),check=False)
          except Exception as error: report['error']=str(error)
          (out/'report.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report),flush=True)
          if 'error' in report: raise SystemExit(1)
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: astra-concurrent-${{ matrix.pr }}
          path: ${{ runner.temp }}/verify-${{ matrix.pr }}/
          retention-days: 1
