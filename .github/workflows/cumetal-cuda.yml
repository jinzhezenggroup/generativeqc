name: CuMetal CUDA

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read

# Preserve the running job and let GitHub replace only superseded pending work.
concurrency:
  group: cumetal-cuda-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  merge_queue_liveness:
    name: Merge queue liveness
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      active: ${{ steps.liveness.outputs.active }}
    steps:
      - name: Check merge-group ref still exists
        id: liveness
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "merge_group" ]]; then
            echo "active=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          ref="${GITHUB_REF#refs/}"
          error_file="$(mktemp)"
          if gh api --silent "/repos/${GITHUB_REPOSITORY}/git/ref/${ref}" 2>"${error_file}"; then
            echo "active=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if grep -q '(HTTP 404)' "${error_file}"; then
            echo "::notice::Merge-group ref ${GITHUB_REF} no longer exists; skipping orphaned CI."
            echo "active=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::warning::Unable to verify merge-group ref; running CI fail-open."
          cat "${error_file}" >&2
          echo "active=true" >> "${GITHUB_OUTPUT}"

  cuda-tests:
    name: CUDA runtime tests (CuMetal / Apple GPU)
    needs: merge_queue_liveness
    if: needs.merge_queue_liveness.outputs.active != 'false'
    runs-on: macos-26
    # Keep the 40-minute qualification budget inside a separate finite job budget.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 75 || 30 }}
    env:
      CUMETAL_COMMIT: e87f368060cf09a45b148b4f8892470c74093ebd
      CUMETAL_SOURCE: /tmp/cuda-metal
      CUMETAL_PREFIX: /tmp/cumetal-install
      CUMETAL_CCACHE_DIR: /tmp/cumetal-ccache
      # Registered PTX targets AIR 2.8 / macOS 26. Keep the runner, Metal
      # compiler, SDK, and immutable build-tree cache identity aligned.
      CUMETAL_TOOLCHAIN_ID: macos26-xcode26.3-sdk26.2
      CUMETAL_XCODE_VERSION: "26.3"
      CUMETAL_MACOS_SDK_VERSION: "26.2"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GENERATIVEQC_BUILD: ${{ github.workspace }}/build-cumetal
      CCACHE_DIR: /tmp/generativeqc-ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Apple Silicon and CuMetal toolchain
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test -d "$DEVELOPER_DIR"
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          grep -Fxq "Xcode $CUMETAL_XCODE_VERSION" <<< "$version"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          printf 'macOS SDK %s\n' "$sdk_version"
          test "$sdk_version" = "$CUMETAL_MACOS_SDK_VERSION"
          xcrun --sdk macosx --show-sdk-path
          xcrun --find metal
          xcrun metal --version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true

      - name: Prepare Python codegen environment
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python numpy

      - name: Install CuMetal build prerequisites and ccache
        run: brew install llvm z3 ninja ccache

      - name: Restore CuMetal toolchain
        id: cache-cumetal
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cuda-metal
            /tmp/cumetal-install
          key: cumetal-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_TOOLCHAIN_ID }}-${{ env.CUMETAL_COMMIT }}

      - name: Restore CuMetal ccache
        id: cumetal_ccache
        if: steps.cache-cumetal.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CUMETAL_CCACHE_DIR }}
          key: ccache-cumetal-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_TOOLCHAIN_ID }}-${{ env.CUMETAL_COMMIT }}
          restore-keys: |
            ccache-cumetal-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore GenerativeQC ccache
        id: generativeqc_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          # Include every family that can alter generated/native compilation.
          # The previous key omitted compiler/CMake inputs, so an immutable
          # exact cache could stay permanently half-stale after codegen changes.
          key: ccache-cumetal-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_TOOLCHAIN_ID }}-${{ env.CUMETAL_COMMIT }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'include/**', 'src/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'tests/native/**', 'tools/**', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          # ccache validates compiler/flags/headers when reusing older entries;
          # unlike the immutable toolchain directory, these are safe fallbacks.
          restore-keys: |
            ccache-cumetal-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_TOOLCHAIN_ID }}-${{ env.CUMETAL_COMMIT }}-
            ccache-cumetal-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_COMMIT }}-
            ccache-cumetal-${{ runner.os }}-${{ runner.arch }}-${{ env.CUMETAL_COMMIT }}-

      - name: Build pinned CuMetal
        if: steps.cache-cumetal.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ env.CUMETAL_CCACHE_DIR }}
          CCACHE_COMPILERCHECK: content
        run: |
          ccache --zero-stats
          git clone --recurse-submodules https://github.com/Lulzx/cuda-metal.git "$CUMETAL_SOURCE"
          git -C "$CUMETAL_SOURCE" checkout "$CUMETAL_COMMIT"
          git -C "$CUMETAL_SOURCE" submodule update --init --recursive
          cmake -S "$CUMETAL_SOURCE" -B "$CUMETAL_SOURCE/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$CUMETAL_PREFIX" \
            -DCMAKE_C_COMPILER_LAUNCHER="$(command -v ccache)" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$(command -v ccache)" \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER="$(command -v ccache)" \
            -DCUMETAL_BUILD_TESTS=OFF \
            -DCUMETAL_ENABLE_BINARY_SHIM=OFF \
            -DLLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm"
          cmake --build "$CUMETAL_SOURCE/build" --parallel 3
          cmake --install "$CUMETAL_SOURCE/build"
          ccache --show-stats

      - name: Save CuMetal compiler cache
        if: github.event_name != 'merge_group' && steps.cache-cumetal.outputs.cache-hit != 'true' && steps.cumetal_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CUMETAL_CCACHE_DIR }}
          key: ${{ steps.cumetal_ccache.outputs.cache-primary-key }}

      - name: Verify CuMetal
        run: CUMETAL_ROOT="$CUMETAL_PREFIX" "$CUMETAL_PREFIX/bin/cumetal" doctor

      - name: Compare exact retained CuMetal PTX
        id: retained_ptx
        # A compiler result cannot replace the real QC endpoint gate below.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number == 1997 &&
          github.event.action == 'synchronize' &&
          github.event.before == '48e7afd1cb8e52f0abb85af08727e7684b969631' &&
          github.run_attempt == 1
        continue-on-error: true
        timeout-minutes: 2
        env:
          CUMETAL_ROOT: /tmp/cumetal-install
          DYLD_LIBRARY_PATH: /tmp/cuda-metal/build
          CUMETAL_COMPARISON_OUTPUT: ${{ runner.temp }}/cumetal-retained-ptx
        run: .venv/bin/python .github/scripts/compare_cumetal_ptx.py

      - name: Preserve exact-input CuMetal compiler comparison
        if: always() && steps.retained_ptx.outcome != 'skipped' && steps.retained_ptx.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cumetal-retained-ptx-comparison
          path: ${{ runner.temp }}/cumetal-retained-ptx
          if-no-files-found: warn
          retention-days: 1

      - name: Generate a CMake CUDA toolkit backed by CuMetal
        run: |
          FAKE_CUDA="$CUMETAL_SOURCE/build/cumetal-cuda-toolkit"
          if [[ ! -x "$FAKE_CUDA/bin/nvcc" ]]; then
            CUMETAL_BUILD_DIR="$CUMETAL_SOURCE/build" \
              bash "$CUMETAL_SOURCE/scripts/build_llama_cpp_cumetal.sh" --toolkit-only
          fi
          # GenerativeQC requires CUDA Toolkit >= 12.9. CuMetal's compatibility shim
          # reports 12.2 by default even though this lane is not using NVIDIA
          # toolkit implementation details; make the compatibility identity
          # satisfy GenerativeQC's configured minimum.
          for file in \
            "$FAKE_CUDA/version.json" \
            "$FAKE_CUDA/version.txt" \
            "$FAKE_CUDA/bin/nvcc" \
            "$FAKE_CUDA/lib/cmake/CUDAToolkit/CUDAToolkitConfig.cmake" \
            "$FAKE_CUDA/lib/cmake/CUDAToolkit/CUDAToolkitConfigVersion.cmake"; do
            if [[ -f "$file" ]]; then
              sed -i '' 's/12\.2/12.9/g' "$file"
            fi
          done
          # CuMetal implements these APIs in libcumetal.dylib. Ensure CMake's
          # FindCUDAToolkit can resolve the library names GenerativeQC links.
          for libdir in lib lib64; do
            mkdir -p "$FAKE_CUDA/$libdir"
            for lib in cudart cublas cublasLt cusolver; do
              ln -sf "$CUMETAL_SOURCE/build/libcumetal.dylib" \
                "$FAKE_CUDA/$libdir/lib${lib}.dylib"
            done
          done
          "$FAKE_CUDA/bin/nvcc" --version

      - name: Save CuMetal toolchain
        if: github.event_name != 'merge_group' && steps.cache-cumetal.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cuda-metal
            /tmp/cumetal-install
          key: ${{ steps.cache-cumetal.outputs.cache-primary-key }}

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Configure GenerativeQC with CUDA tests enabled
        run: |
          FAKE_CUDA="$CUMETAL_SOURCE/build/cumetal-cuda-toolkit"
          PATH="$FAKE_CUDA/bin:$PATH" cmake -S . -B "$GENERATIVEQC_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$(brew --prefix llvm)/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++" \
            -DCMAKE_CUDA_COMPILER="$FAKE_CUDA/bin/nvcc" \
            -DCMAKE_CUDA_COMPILER_LIBRARY_ROOT="$FAKE_CUDA" \
            -DCUDAToolkit_ROOT="$FAKE_CUDA" \
            -DCMAKE_CUDA_ARCHITECTURES=80 \
            -DPython3_EXECUTABLE="${GITHUB_WORKSPACE}/.venv/bin/python" \
            -DGENERATIVEQC_CUDA_ARCHITECTURES=80 \
            -DGENERATIVEQC_CUDA_COMPILE_ARCHITECTURES=80 \
            -DGENERATIVEQC_CUDA_PROVIDER=cumetal \
            -DGENERATIVEQC_AOT_PROFILE=portable \
            -DGENERATIVEQC_BUILD_TESTS=ON \
            -DGENERATIVEQC_COMPILER_CACHE=ccache

      - name: Build CUDA runtime test target
        run: cmake --build "$GENERATIVEQC_BUILD" --target generativeqc_cuda_runtime_tests --parallel 3

      - name: Save GenerativeQC ccache
        if: github.event_name != 'merge_group' && steps.generativeqc_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.generativeqc_ccache.outputs.cache-primary-key }}

      - name: Show ccache statistics
        run: ccache --show-stats

      # CuMetal's fake-nvcc CMake path currently links a normal CUDA executable
      # but does not embed the metallib needed by its runtime registration. Use
      # CuMetal's source-first compiler for the execution image while retaining
      # the same source file, CMake target and CTest registration used by nvcc.
      - name: Prepare CuMetal execution image for the normal CTest
        run: |
          CUMETAL_ROOT="$CUMETAL_PREFIX" \
            "$CUMETAL_PREFIX/bin/cumetalc" tests/native/test_cuda_runtime.cu \
            -I"$CUMETAL_PREFIX/include" \
            -I"${GITHUB_WORKSPACE}" \
            -I"${GITHUB_WORKSPACE}/include" \
            -I"${GITHUB_WORKSPACE}/src" \
            -o "$GENERATIVEQC_BUILD/generativeqc_cuda_runtime_tests.cumetal"
          mv "$GENERATIVEQC_BUILD/generativeqc_cuda_runtime_tests" \
             "$GENERATIVEQC_BUILD/generativeqc_cuda_runtime_tests.cmake"
          mv "$GENERATIVEQC_BUILD/generativeqc_cuda_runtime_tests.cumetal" \
             "$GENERATIVEQC_BUILD/generativeqc_cuda_runtime_tests"

      - name: Run CUDA runtime CTest on the Apple GPU
        timeout-minutes: 2
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          CUMETAL_ROOT="$CUMETAL_PREFIX" \
          DYLD_LIBRARY_PATH="$CUMETAL_SOURCE/build${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" \
          CUMETAL_TRACE_GPU=1 \
            ctest --test-dir "$GENERATIVEQC_BUILD" -V \
              -R '^generativeqc_cuda_runtime_tests$' \
              --output-junit "$GITHUB_WORKSPACE/test-results/generativeqc-cuda-runtime-junit.xml" \
              2>&1 | tee /tmp/generativeqc-cuda-runtime.log
          grep -q 'device=apple_gpu' /tmp/generativeqc-cuda-runtime.log
          grep -q 'launch_success=true' /tmp/generativeqc-cuda-runtime.log
          grep -q 'PASS: CUDA runtime contracts' /tmp/generativeqc-cuda-runtime.log

      - name: Install bounded CuMetal QC test dependency
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: uv pip install --python .venv/bin/python pytest

      # Quarantine the exact pinned shared-owner QC lane for upstream failures.
      # The runner reports explicit JUnit skips and QC NOT QUALIFIED; new nodes
      # retain strict acceptance. Native build/CTest above remain required.
      - name: Run bounded CuMetal QC endpoint gate
        id: qc_gate
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        timeout-minutes: 6
        env:
          CUMETAL_ROOT: /tmp/cumetal-install
          DYLD_LIBRARY_PATH: /tmp/cuda-metal/build
          GENERATIVEQC_LIBRARY: ${{ github.workspace }}/build-cumetal/libgenerativeqc.dylib
          CUMETAL_TRACE_GPU: "1"
          CUMETAL_CUDA_TEST_MODE: gate
          CUMETAL_CUDA_QUARANTINE: upstream-ptx-e87f368
          CUMETAL_DEBUG_REGISTRATION: "1"
          # Strict typed PTX lowering retains the existing fast48 arithmetic
          # contract and fails rather than retrying the legacy compiler.
          CUMETAL_PTX_BACKEND: cumetal-ir
          CUMETAL_FP64_MODE: fast48
          CUMETAL_CACHE_DIR: ${{ runner.temp }}/cumetal-qc-jit-${{ env.CUMETAL_TOOLCHAIN_ID }}-cumetal-ir-fast48
          CUMETAL_CUDA_TEST_TIMEOUT_SECONDS: "90"
          CUMETAL_CUDA_SUITE_BUDGET_SECONDS: "300"
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}
        run: .venv/bin/python .github/scripts/run_cumetal_cuda_pytests.py

      - name: Diagnose one CuMetal RHF timeout
        id: qc_timeout_diagnostic
        # Observe one timed-out strict gate with its partially warmed JIT cache.
        # This result can never replace the required endpoint acceptance result.
        if: >-
          failure() && github.event_name == 'pull_request' &&
          github.event.pull_request.number == 1997 &&
          github.event.action == 'synchronize' &&
          github.event.before == 'de9eebb88be4d7ded840a35541daff2ce43a7a44' &&
          github.run_attempt == 1 && steps.qc_gate.outcome == 'failure' &&
          steps.qc_gate.outputs.rhf_timed_out == 'true'
        continue-on-error: true
        timeout-minutes: 4
        env:
          CUMETAL_ROOT: /tmp/cumetal-install
          DYLD_LIBRARY_PATH: /tmp/cuda-metal/build
          GENERATIVEQC_LIBRARY: ${{ github.workspace }}/build-cumetal/libgenerativeqc.dylib
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}
          CUMETAL_PTX_BACKEND: cumetal-ir
          CUMETAL_FP64_MODE: fast48
          CUMETAL_CACHE_DIR: ${{ runner.temp }}/cumetal-qc-jit-${{ env.CUMETAL_TOOLCHAIN_ID }}-cumetal-ir-fast48
          CUMETAL_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/cumetal-timeout-diagnostic
          CUMETAL_DIAGNOSTIC_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: .venv/bin/python .github/scripts/diagnose_cumetal_timeout.py

      - name: Preserve one-shot CuMetal timeout diagnostic
        if: always() && steps.qc_timeout_diagnostic.outcome != 'skipped' && steps.qc_timeout_diagnostic.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cumetal-timeout-diagnostic-only
          path: ${{ runner.temp }}/cumetal-timeout-diagnostic
          if-no-files-found: warn
          retention-days: 1

      - name: Capture one CuMetal PTX compiler diagnostic
        # One authorized capture only: the first CI attempt for the next update
        # from this exact PR head. This never substitutes for the failed gate.
        id: qc_ptx_diagnostic
        if: >-
          failure() && github.event_name == 'pull_request' &&
          github.event.pull_request.number == 1997 &&
          github.event.action == 'synchronize' &&
          github.event.before == '0f67b413da60fa3d146eead32360901adeda4698' &&
          github.run_attempt == 1 && steps.qc_gate.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 4
        env:
          CUMETAL_ROOT: /tmp/cumetal-install
          DYLD_LIBRARY_PATH: /tmp/cuda-metal/build
          GENERATIVEQC_LIBRARY: ${{ github.workspace }}/build-cumetal/libgenerativeqc.dylib
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}
          CUMETAL_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/cumetal-ptx-diagnostic
          CUMETAL_DIAGNOSTIC_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: .venv/bin/python .github/scripts/diagnose_cumetal_ptx.py

      - name: Preserve one-shot CuMetal compiler diagnostic
        if: always() && steps.qc_ptx_diagnostic.outcome != 'skipped' && steps.qc_ptx_diagnostic.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cumetal-ptx-diagnostic-only
          path: |
            ${{ runner.temp }}/cumetal-ptx-diagnostic/diagnostic.json
            ${{ runner.temp }}/cumetal-ptx-diagnostic/*.txt
            ${{ runner.temp }}/cumetal-ptx-diagnostic/legacy-capture.xml
            ${{ runner.temp }}/cumetal-ptx-diagnostic/ptx/*.ptx
            ${{ runner.temp }}/cumetal-ptx-diagnostic/typed-output.metal
          if-no-files-found: warn
          retention-days: 1

      - name: Preserve CUDA test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-cuda-runtime
          path: test-results/generativeqc-cuda-runtime-junit.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Install Python test dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # The CuMetal lane already built the native library above. Installing the
        # project itself would start a second ordinary macOS wheel build, whose
        # scoped GFN2 wheel provider is intentionally Linux-only.
        run: uv pip install --python .venv/bin/python 'pytest>=8'

      - name: Run bounded CuMetal QC qualification on the Apple GPU
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 45
        env:
          CUMETAL_ROOT: /tmp/cumetal-install
          DYLD_LIBRARY_PATH: /tmp/cuda-metal/build
          GENERATIVEQC_LIBRARY: ${{ github.workspace }}/build-cumetal/libgenerativeqc.dylib
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}
          CUMETAL_TRACE_GPU: "1"
          CUMETAL_CUDA_TEST_MODE: full
          # Same exact scope as routine CI; provider changes must fail closed.
          CUMETAL_CUDA_QUARANTINE: upstream-ptx-e87f368
          CUMETAL_DEBUG_REGISTRATION: "1"
          CUMETAL_PTX_BACKEND: cumetal-ir
          CUMETAL_FP64_MODE: fast48
          CUMETAL_CACHE_DIR: ${{ runner.temp }}/cumetal-qc-jit-${{ env.CUMETAL_TOOLCHAIN_ID }}-cumetal-ir-fast48
          CUMETAL_CUDA_TEST_TIMEOUT_SECONDS: "180"
          CUMETAL_CUDA_SUITE_BUDGET_SECONDS: "2400"
          GENERATIVEQC_DFT_CUDA_TEST: "1"
        run: .venv/bin/python .github/scripts/run_cumetal_cuda_pytests.py

      - name: Preserve CuMetal QC endpoint diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-cumetal-qc
          path: /tmp/generativeqc-cuda-test-*.xml
          if-no-files-found: ignore
          retention-days: 1


  upload-test-results:
    name: Upload CUDA test results
    timeout-minutes: 8
    needs: cuda-tests
    if: ${{ !cancelled() && (needs.cuda-tests.result == 'success' || needs.cuda-tests.result == 'failure') }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download CUDA test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-results-cuda-runtime
          path: test-results

      - name: Upload CUDA test results to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: test-results/generativeqc-cuda-runtime-junit.xml
          flags: cuda-runtime
          name: test-results/cuda-runtime
          report_type: test_results
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          version: v11.3.1
