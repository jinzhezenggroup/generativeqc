name: Scoped failed-job review evidence
on:
  push:
    branches: [agent/astra-review-all-20261001-1535]
    paths: [.github/workflows/astra-failure-evidence.yml]
permissions:
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read failed repository job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, os, re, urllib.request
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'failed-jobs'
          out.mkdir()
          jobs = {
              '1651-core-a':110432374313, '1651-core-b':110432374592,
              '1651-precommit':110423973400, '1652-core-a':110420873098,
              '1652-core-b':110420872924, '1653-core-b':110417105670,
              '1654-core-a':110428562351, '1654-core-b':110428562665,
              '1655-cumetal':110422130727, '1657-core-a':110433226392,
              '1659-core-a':110437552386, '1660-gcc':110435298372,
          }
          def fetch(item):
              name, job = item
              url = f'https://api.github.com/repos/jinzhezenggroup/generativeqc/actions/jobs/{job}/logs'
              req = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      content = response.read().decode('utf-8-sig', errors='replace')
                  content = re.sub(r'\x1b\[[0-9;]*m','',content)
                  (out/(name+'.log')).write_text(content)
                  print(name, len(content), flush=True)
              except Exception as error:
                  (out/(name+'.error')).write_text(str(error))
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(fetch, jobs.items()))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: astra-failed-jobs-1535
          path: ${{ runner.temp }}/failed-jobs/
          retention-days: 1
