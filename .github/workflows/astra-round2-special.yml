name: Round-two correctness follow-ups
on:
  push:
    branches: [agent/astra-review-round2-20261001]
    paths: [.github/workflows/astra-round2-special.yml]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check pytest numpy scipy pyyaml ruff==0.16.9
      - name: Validate inspected correctness repairs
        run: |
          python3 - <<'PY'
          import json, os, runpy, subprocess, tempfile
          from pathlib import Path
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'special';out.mkdir()
          master='299b641a013c915fed5c8866fa9581ff46ec564f'
          helper=runpy.run_path(str(root/'.github/round2-special-repair.py'))
          original_edit=helper['edit']
          def scoped_edit(root,path,before,after):
            # The alias-extraction spelling occurs in two classifiers. Scope
            # this reviewed insertion to _matrix_chain_lhs's unique signature.
            if path=='tools/audit_native_complexity.py' and before.startswith('    aliases = '):
              prefix='    loop_variables: tuple[str, ...],\n) -> str | None:\n'
              return original_edit(root,path,prefix+before,prefix+after)
            return original_edit(root,path,before,after)
          helper['scanner'].__globals__['edit']=scoped_edit
          specs=[
            (1623,'agent/1580-native-complexity-audit','93c0864bfd68670482977e82f81a3721ce715394',['test_native_complexity_audit.py']),
            (1510,'perf/1479-fuse-geometry-reduction','9abc8845760b75b05dff9f8ddacc706d8df6f938',['test_dft_mp_v1_capacity.py','test_stationary_geometry_kernel_host.py','test_stationary_owner_kernel_abi.py','test_stationary_cuda_lowering.py']),
          ]
          results=[]
          def run(*args,cwd=root,check=True,env=None):
            p=subprocess.run(args,cwd=cwd,capture_output=True,text=True,env=env)
            if check and p.returncode:raise RuntimeError((p.stderr+p.stdout)[-6000:])
            return p
          for n,branch,head,tests in specs:
            result={'pr':n,'branch':branch,'before':head};d=out/str(n);d.mkdir()
            try:
              live=run('git','ls-remote','origin','refs/heads/'+branch).stdout.split()
              if not live or live[0]!=head:raise RuntimeError('head moved; no changes made')
              with tempfile.TemporaryDirectory(prefix='round2-special-') as temp:
                work=Path(temp)/'source';run('git','worktree','add','--detach',str(work),head)
                try:
                  if n==1510:
                    result['master']=master
                    merge=run('git','-c','user.name=ChatGPT','-c','user.email=chatgpt@users.noreply.github.com','-c','merge.conflictStyle=zdiff3','merge','--no-commit','--no-ff',master,cwd=work,check=False)
                    conflicts=set(run('git','diff','--name-only','--diff-filter=U',cwd=work).stdout.splitlines())
                    if conflicts!={'tests/python/test_dft_mp_v1_capacity.py','tools/dft_mp_v1/qualify_capacity.py'}:raise RuntimeError('unexpected merge conflicts')
                    helper['geometry'](work)
                  else:helper['scanner'](work)
                  files=run('git','diff','--name-only',cwd=work).stdout.splitlines()
                  pyfiles=[f for f in files if f.endswith('.py')]
                  run('python3','-m','ruff','check','--fix',*pyfiles,cwd=work)
                  run('python3','-m','ruff','format',*pyfiles,cwd=work)
                  env=dict(os.environ);env['PYTHONPATH']=str(work/'python')+os.pathsep+str(work)
                  tested=run('python3','-m','pytest','-q','-o','addopts=','--import-mode=importlib',*['tests/python/'+v for v in tests],cwd=work,env=env,check=False)
                  (d/'tests.log').write_text(tested.stdout+tested.stderr)
                  result['test_returncode']=tested.returncode;result['summary']='\n'.join((tested.stdout+tested.stderr).splitlines()[-12:])
                  if tested.returncode:raise RuntimeError('regression tests failed; no push')
                  run('git','add','-u',cwd=work);run('git','diff','--cached','--check',cwd=work)
                  message=f'fix(review): repair correctness blockers in PR #{n}\n\nPreserve inspected scientific/source contracts and explicit failure gates.\nClassifier or capacity/fused-owner regression suites passed. Full PR CI\nand any outstanding NVIDIA molecular qualification remain required.\n\nAgent: ChatGPT\nModel: GPT-6 Astra Pro'
                  run('git','-c','user.name=ChatGPT','-c','user.email=chatgpt@users.noreply.github.com','commit','-m',message,cwd=work)
                  result['commit']=run('git','rev-parse','HEAD',cwd=work).stdout.strip();result['tree']=run('git','rev-parse','HEAD^{tree}',cwd=work).stdout.strip()
                  (d/'repair.patch').write_text(run('git','diff',head,result['commit'],cwd=work).stdout)
                  run('git','push','origin','HEAD:refs/heads/'+branch,cwd=work);result['pushed']=True
                finally:run('git','worktree','remove','--force',str(work),check=False)
            except Exception as e:result['error']=str(e)
            results.append(result);(out/'report.json').write_text(json.dumps(results,indent=2)+'\n');print(json.dumps(result),flush=True)
          if any('error' in v for v in results):raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-round2-special-repairs
          path: ${{ runner.temp }}/special/
          retention-days: 1
