name: CI

on:
  # Pull requests and merge groups own correctness. Master pushes remain only
  # to publish stable caches and exact-source CPU performance baselines.
  push:
    branches: [master]
  pull_request:
  # Run required CI checks against GitHub's synthetic merge-queue commit.
  merge_group:
    types: [checks_requested]
  # Keep the exhaustive water Cartesian MP2-gradient finite difference off the
  # ordinary feedback path while still exercising it regularly.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CCACHE_VERSION: "4.14"

# Coalesce superseded PR and merge-group runs by their logical ref. Keep the
# active run; GitHub concurrency retains at most one running plus one pending
# run per group and replaces an older pending run with the newest one. Deleted
# queue refs are still screened by the liveness job below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' || github.event_name == 'merge_group') && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  merge_queue_liveness:
    name: Merge queue liveness
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      active: ${{ steps.liveness.outputs.active }}
    steps:
      - name: Check merge-group ref still exists
        id: liveness
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "merge_group" ]]; then
            echo "active=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          ref="${GITHUB_REF#refs/}"
          error_file="$(mktemp)"
          if gh api --silent "/repos/${GITHUB_REPOSITORY}/git/ref/${ref}" 2>"${error_file}"; then
            echo "active=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if grep -q '(HTTP 404)' "${error_file}"; then
            echo "::notice::Merge-group ref ${GITHUB_REF} no longer exists; skipping orphaned CI."
            echo "active=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::warning::Unable to verify merge-group ref; running CI fail-open."
          cat "${error_file}" >&2
          echo "active=true" >> "${GITHUB_OUTPUT}"

  master-cpu-cache:
    name: Seed CPU ccache (${{ matrix.compiler }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
      - name: Restore plain CPU ccache
        id: master_cpu_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-cpu-v3-${{ matrix.compiler }}-plain-${{ hashFiles('cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tests/native/**', 'tools/**', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          restore-keys: |
            ccache-cpu-v3-${{ matrix.compiler }}-plain-
      - name: Build plain CPU cache seed
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          ccache --zero-stats
          cmake -S . -B build -G Ninja \
            -DGENERATIVEQC_ENABLE_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DGENERATIVEQC_COMPILER_CACHE=ccache
          cmake --build build --parallel
          ccache --show-stats
      - name: Save plain CPU ccache
        if: steps.master_cpu_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.master_cpu_ccache.outputs.cache-primary-key }}

  master-python-cache:
    name: Seed Python native ccache
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 1G
      GENERATIVEQC_ENABLE_CUDA: "OFF"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
          cache-suffix: "python-cache-seed-v1"
          prune-cache: true
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
      - name: Restore Python-build ccache
        id: master_python_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-python-v2-${{ hashFiles('cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          restore-keys: |
            ccache-python-v2-
            ccache-python-
      - name: Prepare Python native cache seed
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python \
            numpy scipy scikit-build-core scipy-openblas32
          xtb_linalg="$(
            .venv/bin/python - <<'PY_INNER'
          from pathlib import Path
          import scipy

          site = Path(scipy.__file__).resolve().parent.parent
          matches = sorted((site / "scipy.libs").glob("libscipy_openblas*.so"))
          if len(matches) != 1:
              raise SystemExit(f"expected one SciPy OpenBLAS runtime, found {matches}")
          print(matches[0])
          PY_INNER
          )"
          echo "GENERATIVEQC_XTB_CPU_LINALG_LIBRARY=${xtb_linalg}" >> "$GITHUB_ENV"
      - name: Build Python native cache seed
        run: |
          ccache --zero-stats
          cmake -S . -B build -G Ninja \
            -DGENERATIVEQC_ENABLE_CUDA=OFF \
            -DGENERATIVEQC_BUILD_TESTS=OFF \
            -DGENERATIVEQC_PYTHON_WHEEL=ON \
            -DGENERATIVEQC_BUNDLE_XTB_OPENBLAS=OFF \
            -DGENERATIVEQC_XTB_CPU_LINALG_LIBRARY="$GENERATIVEQC_XTB_CPU_LINALG_LIBRARY" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGENERATIVEQC_COMPILER_CACHE=ccache
          cmake --build build --parallel
          ccache --show-stats
      - name: Save Python-build ccache
        if: steps.master_python_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.master_python_ccache.outputs.cache-primary-key }}
  cpu:
    needs: merge_queue_liveness
    if: needs.merge_queue_liveness.outputs.active != 'false' && github.event_name != 'push'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    env:
      # Keep each compiler cache bounded so both matrix jobs can share the
      # repository's Actions cache quota. Compiler identity and flags remain
      # part of ccache's own key, so a miss affects speed rather than validity.
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Restore ccache
        id: cpu_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-cpu-v3-${{ matrix.compiler }}-${{ matrix.compiler == 'gcc' && github.event_name != 'merge_group' && 'coverage' || 'plain' }}-${{ hashFiles('cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tests/native/**', 'tools/**', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          restore-keys: |
            ccache-cpu-v3-${{ matrix.compiler }}-${{ matrix.compiler == 'gcc' && github.event_name != 'merge_group' && 'coverage' || 'plain' }}-
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Configure
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          # Instrument only the GCC leg so the existing compiler matrix still
          # exercises an ordinary non-instrumented Clang build.
          COVERAGE_COMPILE_FLAGS: ${{ matrix.compiler == 'gcc' && github.event_name != 'merge_group' && '-fprofile-arcs -ftest-coverage -fprofile-update=atomic' || '' }}
          COVERAGE_LINK_FLAGS: ${{ matrix.compiler == 'gcc' && github.event_name != 'merge_group' && '--coverage' || '' }}
        run: >-
          cmake -S . -B build -G Ninja
          -DGENERATIVEQC_ENABLE_CUDA=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DGENERATIVEQC_COMPILER_CACHE=ccache
          -DCMAKE_CXX_FLAGS="${COVERAGE_COMPILE_FLAGS}"
          -DCMAKE_EXE_LINKER_FLAGS="${COVERAGE_LINK_FLAGS}"
          -DCMAKE_SHARED_LINKER_FLAGS="${COVERAGE_LINK_FLAGS}"
      - name: Build
        run: cmake --build build --parallel
      - name: Save ccache immediately after build
        if: github.event_name != 'merge_group' && steps.cpu_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cpu_ccache.outputs.cache-primary-key }}
      - name: Show ccache statistics
        run: ccache --show-stats
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Generate current CUDA ownership report
        if: matrix.compiler == 'gcc'
        run: |
          mkdir -p .artifacts
          python3 tools/report_cuda_ownership.py --check \
            --output .artifacts/cuda-ownership-current.json
      - name: Preserve current CUDA ownership report
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cuda-ownership-current-${{ github.run_id }}
          path: .artifacts/cuda-ownership-current.json
          retention-days: 14
      - name: Collect C++ coverage
        if: matrix.compiler == 'gcc' && github.event_name != 'merge_group'
        run: |
          sudo apt-get install --yes lcov
          lcov --capture --directory build --output-file coverage-cpp.info \
            --exclude '/usr/*' --exclude '*/tests/*' \
            --ignore-errors mismatch,unused
      - name: Preserve C++ coverage for the upload-only job
        if: matrix.compiler == 'gcc' && github.event_name != 'merge_group'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-cpp
          path: coverage-cpp.info
          retention-days: 1

  cuda-compile:
    name: CUDA 12.9 compile (sm_120)
    needs: merge_queue_liveness
    if: needs.merge_queue_liveness.outputs.active != 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 25
    env:
      CUDACXX: /usr/local/cuda-12.9/bin/nvcc
      LD_LIBRARY_PATH: /usr/local/cuda-12.9/lib64
      # Generated AOT objects are much larger than ordinary CPU objects, so
      # give the CUDA cache enough room while staying within the repo quota.
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Add NVIDIA CUDA repository
        run: |
          curl --fail --silent --show-error --location --output cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring.deb
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Install CUDA 12.9 build dependencies
        run: |
          sudo apt-get install --yes \
            cuda-nvcc-12-9 \
            cuda-cuobjdump-12-9 \
            cuda-cudart-dev-12-9 \
            cuda-cccl-12-9 \
            libcublas-dev-12-9 \
            libcusolver-dev-12-9 \
            libcusparse-12-9 \
            libnvjitlink-12-9 \
            python3-numpy \
            python3-pytest
          "$CUDACXX" --version
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      # GitHub scopes actions/cache entries created by merge_group to the
      # temporary gh-readonly-queue ref, so they cannot seed later queue runs.
      # Publish a bounded snapshot from trusted master pushes and consume it
      # cross-run here; keep actions/cache as a fallback for rollout/reruns.
      - name: Locate trusted master CUDA ccache snapshot
        id: trusted_cuda_ccache
        if: github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id=""
          created_at=""
          source_sha=""
          publish=false
          artifact_name='cuda-ccache-master-12.9-sm120-v2'

          # Trust only artifacts produced by successful pushes of this CI workflow
          # on master. A repository-wide artifact-name lookup is insufficient
          # provenance because another ref/workflow could publish the same name.
          runs_payload=""
          if runs_payload="$(gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=master -f event=push -f status=success -f per_page=20)"; then
            while IFS=$'\t' read -r candidate_run_id candidate_head_sha; do
              [[ -n "$candidate_run_id" ]] || continue
              artifacts_payload=""
              if ! artifacts_payload="$(gh api --method GET \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts" \
                  -f name="${artifact_name}" -f per_page=10)"; then
                echo "::warning::Unable to inspect CUDA ccache artifacts for trusted run ${candidate_run_id}; trying the next run."
                continue
              fi
              candidate_created_at="$(jq -r \
                '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .created_at // empty' \
                <<<"${artifacts_payload}")"
              if [[ -n "$candidate_created_at" ]]; then
                run_id="$candidate_run_id"
                created_at="$candidate_created_at"
                source_sha="$candidate_head_sha"
                break
              fi
            done < <(
              jq -r '
                .workflow_runs[]
                | select(
                    .event == "push"
                    and .head_branch == "master"
                    and .conclusion == "success"
                  )
                | [.id, .head_sha] | @tsv
              ' <<<"${runs_payload}"
            )
          else
            echo "::warning::Unable to discover trusted master CUDA ccache snapshot; falling back to actions/cache or a cold compile."
          fi

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            if [[ -z "$created_at" ]]; then
              # Discovery is acceleration-only. Try to heal a missing/unavailable
              # snapshot, but publication below is also explicitly non-gating.
              publish=true
            else
              created_epoch="$(date -u -d "$created_at" +%s)"
              now_epoch="$(date -u +%s)"
              if (( now_epoch - created_epoch >= 10800 )); then
                publish=true
              else
                # A young snapshot can still predate newly compiled sources.
                # Cover every CUDA cache-key input, plus upstream/generated-data
                # and CI/toolchain configuration. Compare this checked-out push
                # with the run that actually supplied the selected artifact.
                cuda_inputs=(
                  .github cmake python/generativeqc_compiler python/generativeqc
                  CMakeLists.txt CMakePresets.json include src tests/native tools
                  manifests data upstream pyproject.toml uv.lock
                )
                if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]] ||
                    ! git diff --quiet --no-ext-diff --no-textconv \
                      "$source_sha" "$GITHUB_SHA" -- "${cuda_inputs[@]}"; then
                  # A missing/unreadable old commit also requests refresh;
                  # cache discovery remains acceleration-only, never a gate.
                  publish=true
                fi
              fi
            fi
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
      - name: Restore trusted master CUDA ccache snapshot
        id: trusted_cuda_ccache_download
        if: github.event_name == 'merge_group' && steps.trusted_cuda_ccache.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cuda-ccache-master-12.9-sm120-v2
          path: ~/.cache/ccache
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.trusted_cuda_ccache.outputs.run_id }}
      - name: Restore CUDA ccache
        id: cuda_ccache
        if: github.event_name != 'merge_group' || steps.trusted_cuda_ccache_download.outcome != 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-cuda-v2-12.9-sm120-${{ hashFiles('cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'CMakePresets.json', 'include/**', 'src/**', 'tests/native/**', 'tools/**', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          restore-keys: |
            ccache-cuda-v2-12.9-sm120-
            ccache-cuda-12.9-sm120-
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Configure production CUDA compile check
        run: >-
          cmake --preset cuda-release-sm120
          -DGENERATIVEQC_BUILD_TESTS=ON
          -DGENERATIVEQC_CUDA_FAST_COMPILE=ON
          -DGENERATIVEQC_CUDA_COMPILE_JOBS=3
          -DGENERATIVEQC_COMPILER_CACHE=ccache
      - name: Compile production CUDA and runtime CTest
        # This target links the full generativeqc shared library. Native GFN2 CUDA is
        # therefore compiled, device-linked, and consumed through the public
        # method adapter as part of this existing integration gate.
        run: >-
          cmake --build --preset cuda-release-sm120
          --target generativeqc_cuda_runtime_tests --parallel 3
      - name: Compile opted-in AO radial kernels with release resources
        # Default native emission intentionally omits this experimental schedule.
        # Exercise its exact six kernel resource records without running a GPU.
        env:
          PYTHONPATH: python
          GENERATIVEQC_GRID_CUDA_ARCH: sm_120
          CUDA_VISIBLE_DEVICES: ""
        run: |
          test -x "$CUDACXX"
          mkdir -p build/ao-radial-compiler
          cat > build/ao-radial-compiler/nvcc <<'SH'
          #!/bin/sh
          exec ccache "$CUDACXX" "$@"
          SH
          chmod +x build/ao-radial-compiler/nvcc
          export GENERATIVEQC_NVCC="$PWD/build/ao-radial-compiler/nvcc"
          python3 -m pytest -q \
            tests/python/test_cuda_ao_radial_reuse.py::test_emitted_ao_cuda_compiles_with_specialized_resources \
            --basetemp build/ao-radial-compile
      # Merge-group refs are ephemeral, so saving actions/cache there cannot
      # accelerate the next queue group. Stable PR/master refs still benefit.
      - name: Save CUDA ccache immediately after build
        if: github.event_name != 'merge_group' && steps.cuda_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cuda_ccache.outputs.cache-primary-key }}
      - name: Check Fock and proposal preflight without a GPU
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          cmake --build --preset cuda-release-sm120 --target generativeqc_fock_build_tests generativeqc_scf_proposal_tests --parallel 2
          ctest --test-dir build/cuda-release-sm120 \
            -R '^generativeqc_(fock_build|scf_proposal)_tests$' --output-on-failure
      - name: Show CUDA ccache statistics
        run: ccache --show-stats
      - name: Publish trusted master CUDA ccache snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.trusted_cuda_ccache.outputs.publish == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cuda-ccache-master-12.9-sm120-v2
          path: ~/.cache/ccache
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
      - name: Preserve opted-in AO radial resource reports
        if: ${{ always() && github.event_name != 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ao-radial-release-compile
          path: |
            build/ao-radial-compile/**/ao.cu
            build/ao-radial-compile/**/ptxas.txt
            build/ao-radial-compile/**/resources.json
          if-no-files-found: error
          retention-days: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 14 }}

  master-cache-cleanup:
    name: Trim trusted CUDA cache snapshots
    needs: cuda-compile
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.cuda-compile.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep only the two newest trusted CUDA snapshots
        # Cache housekeeping must not invalidate an otherwise successful producer.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name='cuda-ccache-master-12.9-sm120-v2'
          workflow_payload="$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml")"
          workflow_id="$(jq -er '.id | select(type == "number")' <<<"$workflow_payload")"
          artifacts_payload="$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="$artifact_name" -f per_page=100 --paginate --slurp)"
          artifacts="$(jq -c --arg name "$artifact_name" \
            '[.[].artifacts[] | select(.name == $name and .expired == false)]' \
            <<<"$artifacts_payload")"
          candidate_run_ids="$(jq -r '[.[].workflow_run.id // empty] | unique[]' <<<"$artifacts")"
          trusted_artifacts=''
          # A same-name artifact is not proof of provenance. Match restore's
          # successful master-push boundary before counting or deleting it.
          # The current run is still in progress; its new snapshot cannot yet
          # replace either of the two completed, restorable snapshots.
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" =~ ^[0-9]+$ ]]
            run_payload="$(gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            if jq -e --argjson workflow_id "$workflow_id" '
                .workflow_id == $workflow_id
                and .event == "push"
                and .head_branch == "master"
                and .status == "completed"
                and .conclusion == "success"
              ' <<<"$run_payload" >/dev/null; then
              trusted_artifacts+="$(jq -c --argjson run_id "$run_id" \
                '.[] | select(.workflow_run.id == $run_id) | {id, created_at}' \
                <<<"$artifacts")"$'\n'
            fi
          done <<<"$candidate_run_ids"
          # Finish all discovery before any mutation. A failed API request,
          # including a later page, leaves every existing snapshot untouched.
          delete_ids="$(jq -sr 'sort_by([.created_at, .id]) | reverse | .[2:][] | .id' \
            <<<"$trusted_artifacts")"
          while read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<<"$delete_ids"
  # Resource qualification must complete even when production compilation
  # starts cold. Both required jobs check out the exact same event commit;
  # generate the native grid through its original CMake dependency graph here.
  cuda-resources:
    name: CUDA 12.9 release resources (sm_120)
    needs: merge_queue_liveness
    if: needs.merge_queue_liveness.outputs.active != 'false' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDACXX: /usr/local/cuda-12.9/bin/nvcc
      LD_LIBRARY_PATH: /usr/local/cuda-12.9/lib64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Add NVIDIA CUDA repository
        run: |
          curl --fail --silent --show-error --location --output cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring.deb
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Install CUDA 12.9 build dependencies
        run: |
          sudo apt-get install --yes \
            cuda-nvcc-12-9 \
            cuda-cuobjdump-12-9 \
            cuda-cudart-dev-12-9 \
            cuda-cccl-12-9 \
            libcublas-dev-12-9 \
            libcusolver-dev-12-9 \
            libcusparse-12-9 \
            libnvjitlink-12-9 \
            python3-numpy \
            python3-pytest
          "$CUDACXX" --version
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Configure native grid source generation
        run: >-
          cmake --preset cuda-release-sm120
          -DGENERATIVEQC_BUILD_TESTS=ON
          -DGENERATIVEQC_CUDA_FAST_COMPILE=ON
          -DGENERATIVEQC_CUDA_COMPILE_JOBS=3
          -DGENERATIVEQC_COMPILER_CACHE=ccache
      - name: Generate exact native grid source and prerequisite headers
        # Build only this generated-file target, never the library again.
        # The validator below checks these bytes against compiler emission and
        # still uses release flags, independently of the fast compile preset.
        run: >-
          cmake --build --preset cuda-release-sm120
          --target generated/generated_grid_policy.cu --parallel 2
      # This is release resource evidence. The separate production compile-only
      # job uses fast compilation and cannot supply acceptance resources.
      - name: Restore f-shell release objects
        id: f_shell_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/f-shell-cache
          # The validator compiles source emitted by the common/integral compiler
          # stack. Do not invalidate this multi-minute release cache for unrelated
          # XC, method, tensor, include, or tooling changes on merge-group commits.
          # The validator's inner cache still keys generated bytes, toolchain,
          # target, schedule, and generator ABI, so a stale restored snapshot is
          # safe and recompiles only identities that actually changed.
          key: f-shell-cuda-v2-12.9-sm120-${{ hashFiles('python/generativeqc_compiler/common/**', 'python/generativeqc_compiler/integral/**', 'tools/validate_f_shells.py', 'tools/generativeqc_validation/f_shell.py') }}
          restore-keys: |
            f-shell-cuda-v2-12.9-sm120-
            f-shell-cuda-12.9-sm120-
      - name: Compile five representative f classes with release resources
        run: >-
          python3 tools/validate_f_shells.py --tier compile --smoke
          --nvcc "$CUDACXX" --compile-jobs 2 --compile-timeout 900
          --output build/f-shell-smoke.json
      - name: Save f-shell release objects
        if: github.event_name != 'merge_group' && steps.f_shell_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/f-shell-cache
          key: ${{ steps.f_shell_cache.outputs.cache-primary-key }}
      - name: Restore generated XC compile cache
        id: xc_compile_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/xc-cache
          key: xc-cuda-12.9-sm120-${{ hashFiles('include/**', 'python/generativeqc_compiler/common/**', 'python/generativeqc_compiler/integral/**', 'python/generativeqc_compiler/xc/**', 'tools/validate_xc.py') }}
          restore-keys: |
            xc-cuda-12.9-sm120-
      - name: Compile generated XC derivative consumers
        run: >-
          python3 tools/validate_xc.py --tier cuda-compile
          --functionals PBE --nvcc "$CUDACXX"
          --cache build/xc-cache --output build/xc-compile
      - name: Save generated XC compile cache
        if: github.event_name != 'merge_group' && steps.xc_compile_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/xc-cache
          key: ${{ steps.xc_compile_cache.outputs.cache-primary-key }}
      - name: Compile native grid/XC region resources
        run: >-
          python3 tools/validate_native_xc_resources.py
          --nvcc "$CUDACXX" --architecture sm_120
          --generated-dir build/cuda-release-sm120/generated
          --cmake-source build/cuda-release-sm120/generated/generated_grid_policy.cu
          --output build/native-xc-resource
          --functional PBE --npoint 4096 --tile-points 256 --nao 96 --spins 2
      - name: Restore stationary CUDA compile cache
        id: stationary_cuda_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/stationary-cuda-compile
          key: stationary-cuda-12.9-sm120-${{ hashFiles('python/generativeqc_compiler/common/**', 'python/generativeqc_compiler/integral/**', 'python/generativeqc_compiler/method/**', 'python/generativeqc_compiler/tensor/**', 'tools/validate_stationary_cuda_compile.py') }}
          restore-keys: |
            stationary-cuda-12.9-sm120-
      - name: Compile generated r2SCAN stationary CUDA consumer
        run: >-
          python3 tools/validate_stationary_cuda_compile.py
          --nvcc "$CUDACXX" --cache build/stationary-cuda-compile
      - name: Save stationary CUDA compile cache
        if: github.event_name != 'merge_group' && steps.stationary_cuda_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/stationary-cuda-compile
          key: ${{ steps.stationary_cuda_cache.outputs.cache-primary-key }}
      - name: Restore TensorIR CUDA compile cache
        id: tensor_static_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tensor-static-cuda-compile
          key: tensor-static-cuda-12.9-sm120-${{ hashFiles('python/generativeqc_compiler/common/**', 'python/generativeqc_compiler/tensor/**', 'tools/validate_tensor_cuda_compile.py') }}
          restore-keys: |
            tensor-static-cuda-12.9-sm120-
      - name: Compile generated TensorIR static-data artifacts
        run: >-
          PYTHONPATH=python python3 tools/validate_tensor_cuda_compile.py
          --nvcc "$CUDACXX" --architecture sm_120
          --cache build/tensor-static-cuda-compile
      - name: Save TensorIR CUDA compile cache
        if: github.event_name != 'merge_group' && steps.tensor_static_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tensor-static-cuda-compile
          key: ${{ steps.tensor_static_cache.outputs.cache-primary-key }}
      - name: Preserve generated XC resource reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xc-release-compile
          path: |
            build/xc-compile/**/compiler.log
            build/xc-compile/**/contract.json
            build/xc-compile/**/report.json
            build/xc-compile/summary.json
            build/native-xc-resource/compiler.log
            build/native-xc-resource/generated_grid_policy.cu
            build/native-xc-resource/report.json
          retention-days: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 14 }}
      - name: Preserve f-shell release resource report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: f-shell-release-smoke
          path: build/f-shell-smoke.json
          retention-days: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 14 }}

  python:
    name: python (${{ matrix.shard }})
    needs: merge_queue_liveness
    if: needs.merge_queue_liveness.outputs.active != 'false' && github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        shard: [core-a, core-b, runtime-heavy, posthf, compiler-heavy, ecp-forces]
    runs-on: ubuntu-24.04
    # Full nightly/manual qualification includes expensive Hessian and Au replay.
    # Keep routine PR/merge-group feedback capped separately; do not truncate that tier.
    # The broad core suite is split deterministically by test file so routine
    # feedback does not leave one ~18-minute serial critical-path shard.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 30 }}
    env:
      CCACHE_MAXSIZE: 1G
      # PySCF and NumPy can each fan out through BLAS/OpenMP. Keep those
      # libraries single-threaded so pytest-xdist owns the job-level parallelism.
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      # This job validates the CPU runtime; CUDA provider packaging/runtime has
      # dedicated CI. Keep the editable scikit-build reconfigure CPU-only too.
      GENERATIVEQC_ENABLE_CUDA: "OFF"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Offline retention tests recover real artifacts from historical commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
          cache-suffix: "python-cpu-v1"
          prune-cache: true
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Restore ccache
        id: python_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-python-v2-${{ hashFiles('cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          restore-keys: |
            ccache-python-v2-
            ccache-python-
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Prepare CPU Python test environment
        run: |
          uv venv --python 3.11
          mapfile -t ci_requirements < <(
            .venv/bin/python - <<'PY_INNER'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              config = tomllib.load(handle)
          requirements = [
              item
              for item in config["project"]["dependencies"]
              if not item.lstrip().startswith("nvidia-")
          ]
          requirements += config["project"]["optional-dependencies"]["test"]
          requirements += config["project"]["optional-dependencies"]["reference-test"]
          requirements += config["build-system"]["requires"]
          for item in dict.fromkeys(requirements):
              print(item)
          PY_INNER
          )
          uv pip install --python .venv/bin/python "${ci_requirements[@]}"
          # Exercise public autograd contracts without pulling CUDA-enabled
          # PyTorch wheels or project-declared NVIDIA runtime providers.
          uv pip install --python .venv/bin/python torch \
            --index-url https://download.pytorch.org/whl/cpu
          xtb_linalg="$(
            .venv/bin/python - <<'PY_INNER'
          from pathlib import Path
          import scipy

          site = Path(scipy.__file__).resolve().parent.parent
          matches = sorted((site / "scipy.libs").glob("libscipy_openblas*.so"))
          if len(matches) != 1:
              raise SystemExit(f"expected one SciPy OpenBLAS runtime, found {matches}")
          print(matches[0])
          PY_INNER
          )"
          echo "GENERATIVEQC_XTB_CPU_LINALG_LIBRARY=${xtb_linalg}" >> "$GITHUB_ENV"
      - name: Qualify owned sccache compiler lifetimes
        if: matrix.shard == 'compiler-heavy'
        env:
          GENERATIVEQC_REQUIRE_SCCACHE_TEST: "1"
        run: |
          uv pip install --python .venv/bin/python sccache==0.16.0
          PATH="$PWD/.venv/bin:$PATH" PYTHONPATH="$PWD/python:$PWD" \
            .venv/bin/python -m pytest -q \
              tests/python/test_compiler_cache.py \
              tests/python/test_compiler_cache_lifecycle.py \
              tests/python/test_sccache_lifecycle_integration.py
      - name: Build the CPU native library
        run: |
          cmake -S . -B build -G Ninja \
            -DGENERATIVEQC_ENABLE_CUDA=OFF \
            -DGENERATIVEQC_BUILD_TESTS=OFF \
            -DGENERATIVEQC_PYTHON_WHEEL=ON \
            -DGENERATIVEQC_BUNDLE_XTB_OPENBLAS=OFF \
            -DGENERATIVEQC_XTB_CPU_LINALG_LIBRARY="$GENERATIVEQC_XTB_CPU_LINALG_LIBRARY" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGENERATIVEQC_COMPILER_CACHE=ccache
          cmake --build build --parallel
      # The six Python shards build the same native library. Stable refs may
      # publish it, while ephemeral merge-group refs remain read-only consumers.
      - name: Save Python-build ccache immediately
        if: matrix.shard == 'core-a' && github.event_name != 'merge_group' && steps.python_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.python_ccache.outputs.cache-primary-key }}
      - name: Install GenerativeQC editable package
        run: |
          # Dependencies and build requirements are already present. Reuse the
          # native tree above so editable installation does not repeat codegen,
          # compilation, or the large CUDA-provider dependency installation.
          uv pip install --python .venv/bin/python --editable . \
            --no-deps --no-build-isolation -Cbuild-dir=build
      # Core and compiler-heavy reference tests need the external oracle inputs.
      # Builds and installed production paths above remain completely offline.
      - name: Restore pinned GFN1 and D3 reference inputs
        if: matrix.shard == 'core-a' || matrix.shard == 'core-b' || matrix.shard == 'compiler-heavy'
        id: gfn1_reference_sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/generativeqc-sources/xtbloom-gfn1-parameters
            .cache/generativeqc-sources/xtbloom-gfn1-d3
          key: gfn1-reference-inputs-v1-${{ hashFiles('upstream/manifest.json', 'tools/source_registry.py') }}
      - name: Prepare pinned GFN1 and D3 reference inputs
        if: (matrix.shard == 'core-a' || matrix.shard == 'core-b' || matrix.shard == 'compiler-heavy') && steps.gfn1_reference_sources.outputs.cache-hit != 'true'
        run: |
          .venv/bin/python tools/source_registry.py sync xtbloom-gfn1-parameters
          .venv/bin/python tools/source_registry.py sync xtbloom-gfn1-d3
      - name: Save pinned GFN1 and D3 reference inputs
        if: matrix.shard == 'core-a' && github.event_name != 'merge_group' && steps.gfn1_reference_sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/generativeqc-sources/xtbloom-gfn1-parameters
            .cache/generativeqc-sources/xtbloom-gfn1-d3
          key: ${{ steps.gfn1_reference_sources.outputs.cache-primary-key }}
      - name: Show ccache statistics
        run: ccache --show-stats
      # Probe caches are useful only for shards that compile native probes.
      # Merge-group refs are ephemeral, so they restore but never publish caches.
      - name: Restore native Python probes
        id: python_probe_ccache
        if: matrix.shard == 'core-a' || matrix.shard == 'core-b' || matrix.shard == 'runtime-heavy' || matrix.shard == 'compiler-heavy'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache-python-probes
          key: ccache-python-probes-v2-${{ matrix.shard }}-${{ hashFiles('cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py', 'tests/python/**', 'tests/native/**', 'benchmarks/**') }}
          restore-keys: |
            ccache-python-probes-v2-${{ matrix.shard }}-
      - name: Reset native probe ccache statistics
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache-python-probes
        run: ccache --zero-stats
      - name: Run Python tests with coverage
        env:
          GENERATIVEQC_LIBRARY: ${{ github.workspace }}/build/libgenerativeqc.so
          GENERATIVEQC_BUILD_DIR: ${{ github.workspace }}/build
          CCACHE_DIR: ${{ runner.temp }}/ccache-python-probes
          CCACHE_MAXSIZE: 256M
        run: |
          extra_args=()
          coverage_args=()
          if [[ "${{ github.event_name }}" != "merge_group" ]]; then
            coverage_args+=(--cov --cov-report="xml:coverage-python-${{ matrix.shard }}.xml")
          fi
          if [[ "${{ github.event_name }}" != "schedule" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            # Keep exhaustive qualification matrices on scheduled/manual CI.
            # Routine PR/master CI retains one complete CPU HF endpoint for
            # orbital-f and f-projector support, while avoiding redundant
            # spin/representation variants that dominate wall time under
            # --dist=loadfile.
            extra_args+=(
              --deselect
              'tests/python/test_mp2_gradient.py::test_dense_complete_gradient_matches_fully_resolved_finite_differences[water]'
              # The complete 55-class capability report performs bounded source
              # emission for every recurrence/schedule combination and costs
              # several minutes by itself. Focused capability/emitter tests stay
              # routine; retain the exhaustive catalog sweep nightly/manual.
              --deselect
              'tests/python/test_codegen_production.py::test_codegen_capability_report_covers_catalog_and_manifest'
              --deselect
              'tests/python/test_ecp_f.py::test_f_prepared_replay_with_planned_budget[cpu]'
              --deselect
              'tests/python/test_ecp_f.py::test_f_complete_hf_energy_and_force[1-cartesian-cpu]'
              --deselect
              'tests/python/test_ecp_f.py::test_f_complete_hf_energy_and_force[0-spherical-cpu]'
              --deselect
              'tests/python/test_ecp_f.py::test_f_complete_hf_energy_and_force[1-spherical-cpu]'
              --deselect
              'tests/python/test_ecp_f_projector.py::test_f_projector_complete_hf[1-cartesian-cpu]'
              --deselect
              'tests/python/test_ecp_f_projector.py::test_f_projector_complete_hf[0-spherical-cpu]'
              --deselect
              'tests/python/test_ecp_f_projector.py::test_f_projector_complete_hf[1-spherical-cpu]'
              # Keep one direct f-shell complete-HF endpoint on routine CI.
              # The matching full projector replay is independently covered by
              # lighter projector contracts here and by the complete nightly run.
              --deselect
              'tests/python/test_ecp_f_projector.py::test_f_projector_complete_hf[0-cartesian-cpu]'
              # Correlated-gradient acceptance contains reconverged molecular
              # finite differences and larger-molecule independent references.
              # H2/small-contract coverage stays routine; broad endpoint replay
              # belongs to scheduled/manual qualification.
              # The NH3 complete RCCSD(T) analytic-gradient endpoint is a
              # separate ~4.7 minute native solve on hosted runners. H2O stays
              # routine and is shared by the component/response checks through
              # the module cache; keep NH3 for scheduled/manual qualification.
              --deselect
              'tests/python/test_ccsd_t_complete_gradient.py::test_complete_ccsdt_gradient_matches_pinned_pyscf[nh3]'
              --deselect
              'tests/python/test_cc_complete_gradient.py::test_complete_native_endpoint_matches_pinned_pyscf_gradient[ch4]'
              --deselect
              'tests/python/test_cc_complete_gradient.py::test_complete_native_endpoint_matches_pinned_pyscf_gradient[nh3]'
              --deselect
              'tests/python/test_cc_complete_gradient.py::test_nuclear_finite_differences_resolve_hf_and_cc_at_three_steps[nh3]'
              --deselect
              'tests/python/test_cc_complete_gradient.py::test_nuclear_finite_differences_resolve_hf_and_cc_at_three_steps[h2o]'
              --deselect
              'tests/python/test_cc_complete_gradient.py::test_nuclear_finite_differences_resolve_hf_and_cc_at_three_steps[h2_d_spherical]'
              # These are qualification-scale replays (roughly 1-2 minutes
              # each on hosted runners); smaller MP2/DFT/ECP/HVP contracts still
              # execute on every PR.
              --deselect
              'tests/python/test_mp2_gradient_fast.py::test_water_complete_gradient_matches_directional_finite_differences'
              --deselect
              'tests/python/test_ecp_heavy.py::test_heavy_complete_hf_and_core_bookkeeping[cpu-1-Au]'
              --deselect
              'tests/python/test_dft_complete_cpu.py::test_complete_asymmetric_water_analytic_and_reconverged_fd[lda-rks-reference]'
              --deselect
              'tests/python/test_second_derivatives_inputs.py::test_public_hvp_arbitrary_rotation_and_bra_shell_permutation[cpu-eri]'
              --deselect
              'tests/python/test_second_derivatives_inputs.py::test_contracted_public_hvp_matches_three_step_independent_gradient_fd[cpu-False-eri]'
              # Retain one representative high-angular/range path routinely;
              # move exhaustive symbolic/long-range qualification to nightly.
              --deselect
              'tests/python/test_high_angular.py::test_g_one_electron_all_components_libcint[nuclear_attraction-angular3]'
              --deselect
              'tests/python/test_codegen_high_l.py::test_dddp_rys5_recurrence_matches_every_symbolic_component'
              --deselect
              'tests/python/test_range_separation.py::test_generated_range_values_and_all_center_derivatives_against_libcint[angular3-cpu-long_range]'
              # WB97M-V reconverged finite-difference replays are qualification
