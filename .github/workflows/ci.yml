              --deselect
              'tests/python/test_wb97mv_complete.py::test_public_wb97mv_force_matches_reconverged_energy_differences[grid_shape1-oh-doublet-uks]'
              # The module-scoped analytic Hessian fixture computes a complete
              # water Hessian before the first parametrized check. On hosted
              # runners that setup alone is ~27 minutes, so keep the H2 path
              # on routine CI and run the water qualification nightly/manual.
              --deselect
              'tests/python/test_hessian_analytic.py::test_first_order_sources_match_independent_native_derivatives[water]'
              --deselect
              'tests/python/test_hessian_analytic.py::test_reference_is_the_native_converged_state[water]'
              --deselect
              'tests/python/test_hessian_analytic.py::test_total_matches_independent_pyscf_hessian[water]'
              --deselect
              'tests/python/test_hessian_analytic.py::test_components_match_independent_finite_difference_oracle[water]'
              --deselect
              'tests/python/test_hessian_analytic.py::test_raw_total_invariants[water]'
              --deselect
              'tests/python/test_hessian_analytic.py::test_three_step_directional_differences_of_native_forces[water]'
              # Full >12-AO RKS HVP qualifications compile and evaluate the
              # complete second-order path and are too expensive for routine
              # hosted feedback. Keep the lightweight synthetic >12-AO/>4-atom
              # admission/resource contract on every PR, and run both native
              # large-domain numerical qualifications scheduled/manual.
              --deselect
              'tests/python/test_hessian_rks_directional.py::test_rks_hvp_admits_resource_bounded_domain_above_12_aos'
              --deselect
              'tests/python/test_hessian_rks_larger_multicenter.py::test_larger_multicenter_rks_hvp_matches_nonzero_gradient_difference'
              # Au resource-boundary replay is a full qualification loop
              # (multiple converged displaced calculations) and currently
              # costs another ~7-10 minutes per spin case. The ordinary Au
              # energy/force checks remain on every PR.
              --deselect
              'tests/python/test_ecp_heavy.py::test_heavy_resource_boundary_replay_complete_energy_difference[cpu-0-Au]'
              --deselect
              'tests/python/test_ecp_heavy.py::test_heavy_resource_boundary_replay_complete_energy_difference[cpu-1-Au]'
              # Keep one response-functional variant on routine CI; the
              # alternate LDA reconverged response remains in nightly/manual.
              --deselect
              'tests/python/test_response_native_rks.py::test_complete_solve_and_reconverged_density_response[lda-rks]'
              --deselect
              'tests/python/test_response_native_uks.py::test_solve_reconverged_spin_densities_and_recycling[lda-uks]'
              # Standard production-grid RKS/UKS endpoints remain routine.
              # The tighter-profile duplicates are qualification coverage.
              --deselect
              'tests/python/test_dft_complete_cpu.py::test_production_grid_converges_against_independent_dense_quadrature[lda-rks-tight]'
              --deselect
              'tests/python/test_dft_complete_cpu.py::test_production_grid_converges_against_independent_dense_quadrature[pbe-rks-tight]'
              --deselect
              'tests/python/test_dft_complete_cpu.py::test_production_grid_open_shell_converges_against_independent_dense_quadrature[lda-uks-tight]'
              --deselect
              'tests/python/test_dft_complete_cpu.py::test_production_grid_open_shell_converges_against_independent_dense_quadrature[pbe-uks-tight]'
              # Closed-shell SPD ECP reconverged finite differences are
              # qualification-scale on hosted runners. The two LDA-UKS
              # reconverged finite-difference cases are also ~9 minutes each.
              # Keep the much faster PBE-UKS complete-force checks plus paired
              # and budgeted ECP contracts on routine CI; run the redundant
              # RKS/LDA qualification matrix on scheduled/manual CI.
              --deselect
              'tests/python/test_ecp_spd_cartesian_cpu.py::test_spd_force_analytic_and_reconverged_fd[lda-rks]'
              --deselect
              'tests/python/test_ecp_spd_spherical_cpu.py::test_spd_force_analytic_and_reconverged_fd[lda-rks]'
              --deselect
              'tests/python/test_ecp_spd_cartesian_cpu.py::test_spd_force_analytic_and_reconverged_fd[pbe-rks]'
              --deselect
              'tests/python/test_ecp_spd_spherical_cpu.py::test_spd_force_analytic_and_reconverged_fd[pbe-rks]'
              --deselect
              'tests/python/test_ecp_spd_cartesian_cpu.py::test_spd_force_analytic_and_reconverged_fd[lda-uks]'
              --deselect
              'tests/python/test_ecp_spd_spherical_cpu.py::test_spd_force_analytic_and_reconverged_fd[lda-uks]'
            )
          fi
          # Keep every routine Python test on every PR, but remove the single
          # 26-minute critical path by separating the known numerical/codegen
          # tails. New test files land in core automatically until they become
          # expensive enough to earn an explicit shard.
          dist_mode=loadfile
          slow_paths=(
            tests/python/test_cc_complete_gradient.py
            tests/python/test_cc_triples_response.py
            tests/python/test_ccsd_t_gradient_validation.py
            tests/python/test_ccsd_t_complete_gradient.py
            tests/python/test_dft_complete_cpu.py
            tests/python/test_ecp_stationary_cpu.py
            tests/python/test_ecp_public_cpu.py
            tests/python/test_ecp_spd_cartesian_cpu.py
            tests/python/test_ecp_spd_spherical_cpu.py
            tests/python/test_ecp_stuttgart_dft.py
            tests/python/test_ecp_f.py
            tests/python/test_ecp_f_projector.py
            tests/python/test_ecp_heavy.py
            tests/python/test_mp2_gradient.py
            tests/python/test_mp2_gradient_fast.py
            tests/python/test_hessian_analytic.py
            tests/python/test_hessian_directional.py
            tests/python/test_response_operator.py
            tests/python/test_codegen_high_l.py
            tests/python/test_codegen_production.py
            tests/python/test_codegen_cuda_compile.py
            tests/python/test_codegen_autotune.py
            tests/python/test_codegen_profiles.py
            tests/python/test_d3_geometry_ir.py
            tests/python/test_d3_generated_ragged.py
            tests/python/test_high_angular.py
            tests/python/test_one_electron_derivatives.py
            tests/python/test_range_separation.py
            tests/python/test_second_derivatives_inputs.py
            # Empirically expensive routine files live in their own shard so
            # they cannot silently expand the broad core critical path.
            tests/python/test_response_native_rks.py
            tests/python/test_response_native_uks.py
            tests/python/test_mp2_public.py
            tests/python/test_ccsd_t_orbital_response.py
            tests/python/test_hessian_block.py
            tests/python/test_grid_policy_convergence.py
            tests/python/test_cc_triples_response_cuda.py
            tests/python/test_codegen_schedules.py
            tests/python/test_dft_batch.py
            tests/python/test_ecp_multicenter.py
            tests/python/test_cc_triples_lambda_response.py
            tests/python/test_cc_lambda_response.py
            tests/python/test_implicit_response.py
            tests/python/test_df_rys.py
            tests/python/test_hessian_numerical.py
            tests/python/test_one_electron_cpu_codegen.py
            tests/python/test_cc_solver.py
            tests/python/test_cc_lambda_solver.py
            # These compiler/code-generation audits dominated core-a on the
            # 2026-10-04 routine PR run (~347s derivative AOT audit, ~199s
            # deterministic ERI CPU emission, plus native CC codegen). Keep
            # them off the broad core parity split and co-locate them with the
            # existing compiler-heavy shard.
            tests/python/test_derivative_aot_audit.py
            tests/python/test_eri_cpu_codegen.py
            tests/python/test_rccsdt_native_codegen_dependencies.py
            tests/python/test_df_cc_native_codegen.py
          )
          # PR #1934 / run 37238512811 still left the broad core shards with
          # a large measured long tail. Keep these newly measured files out of
          # worksteal, but count them in the existing core parity before
          # excluding them so unrelated core files do not swap owners.
          rebalance_paths=(
            tests/python/test_df_cc_native_solver.py
            tests/python/test_df_lambda_matrix.py
            tests/python/test_df_lambda_reduction.py
            tests/python/test_xc_retirement.py
            tests/python/test_stationary_cooperative_kernel_host.py
            tests/python/test_hessian_reference.py
            tests/python/test_hessian_hvp.py
            tests/python/test_ecp_halogen_dft.py
          )
          case "${{ matrix.shard }}" in
            core-a|core-b)
              # Split the broad remainder by file, not by collected test node:
              # this keeps module fixtures local while removing the former
              # ~18-minute single-shard critical path. slow_paths remain owned
              # by their dedicated shards below and are excluded here.
              dist_mode=worksteal
              declare -A slow_lookup=()
              for path in "${slow_paths[@]}"; do
                slow_lookup["${path}"]=1
              done
              declare -A rebalance_lookup=()
              for path in "${rebalance_paths[@]}"; do
                rebalance_lookup["${path}"]=1
              done
              test_targets=()
              core_index=0
              target_parity=0
              if [[ "${{ matrix.shard }}" == "core-b" ]]; then
                target_parity=1
              fi
              while IFS= read -r path; do
                if [[ -n "${slow_lookup[${path}]:-}" ]]; then
                  continue
                fi
                current_index="${core_index}"
                ((core_index += 1))
                if [[ -n "${rebalance_lookup[${path}]:-}" ]]; then
                  continue
                fi
                if (( current_index % 2 == target_parity )); then
                  test_targets+=("${path}")
                fi
              done < <(git ls-files tests/python | grep -E '(^|/)test_[^/]*\.py$' | sort)
              if (( ${#test_targets[@]} == 0 )); then
                echo "::error::core shard selected no tests"
                exit 2
              fi
              ;;
            runtime-heavy)
              # Keep file-scoped/module-scoped expensive fixtures on one worker.
              # worksteal can duplicate those setups across workers and inflate
              # wall time even when the collected test count barely changes.
              dist_mode=loadfile
              test_targets=(
                tests/python/test_response_native_rks.py
                tests/python/test_response_native_uks.py
                tests/python/test_mp2_public.py
                tests/python/test_ccsd_t_orbital_response.py
                tests/python/test_hessian_block.py
                tests/python/test_grid_policy_convergence.py
                tests/python/test_cc_triples_response_cuda.py
                tests/python/test_codegen_schedules.py
                tests/python/test_dft_batch.py
                tests/python/test_ecp_multicenter.py
                tests/python/test_cc_triples_lambda_response.py
                tests/python/test_cc_lambda_response.py
                tests/python/test_implicit_response.py
                tests/python/test_df_rys.py
                tests/python/test_hessian_numerical.py
                tests/python/test_one_electron_cpu_codegen.py
                tests/python/test_cc_solver.py
                tests/python/test_cc_lambda_solver.py
                # Keep the module-scoped native solver probe on one worker:
                # worksteal repeated its ~131-160 s setup across four workers.
                tests/python/test_df_cc_native_solver.py
                tests/python/test_df_lambda_matrix.py
                tests/python/test_df_lambda_reduction.py
              )
              ;;
            posthf)
              test_targets=(
                tests/python/test_cc_complete_gradient.py
                tests/python/test_cc_triples_response.py
                tests/python/test_ccsd_t_gradient_validation.py
                tests/python/test_ccsd_t_complete_gradient.py
                tests/python/test_dft_complete_cpu.py
                tests/python/test_ecp_stationary_cpu.py
                tests/python/test_ecp_f.py
                tests/python/test_ecp_f_projector.py
                tests/python/test_ecp_heavy.py
                tests/python/test_mp2_gradient.py
                tests/python/test_mp2_gradient_fast.py
                tests/python/test_hessian_analytic.py
                tests/python/test_hessian_directional.py
                tests/python/test_response_operator.py
                tests/python/test_hessian_reference.py
                tests/python/test_hessian_hvp.py
              )
              ;;
            ecp-forces)
              # Full d-force qualification exceeded the 20-minute job cap when
              # serialized in one file. Keep every case, split representations
              # across loadfile workers, and retain the existing job time cap.
              test_targets=(
                tests/python/test_ecp_public_cpu.py
                tests/python/test_ecp_spd_cartesian_cpu.py
                tests/python/test_ecp_spd_spherical_cpu.py
                tests/python/test_ecp_stuttgart_dft.py
                tests/python/test_ecp_halogen_dft.py
              )
              ;;
            compiler-heavy)
              test_targets=(
                tests/python/test_codegen_high_l.py
                tests/python/test_codegen_production.py
                tests/python/test_codegen_cuda_compile.py
                tests/python/test_codegen_autotune.py
                tests/python/test_codegen_profiles.py
                tests/python/test_d3_geometry_ir.py
                tests/python/test_d3_generated_ragged.py
                tests/python/test_high_angular.py
                tests/python/test_one_electron_derivatives.py
                tests/python/test_range_separation.py
                tests/python/test_second_derivatives_inputs.py
                tests/python/test_derivative_aot_audit.py
                tests/python/test_eri_cpu_codegen.py
                tests/python/test_rccsdt_native_codegen_dependencies.py
                tests/python/test_df_cc_native_codegen.py
                tests/python/test_xc_retirement.py
                tests/python/test_stationary_cooperative_kernel_host.py
              )
              ;;
            *)
              echo "::error::unknown Python shard: ${{ matrix.shard }}"
              exit 2
              ;;
          esac
          .venv/bin/python -m pytest "${test_targets[@]}" -q \
            -n 4 --dist="$dist_mode" --durations=25 \
            --junitxml=".artifacts/pytest-${{ matrix.shard }}.xml" \
            "${coverage_args[@]}" \
            "${extra_args[@]}"
      - name: Save native Python probes
        if: github.event_name != 'merge_group' && steps.python_probe_ccache.outcome == 'success' && steps.python_probe_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache-python-probes
          key: ${{ steps.python_probe_ccache.outputs.cache-primary-key }}
      - name: Show post-test ccache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache-python-probes
          CCACHE_MAXSIZE: 256M
        run: ccache --show-stats
      - name: Preserve transient benchmark/debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-debug-${{ github.run_id }}-${{ matrix.shard }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Python coverage for the upload-only job
        if: github.event_name != 'merge_group'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-python-${{ matrix.shard }}
          path: coverage-python-${{ matrix.shard }}.xml
          retention-days: 1


  cpu-benchmark:
    name: CPU performance (CodSpeed)
    # Publish PR-tier baselines on post-merge master pushes to avoid old fallback
    # comparisons. Scheduled/manual runs retain complete endpoint coverage.
    if: github.event_name != 'merge_group'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    # Leave enough headroom for a fully cold hosted-runner build before
    # CodSpeed starts; performance checks should not become false negatives just
    # because the ccache entry is missing.
    timeout-minutes: 15
    env:
      CCACHE_MAXSIZE: 1G
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      # Master must cover every endpoint selectable by a PR at this source.
      GENERATIVEQC_CODSPEED_EXTRA_CASES: ${{ github.event_name == 'push' && 'wb97mv' || '' }}
      GENERATIVEQC_CODSPEED_TIER: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'pr' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select change-aware PR CodSpeed coverage
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(
            git diff --name-only --no-renames \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --
          )"
          # Maintenance manifests are audit/bookkeeping data and do not affect
          # generated/runtime DFT paths. Keep them from promoting the expensive
          # WB97M-V endpoint while preserving all other manifest-triggered coverage.
          performance_changed_files="$(
            grep -Ev '^manifests/maintenance/' <<<"$changed_files" || true
          )"
          extra_cases=""
          if grep -Eq \
            '^(benchmarks/test_cpu_codspeed\.py$|\.github/workflows/ci\.yml$|src/dft/|src/scf/|src/methods/|src/integrals/|include/generativeqc([./])|python/generativeqc/|python/generativeqc_compiler/(dft|xc)/|python/generativeqc_compiler/(method|integral)/|manifests/|upstream/libxc/|tools/(generate_xc|libxc))' \
            <<<"$performance_changed_files"; then
            extra_cases="wb97mv"
          fi
          echo "GENERATIVEQC_CODSPEED_EXTRA_CASES=${extra_cases}" >> "$GITHUB_ENV"
          # Skip only known non-performance files; unknown paths still run.
          relevant_files="$(grep -Ev '^(docs/|\.agents/|tests/|manifests/maintenance/|README(\..*)?$|CHANGELOG(\..*)?$|.*\.md$|tools/render_python_api_doc\.py$)' <<<"$changed_files" || true)"
          if [[ -z "$relevant_files" ]]; then
            echo "GENERATIVEQC_CODSPEED_RUN=0" >> "$GITHUB_ENV"
            echo "::notice::Skipping CPU performance for non-performance changes."
          else
            echo "GENERATIVEQC_CODSPEED_RUN=1" >> "$GITHUB_ENV"
          fi
      - name: Install uv and Python 3.11
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
          cache-suffix: "cpu-benchmark-v1"
          prune-cache: true
      - name: Install ccache 4.14
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
      - name: Restore CPU benchmark ccache
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-cpu-benchmark-v2-${{ hashFiles('cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tools/**', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          restore-keys: |
            ccache-cpu-benchmark-v2-
            ccache-cpu-benchmark-
      - name: Reset CPU benchmark ccache statistics
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: ccache --zero-stats
      - name: Build CPU benchmark library
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: |
          cmake -S . -B build-benchmark -G Ninja \
            -DGENERATIVEQC_ENABLE_CUDA=OFF \
            -DGENERATIVEQC_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DGENERATIVEQC_COMPILER_CACHE=ccache
          cmake --build build-benchmark --target generativeqc --parallel
      - name: Show CPU benchmark ccache statistics
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: ccache --show-stats
      - name: Install benchmark dependencies
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python \
            numpy pytest pytest-codspeed==5.0.3
      - name: Qualify PR CodSpeed comparison
        id: baseline
        if: github.event_name == 'pull_request' && env.GENERATIVEQC_CODSPEED_RUN != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CODSPEED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CODSPEED_REPO: ${{ github.repository }}
        run: |
          .venv/bin/python tools/codspeed_baseline.py qualify \
            --base-sha "$CODSPEED_BASE_SHA" --repo "$CODSPEED_REPO"
      - name: Run CPU CodSpeed endpoint suite
        if: github.event_name != 'pull_request' || (env.GENERATIVEQC_CODSPEED_RUN != '0' && steps.baseline.outputs.qualified == 'true')
        uses: CodSpeedHQ/action@88472375d0a4572cf70a9f1fe3a4e0ab8da1b924 # v5.0.1
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          GENERATIVEQC_LIBRARY: ${{ github.workspace }}/build-benchmark/libgenerativeqc.so
        with:
          # Hosted GitHub runners are noisy for wall-clock gating; simulation
          # provides the stable PR/scheduled regression signal without Macro Runner quota.
          # PRs keep two always-on endpoints and can add a targeted advanced-DFT
          # endpoint through GENERATIVEQC_CODSPEED_EXTRA_CASES.
          mode: simulation
          run: .venv/bin/python -m pytest benchmarks/test_cpu_codspeed.py --codspeed -q
      - name: Record successful master CodSpeed baseline
        if: github.event_name == 'push'
        run: |
          .venv/bin/python tools/codspeed_baseline.py record \
            --sha "${{ github.sha }}" --output codspeed-baseline/baseline.json
      - name: Publish exact-master CodSpeed baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codspeed-cpu-baseline-${{ github.sha }}
          path: codspeed-baseline/baseline.json
          if-no-files-found: error
          retention-days: 30

  upload-coverage:
    timeout-minutes: 8
    needs: [cpu, python]
    if: ${{ github.event_name != 'merge_group' && github.event_name != 'push' && !cancelled() && needs.cpu.result == 'success' && needs.python.result == 'success' }}
    # Coverage reporting is observability rather than a correctness gate. A
    # Codecov or artifact-service outage must not fail the workflow.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: coverage-report-cpp
            file: coverage/coverage-cpp.info
            flag: cpp
            name: code-coverage/cpp
          - artifact: coverage-report-python-core-a
            file: coverage/coverage-python-core-a.xml
            flag: python
            name: code-coverage/python-core-a
          - artifact: coverage-report-python-core-b
            file: coverage/coverage-python-core-b.xml
            flag: python
            name: code-coverage/python-core-b
          - artifact: coverage-report-python-runtime-heavy
            file: coverage/coverage-python-runtime-heavy.xml
            flag: python
            name: code-coverage/python-runtime-heavy
          - artifact: coverage-report-python-posthf
            file: coverage/coverage-python-posthf.xml
            flag: python
            name: code-coverage/python-posthf
          - artifact: coverage-report-python-compiler-heavy
            file: coverage/coverage-python-compiler-heavy.xml
            flag: python
            name: code-coverage/python-compiler-heavy
          - artifact: coverage-report-python-ecp-forces
            file: coverage/coverage-python-ecp-forces.xml
            flag: python
            name: code-coverage/python-ecp-forces
    runs-on: ubuntu-24.04
    # Keep OIDC away from jobs that build or execute pull-request code. This
    # job checks out source metadata and consumes coverage artifacts only.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: coverage
      - name: Upload coverage to Codecov
        # fail_ci_if_error covers CLI upload errors; continue-on-error also
        # covers action setup, integrity-check, and OIDC failures.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ matrix.file }}
          flags: ${{ matrix.flag }}
          name: ${{ matrix.name }}
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          version: v11.3.1

  pass:
    name: Pass CI checks
    timeout-minutes: 5
    needs: [merge_queue_liveness, cpu, cuda-compile, cuda-resources, python]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    steps:
      - name: Accept an orphaned merge-group run
        if: needs.merge_queue_liveness.outputs.active == 'false'
        run: echo "The merge-group ref is gone; expensive CI jobs were intentionally skipped."
      - name: Decide whether the needed jobs succeeded or failed
        if: needs.merge_queue_liveness.outputs.active != 'false'
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
