name: CI

on:
  # Pull requests and merge groups own correctness. Master pushes remain only
  # to publish stable caches and exact-source CPU performance baselines.
  push:
    branches: [master]
    # Master uploads artifacts only; intentional vX.Y.Z tags trigger Releases.
    tags: ['v[0-9]*']
  pull_request:
  # Run required CI checks against GitHub's synthetic merge-queue commit.
  merge_group:
    types: [checks_requested]
  # Keep the exhaustive water Cartesian MP2-gradient finite difference off the
  # ordinary feedback path while still exercising it regularly.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CCACHE_VERSION: "4.14"

# Coalesce superseded PR and merge-group runs by their logical ref. Keep the
# active run; GitHub concurrency retains at most one running plus one pending
# run per group and replaces an older pending run with the newest one. Deleted
# queue refs are still screened by the liveness job below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' || github.event_name == 'merge_group') && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  merge_queue_liveness:
    name: Merge queue liveness
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      active: ${{ steps.liveness.outputs.active }}
    steps:
      - name: Check merge-group ref still exists
        id: liveness
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "merge_group" ]]; then
            echo "active=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          ref="${GITHUB_REF#refs/}"
          error_file="$(mktemp)"
          if gh api --silent "/repos/${GITHUB_REPOSITORY}/git/ref/${ref}" 2>"${error_file}"; then
            echo "active=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if grep -q '(HTTP 404)' "${error_file}"; then
            echo "::notice::Merge-group ref ${GITHUB_REF} no longer exists; skipping orphaned CI."
            echo "active=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::warning::Unable to verify merge-group ref; running CI fail-open."
          cat "${error_file}" >&2
          echo "active=true" >> "${GITHUB_OUTPUT}"

  master-cpu-cache:
    permissions:
      contents: read
      actions: read
    name: Seed shared Linux CPU ccache (GCC, coverage, Clang, Python)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # One master producer fills all CPU compiler/flag variants before publishing.
    # The cache key is a transport snapshot; ccache itself keys compiler and flags.
    timeout-minutes: 55
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
          cache-suffix: "cpu-compiler-seed-v1"
          prune-cache: true
      - name: Install ccache 4.14
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --retry-delay 2 --retry-max-time 60 --connect-timeout 15 --max-time 60 \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Restore shared CPU ccache
        id: master_cpu_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-cpu-v4-ubuntu24-x86_64-${{ hashFiles('.github/workflows/ci.yml', '.github/actions/install-native-cli-deps/**', 'uv.lock', 'cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tests/native/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          restore-keys: |
            ccache-linux-cpu-v4-ubuntu24-x86_64-
      - name: Restore trusted CPU snapshot after primary miss
        if: steps.master_cpu_ccache.outcome == 'success' && steps.master_cpu_ccache.outputs.cache-matched-key == ''
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/restore-cpu-ccache
        with:
          github-token: ${{ github.token }}
      - name: Install native CLI dependencies
        uses: ./.github/actions/install-native-cli-deps
      - name: Compile GCC, instrumented GCC, and Clang
        id: cpu_seed
        run: |
          set -euo pipefail
          ccache --zero-stats
          for mode in gcc-plain gcc-coverage clang-plain; do
            compiler=g++
            compile_flags=""
            link_flags=""
            if [[ "$mode" == "clang-plain" ]]; then
              compiler=clang++
            elif [[ "$mode" == "gcc-coverage" ]]; then
              # GCC coverage flags must exactly match the PR consumer.
              compile_flags="-fprofile-arcs -ftest-coverage -fprofile-update=atomic"
              link_flags="--coverage"
            fi
            # CMake scopes CCACHE_BASEDIR to the binary directory. Seed the
            # same build path used by all CPU consumers in every mode, with a
            # clean configure to preserve compiler/coverage flag identities.
            rm -rf build
            CXX="$compiler" cmake -S . -B build -G Ninja \
              -DGENERATIVEQC_ENABLE_CUDA=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DGENERATIVEQC_COMPILER_CACHE=ccache \
              -DCMAKE_CXX_FLAGS="$compile_flags" \
              -DCMAKE_EXE_LINKER_FLAGS="$link_flags" \
              -DCMAKE_SHARED_LINKER_FLAGS="$link_flags"
            cmake --build build --parallel
          done
      - name: Prepare Python native cache seed
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python \
            numpy scipy scikit-build-core scipy-openblas32
          xtb_linalg="$(
            .venv/bin/python - <<'PY_INNER'
          from pathlib import Path
          import scipy

          site = Path(scipy.__file__).resolve().parent.parent
          matches = sorted((site / "scipy.libs").glob("libscipy_openblas*.so"))
          if len(matches) != 1:
              raise SystemExit(f"expected one SciPy OpenBLAS runtime, found {matches}")
          print(matches[0])
          PY_INNER
          )"
          echo "GENERATIVEQC_XTB_CPU_LINALG_LIBRARY=${xtb_linalg}" >> "$GITHUB_ENV"
      - name: Build Python native cache seed
        id: python_seed
        run: |
          # Match the Python shard's CMake binary directory, not a seed-only
          # absolute/generated path. The last plain/Clang build has different
          # flags, so discard its build tree without clearing the shared ccache.
          rm -rf build
          cmake -S . -B build -G Ninja \
            -DGENERATIVEQC_ENABLE_CUDA=OFF \
            -DGENERATIVEQC_BUILD_TESTS=OFF \
            -DGENERATIVEQC_PYTHON_WHEEL=ON \
            -DGENERATIVEQC_BUNDLE_XTB_OPENBLAS=OFF \
            -DGENERATIVEQC_XTB_CPU_LINALG_LIBRARY="$GENERATIVEQC_XTB_CPU_LINALG_LIBRARY" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGENERATIVEQC_COMPILER_CACHE=ccache
          cmake --build build --parallel
          ccache --show-stats
      - name: Summarize compiler cache
        if: always()
        run: python3 tools/report_ci_ccache.py --label "Master CPU compiler seed"
      # Complete keys are immutable; a failed producer must not claim one.
      - name: Save complete CPU compiler cache
        if: steps.master_cpu_ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.master_cpu_ccache.outputs.cache-primary-key }}
      - name: Preserve partial master CPU compiler work
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.master_cpu_ccache.outputs.cache-primary-key != '' && steps.master_cpu_ccache.outputs.cache-hit != 'true' && steps.cpu_seed.outcome != '' && steps.cpu_seed.outcome != 'skipped' && steps.python_seed.outcome != 'success' }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ format('{0}-partial-{1}-{2}', steps.master_cpu_ccache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      - name: Package bounded CPU compiler snapshot
        id: cpu_snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cpu_seed.outcome == 'success' && steps.python_seed.outcome == 'success'
        timeout-minutes: 2
        continue-on-error: true
        run: python3 tools/ci_cpu_ccache_snapshot.py package
      - name: Publish bounded CPU compiler snapshot
        if: steps.cpu_snapshot.outcome == 'success'
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cpu-ccache-master-ubuntu24-x86_64-v1-${{ github.run_attempt }}
          path: ${{ steps.cpu_snapshot.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  cpu:
    permissions:
      contents: read
      actions: read
    needs: merge_queue_liveness
    if: needs.merge_queue_liveness.outputs.active != 'false' && github.event_name != 'push'
    # Cold GCC coverage can spend 6.5 minutes compiling and 8 minutes in CTest.
    # Leave room for lcov and artifacts without enlarging plain-build budgets.
    timeout-minutes: ${{ matrix.compiler == 'gcc' && github.event_name != 'merge_group' && 20 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    env:
      # All CPU consumers share one bounded master snapshot. ccache keeps
      # compiler, instrumentation, and source identities separate internally.
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select README-only CI scope
        id: prose_scope
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          PROSE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          PROSE_TARGET_REF: ${{ github.event.merge_group.base_ref || '' }}
          PROSE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          # Missing/failed classification retains normal coverage. Only a verified
          # README-only PR or complete unmerged queue can omit expensive steps.
          set -euo pipefail
          scope=full
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" ]] && \
            candidate="$(timeout 75s python3 tools/ci_prose_scope.py \
              --event "$GITHUB_EVENT_NAME" --base-sha "$PROSE_BASE_SHA" \
              --head-sha "$GITHUB_SHA" --target-ref="$PROSE_TARGET_REF" \
              --pr-head-sha="$PROSE_PR_HEAD_SHA")" && [[ "$candidate" == "prose" ]]; then
            scope=prose
          fi
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'README-only CI scope: %s\n' "$scope"
      - name: Audit generated CUDA ABI call coverage
        run: python3 tools/generate_nvidia_host_api.py --check-usage
      - name: Install ccache 4.14
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --retry-delay 2 --retry-max-time 60 --connect-timeout 15 --max-time 60 \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Restore shared Linux CPU ccache (CPU CTest)
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        id: cpu_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-cpu-v4-ubuntu24-x86_64-${{ hashFiles('.github/workflows/ci.yml', '.github/actions/install-native-cli-deps/**', 'uv.lock', 'cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tests/native/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          restore-keys: |
            ccache-linux-cpu-v4-ubuntu24-x86_64-
      - name: Restore trusted CPU snapshot after primary miss
        if: steps.cpu_ccache.outcome == 'success' && steps.cpu_ccache.outputs.cache-matched-key == '' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/restore-cpu-ccache
        with:
          github-token: ${{ github.token }}
      - name: Reset ccache statistics
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: ccache --zero-stats
      - name: Install native CLI dependencies
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: ./.github/actions/install-native-cli-deps
      - name: Install uv and Python 3.11 for compiler-extension tests
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
          cache-suffix: "cpu-cli-compiler-extension-v1"
      - name: Prepare CPU CLI compiler-extension interpreter
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          uv venv --python 3.11
          # The native CLI stays Python-free. Its explicit Hessian extension's
          # mandatory CTest oracle needs the declared CPU Python dependencies,
          # not a wheel rebuild, reference extras or NVIDIA runtime providers.
          mapfile -t requirements < <(
            .venv/bin/python - <<'PY_INNER'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              config = tomllib.load(handle)
          for requirement in config["project"]["dependencies"]:
              if not requirement.lstrip().startswith("nvidia-"):
                  print(requirement)
          PY_INNER
          )
          uv pip install --python .venv/bin/python "${requirements[@]}"
          PYTHONPATH="$PWD/python" .venv/bin/python -m generativeqc.hessian_cli --help
      - name: Test native CLI archive/metadata contracts
        if: matrix.compiler == 'gcc'
        run: |
          python3 -m unittest discover -s tests/python -p test_native_cli_package.py
          python3 -m unittest discover -s tests/python -p test_native_cli_ci_scope.py
          python3 -m unittest discover -s tests/python -p test_ci_prose_scope.py
          python3 -m unittest discover -s tests/python -p test_ci_prose_workflow.py
      - name: Configure
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          # Instrument only the GCC leg so the existing compiler matrix still
          # exercises an ordinary non-instrumented Clang build.
          COVERAGE_COMPILE_FLAGS: ${{ matrix.compiler == 'gcc' && github.event_name != 'merge_group' && '-fprofile-arcs -ftest-coverage -fprofile-update=atomic' || '' }}
          COVERAGE_LINK_FLAGS: ${{ matrix.compiler == 'gcc' && github.event_name != 'merge_group' && '--coverage' || '' }}
        run: >-
          cmake -S . -B build -G Ninja
          -DGENERATIVEQC_ENABLE_CUDA=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DGENERATIVEQC_COMPILER_CACHE=ccache
          -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          -DCMAKE_CXX_FLAGS="${COVERAGE_COMPILE_FLAGS}"
          -DCMAKE_EXE_LINKER_FLAGS="${COVERAGE_LINK_FLAGS}"
          -DCMAKE_SHARED_LINKER_FLAGS="${COVERAGE_LINK_FLAGS}"
      - name: Build
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: cmake --build build --parallel
      - name: Show ccache statistics
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: ccache --show-stats
      - name: Summarize compiler cache
        if: always() && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: python3 tools/report_ci_ccache.py --label "CPU CTest ${{ matrix.compiler }}"
      - name: Test
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: ctest --test-dir build --output-on-failure
      - name: Generate current CUDA ownership report
        if: matrix.compiler == 'gcc'
        run: |
          mkdir -p .artifacts
          python3 tools/report_cuda_ownership.py --check \
            --output .artifacts/cuda-ownership-current.json
      - name: Preserve current CUDA ownership report
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cuda-ownership-current-${{ github.run_id }}
          path: .artifacts/cuda-ownership-current.json
          retention-days: 14
      - name: Collect C++ coverage
        if: matrix.compiler == 'gcc' && github.event_name != 'merge_group' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          sudo apt-get install --yes lcov
          lcov --capture --directory build --output-file coverage-cpp.info \
            --exclude '/usr/*' --exclude '*/tests/*' \
            --ignore-errors mismatch,unused
      - name: Preserve C++ coverage for the upload-only job
        if: matrix.compiler == 'gcc' && github.event_name != 'merge_group' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-cpp
          path: coverage-cpp.info
          retention-days: 1

  cuda-compile:
    name: CUDA 12.9 compile (sm_120)
    needs: merge_queue_liveness
    outputs:
      publish_cache_snapshot: ${{ steps.trusted_cuda_ccache.outputs.publish }}
      fast_cache_artifact_id: ${{ steps.master_fast_ccache_upload.outputs.artifact-id }}
      fast_cache_run_attempt: ${{ steps.master_fast_ccache_upload.outcome == 'success' && github.run_attempt || '' }}
    if: needs.merge_queue_liveness.outputs.active != 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    # A valid source-changing queue rebuild exceeded 23m before the former
    # 25m job ceiling killed it. Bound the build separately and leave 5m for
    # setup, the mandatory probes, compiler diagnostics and runner cleanup.
    timeout-minutes: 35
    env:
      CUDACXX: /usr/local/cuda-12.9/bin/nvcc
      LD_LIBRARY_PATH: /usr/local/cuda-12.9/lib64
      # Generated AOT objects are much larger than ordinary CPU objects, so
      # give the CUDA cache enough room while staying within the repo quota.
      CCACHE_MAXSIZE: 5G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select README-only CI scope
        id: prose_scope
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          PROSE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          PROSE_TARGET_REF: ${{ github.event.merge_group.base_ref || '' }}
          PROSE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          # Missing/failed classification retains normal coverage. Only a verified
          # README-only PR or complete unmerged queue can omit expensive steps.
          set -euo pipefail
          scope=full
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" ]] && \
            candidate="$(timeout 75s python3 tools/ci_prose_scope.py \
              --event "$GITHUB_EVENT_NAME" --base-sha "$PROSE_BASE_SHA" \
              --head-sha "$GITHUB_SHA" --target-ref="$PROSE_TARGET_REF" \
              --pr-head-sha="$PROSE_PR_HEAD_SHA")" && [[ "$candidate" == "prose" ]]; then
            scope=prose
          fi
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'README-only CI scope: %s\n' "$scope"
      - name: Add NVIDIA CUDA repository
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          curl --fail --silent --show-error --location --output cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring.deb
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Install CUDA 12.9 build dependencies
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          sudo apt-get install --yes \
            cuda-nvcc-12-9 \
            cuda-cuobjdump-12-9 \
            cuda-cudart-dev-12-9 \
            cuda-cccl-12-9 \
            libcublas-dev-12-9 \
            libcusolver-dev-12-9 \
            libcusparse-12-9 \
            libnvjitlink-12-9 \
            python3-numpy \
            python3-pytest
          "$CUDACXX" --version
      - name: Install ccache 4.14
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --retry-delay 2 --retry-max-time 60 --connect-timeout 15 --max-time 60 \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      # GitHub scopes actions/cache entries created by merge_group to the
      # temporary gh-readonly-queue ref, so they cannot seed later queue runs.
      # Publish a bounded snapshot from trusted master pushes and consume it
      # cross-run here; keep actions/cache as a fallback for rollout/reruns.
      - name: Locate trusted master CUDA ccache snapshot
        id: trusted_cuda_ccache
        if: (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id=""
          created_at=""
          source_sha=""
          publish=false
          artifact_name='cuda-ccache-master-12.9-sm120-v3'

          # Trust only artifacts produced by successful pushes of this CI workflow
          # on master. A repository-wide artifact-name lookup is insufficient
          # provenance because another ref/workflow could publish the same name.
          runs_payload=""
          if runs_payload="$(gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=master -f event=push -f status=success -f per_page=20)"; then
            while IFS=$'\t' read -r candidate_run_id candidate_head_sha; do
              [[ -n "$candidate_run_id" ]] || continue
              artifacts_payload=""
              if ! artifacts_payload="$(gh api --method GET \
                  "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts" \
                  -f name="${artifact_name}" -f per_page=10)"; then
                echo "::warning::Unable to inspect CUDA ccache artifacts for trusted run ${candidate_run_id}; trying the next run."
                continue
              fi
              candidate_created_at="$(jq -r \
                '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .created_at // empty' \
                <<<"${artifacts_payload}")"
              if [[ -n "$candidate_created_at" ]]; then
                run_id="$candidate_run_id"
                created_at="$candidate_created_at"
                source_sha="$candidate_head_sha"
                break
              fi
            done < <(
              jq -r '
                .workflow_runs[]
                | select(
                    .event == "push"
                    and .head_branch == "master"
                    and .conclusion == "success"
                  )
                | [.id, .head_sha] | @tsv
              ' <<<"${runs_payload}"
            )
          else
            echo "::warning::Unable to discover trusted master CUDA ccache snapshot; falling back to actions/cache or a cold compile."
          fi

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            if [[ -z "$created_at" ]]; then
              # Discovery is acceleration-only. Try to heal a missing/unavailable
              # snapshot, but publication below is also explicitly non-gating.
              publish=true
            else
              created_epoch="$(date -u -d "$created_at" +%s)"
              now_epoch="$(date -u +%s)"
              if (( now_epoch - created_epoch >= 10800 )); then
                publish=true
              else
                # A young snapshot can still predate newly compiled sources.
                # Cover every CUDA cache-key input, plus upstream/generated-data
                # and CI/toolchain configuration. Compare this checked-out push
                # with the run that actually supplied the selected artifact.
                cuda_inputs=(
                  .github cmake python/generativeqc_compiler python/generativeqc
                  CMakeLists.txt CMakePresets.json include src tests/native tools
                  manifests data upstream pyproject.toml uv.lock
                )
                if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]] ||
                    ! git diff --quiet --no-ext-diff --no-textconv \
                      "$source_sha" "$GITHUB_SHA" -- "${cuda_inputs[@]}"; then
                  # A missing/unreadable old commit also requests refresh;
                  # cache discovery remains acceleration-only, never a gate.
                  publish=true
                fi
              fi
            fi
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
      - name: Restore trusted master CUDA ccache snapshot
        id: trusted_cuda_ccache_download
        if: github.event_name == 'merge_group' && steps.trusted_cuda_ccache.outputs.run_id != '' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        continue-on-error: true
        # The downloader's inactivity timeout does not bound a slow transfer.
        # Leave the required compile budget available and try actions/cache next.
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cuda-ccache-master-12.9-sm120-v3
          # Extraction precedes digest validation. Never expose partial files to
          # ccache or overwrite the normal fallback cache on failure/timeout.
          path: ${{ runner.temp }}/trusted-cuda-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.trusted_cuda_ccache.outputs.run_id }}
      - name: Activate verified trusted CUDA ccache snapshot
        id: trusted_cuda_ccache_activate
        if: github.event_name == 'merge_group' && steps.trusted_cuda_ccache_download.outcome == 'success' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        continue-on-error: true
        timeout-minutes: 1
        env:
          TRUSTED_CUDA_CCACHE_DIR: ${{ runner.temp }}/trusted-cuda-ccache-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          test -d "$TRUSTED_CUDA_CCACHE_DIR"
          # Select the completed cache without copying several GB a second time.
          printf 'CCACHE_DIR=%s\n' "$TRUSTED_CUDA_CCACHE_DIR" >> "$GITHUB_ENV"
      - name: Discard incomplete trusted CUDA cache download
        if: github.event_name == 'merge_group' && steps.trusted_cuda_ccache_download.outcome != '' && steps.trusted_cuda_ccache_download.outcome != 'skipped' && steps.trusted_cuda_ccache_activate.outcome != 'success' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        continue-on-error: true
        timeout-minutes: 1
        env:
          TRUSTED_CUDA_CCACHE_DIR: ${{ runner.temp }}/trusted-cuda-ccache-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          # Remove only this attempted download, never the normal/selected cache.
          expected="${RUNNER_TEMP:?}/trusted-cuda-ccache-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          if [[ "${TRUSTED_CUDA_CCACHE_DIR:-}" != "$expected" || "${CCACHE_DIR:-}" == "$expected" ]]; then
            echo "::warning::Refusing to remove an unexpected or selected cache path."
            exit 1
          fi
          rm -rf -- "$expected"
      - name: Restore shared Linux CUDA ccache
        id: cuda_ccache
        if: (github.event_name != 'merge_group' || steps.trusted_cuda_ccache_activate.outcome != 'success') && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-cuda-v4-12.9-sm120-${{ hashFiles('.github/workflows/ci.yml', '.github/actions/install-native-cli-deps/**', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'include/**', 'src/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'tools/**', 'tests/native/**', 'manifests/**', 'data/**', 'upstream/**') }}
          restore-keys: |
            ccache-linux-cuda-v4-12.9-sm120-
            ccache-cuda-v2-12.9-sm120-
            ccache-native-cli-v1-cuda12.9-sm120-
      - name: Reset ccache statistics
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: ccache --zero-stats
      - name: Install native CLI dependencies
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: ./.github/actions/install-native-cli-deps
      - name: Configure production CUDA compile check
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: >-
          cmake --preset cuda-release-sm120
          -DGENERATIVEQC_BUILD_TESTS=ON
          -DGENERATIVEQC_CUDA_FAST_COMPILE=ON
          -DGENERATIVEQC_CUDA_COMPILE_JOBS=3
          -DGENERATIVEQC_COMPILER_CACHE=ccache
      - name: Compile production CUDA and runtime CTest
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        timeout-minutes: 30
        # This target links the full generativeqc shared library. Native GFN2 CUDA is
        # therefore compiled, device-linked, and consumed through the public
        # method adapter as part of this existing integration gate.
        run: >-
          cmake --build --preset cuda-release-sm120
          --target generativeqc_cuda_runtime_tests --parallel 3
        # File-backed secondary storage records misses, not the restored cache.
        # Only trusted master pushes hand this delta to the ordered CLI job.
        env:
          CCACHE_REMOTE_STORAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && format('file://{0}/cuda-ccache-handoff', runner.temp) || '' }}
          CCACHE_NORESHARE: "true"
      - name: Compile opted-in AO radial kernels with release resources
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        # Default native emission intentionally omits this experimental schedule.
        # Exercise its exact six kernel resource records without running a GPU.
        env:
          PYTHONPATH: python
          GENERATIVEQC_GRID_CUDA_ARCH: sm_120
          CUDA_VISIBLE_DEVICES: ""
        run: |
          test -x "$CUDACXX"
          mkdir -p build/ao-radial-compiler
          cat > build/ao-radial-compiler/nvcc <<'SH'
          #!/bin/sh
          exec ccache "$CUDACXX" "$@"
          SH
          chmod +x build/ao-radial-compiler/nvcc
          export GENERATIVEQC_NVCC="$PWD/build/ao-radial-compiler/nvcc"
          python3 -m pytest -q \
            tests/python/test_cuda_ao_radial_reuse.py::test_emitted_ao_cuda_compiles_with_specialized_resources \
            --basetemp build/ao-radial-compile
          # Runtime provenance fingerprints nvcc and its sibling ptxas.
          # The shared adapter retains compiler caching for this real toolchain.
          GENERATIVEQC_NVCC="$CUDACXX" python3 -m pytest -q \
            tests/python/test_packaging.py::test_wheel_grid_compiler_links_without_checkout_or_device \
            --basetemp build/grid-wheel-compile
      # PR/queue consumers never publish compiler snapshots. The master-only
      # miss handoff is not a full cache; CLI still owns final publication.
      - name: Check Fock and proposal preflight without a GPU
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          cmake --build --preset cuda-release-sm120 --target generativeqc_fock_build_tests generativeqc_scf_proposal_tests --parallel 2
          ctest --test-dir build/cuda-release-sm120 \
            -R '^generativeqc_(fock_build|scf_proposal)_tests$' --output-on-failure
      - name: Show CUDA ccache statistics
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: ccache --show-stats
      - name: Summarize compiler cache
        if: always() && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        timeout-minutes: 1
        shell: bash
        run: |
          mkdir -p build
          python3 tools/report_ci_ccache.py --label "CUDA 12.9 compile sm120" \
            --verbose --build-dir build/cuda-release-sm120 \
            | tee build/cuda-fast-compile-cache.txt
      - name: Preserve failed fast CUDA build diagnostics
        if: ${{ (failure() || cancelled()) && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cuda-fast-compile-diagnostics
          # Only per-target timings and the report's allowlisted compiler/build
          # identities: never upload the complete CMake cache or environment.
          path: |
            build/cuda-release-sm120/.ninja_log
            build/cuda-fast-compile-cache.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve opted-in AO radial resource reports
        if: ${{ always() && github.event_name != 'push' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ao-radial-release-compile
          path: |
            build/ao-radial-compile/**/ao.cu
            build/ao-radial-compile/**/ptxas.txt
            build/ao-radial-compile/**/resources.json
          if-no-files-found: error
          retention-days: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 14 }}
      - name: Bound the master fast CUDA cache handoff
        id: master_fast_ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          delta="$RUNNER_TEMP/cuda-ccache-handoff"
          if [[ -d "$delta" ]]; then
            # This is secondary storage, never the restored local cache.
            ccache --trim-dir "$delta" --trim-max-size 2GiB
            du -sh "$delta"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Hand fast CUDA cache misses to the master CLI
        id: master_fast_ccache_upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.master_fast_ccache.outputs.available == 'true' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cuda-ccache-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cuda-ccache-handoff
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  master-cache-cleanup:
    name: Trim trusted CUDA cache snapshots
    needs: native-cli-artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.native-cli-artifact.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep only the two newest trusted CUDA snapshots
        # Cache housekeeping must not invalidate an otherwise successful producer.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name='cuda-ccache-master-12.9-sm120-v3'
          workflow_payload="$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml")"
          workflow_id="$(jq -er '.id | select(type == "number")' <<<"$workflow_payload")"
          artifacts_payload="$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="$artifact_name" -f per_page=100 --paginate --slurp)"
          artifacts="$(jq -c --arg name "$artifact_name" \
            '[.[].artifacts[] | select(.name == $name and .expired == false)]' \
            <<<"$artifacts_payload")"
          candidate_run_ids="$(jq -r '[.[].workflow_run.id // empty] | unique[]' <<<"$artifacts")"
          trusted_artifacts=''
          # A same-name artifact is not proof of provenance. Match restore's
          # successful master-push boundary before counting or deleting it.
          # The current run is still in progress; its new snapshot cannot yet
          # replace either of the two completed, restorable snapshots.
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" =~ ^[0-9]+$ ]]
            run_payload="$(gh api --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            if jq -e --argjson workflow_id "$workflow_id" '
                .workflow_id == $workflow_id
                and .event == "push"
                and .head_branch == "master"
                and .status == "completed"
                and .conclusion == "success"
              ' <<<"$run_payload" >/dev/null; then
              trusted_artifacts+="$(jq -c --argjson run_id "$run_id" \
                '.[] | select(.workflow_run.id == $run_id) | {id, created_at}' \
                <<<"$artifacts")"$'\n'
            fi
          done <<<"$candidate_run_ids"
          # Finish all discovery before any mutation. A failed API request,
          # including a later page, leaves every existing snapshot untouched.
          delete_ids="$(jq -sr 'sort_by([.created_at, .id]) | reverse | .[2:][] | .id' \
            <<<"$trusted_artifacts")"
          while read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            gh api --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<<"$delete_ids"
  # Resource qualification must complete even when production compilation
  # starts cold. All required jobs check out the exact same event commit;
  # generate the native grid through its original CMake dependency graph here.
  cuda-resources:
    name: CUDA 12.9 release resources (sm_120)
    needs: merge_queue_liveness
    if: needs.merge_queue_liveness.outputs.active != 'false' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDACXX: /usr/local/cuda-12.9/bin/nvcc
      LD_LIBRARY_PATH: /usr/local/cuda-12.9/lib64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select README-only CI scope
        id: prose_scope
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          PROSE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          PROSE_TARGET_REF: ${{ github.event.merge_group.base_ref || '' }}
          PROSE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          # Missing/failed classification retains normal coverage. Only a verified
          # README-only PR or complete unmerged queue can omit expensive steps.
          set -euo pipefail
          scope=full
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" ]] && \
            candidate="$(timeout 75s python3 tools/ci_prose_scope.py \
              --event "$GITHUB_EVENT_NAME" --base-sha "$PROSE_BASE_SHA" \
              --head-sha "$GITHUB_SHA" --target-ref="$PROSE_TARGET_REF" \
              --pr-head-sha="$PROSE_PR_HEAD_SHA")" && [[ "$candidate" == "prose" ]]; then
            scope=prose
          fi
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'README-only CI scope: %s\n' "$scope"
      - name: Add NVIDIA CUDA repository
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          curl --fail --silent --show-error --location --output cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring.deb
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Install CUDA 12.9 build dependencies
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          sudo apt-get install --yes \
            cuda-nvcc-12-9 \
            cuda-cuobjdump-12-9 \
            cuda-cudart-dev-12-9 \
            cuda-cccl-12-9 \
            libcublas-dev-12-9 \
            libcusolver-dev-12-9 \
            libcusparse-12-9 \
            libnvjitlink-12-9 \
            python3-numpy \
            python3-pytest
          "$CUDACXX" --version
      - name: Install ccache 4.14
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --retry-delay 2 --retry-max-time 60 --connect-timeout 15 --max-time 60 \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Install native CLI dependencies
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: ./.github/actions/install-native-cli-deps
      - name: Configure native grid source generation
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: >-
          cmake --preset cuda-release-sm120
          -DGENERATIVEQC_BUILD_TESTS=ON
          -DGENERATIVEQC_CUDA_FAST_COMPILE=ON
          -DGENERATIVEQC_CUDA_COMPILE_JOBS=3
          -DGENERATIVEQC_COMPILER_CACHE=ccache
      - name: Generate exact native grid source and prerequisite headers
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        # Build only this generated-file target, never the library again.
        # The validator below checks these bytes against compiler emission and
        # still uses release flags, independently of the fast compile preset.
        run: >-
          cmake --build --preset cuda-release-sm120
          --target generated/generated_grid_policy.cu --parallel 2
      # This is release resource evidence. The separate production compile-only
      # job uses fast compilation and cannot supply acceptance resources.
      - name: Restore f-shell release objects
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        id: f_shell_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/f-shell-cache
          # The validator compiles source emitted by the common/integral compiler
          # stack. Do not invalidate this multi-minute release cache for unrelated
          # XC, method, tensor, include, or tooling changes on merge-group commits.
          # The validator's inner cache still keys generated bytes, toolchain,
          # runtime headers, target, schedule, and generator ABI. A stale restored
          # snapshot is safe and recompiles only identities that actually changed.
          # All resource transport keys exclude import-created Python bytecode.
          key: f-shell-cuda-v2-12.9-sm120-${{ hashFiles('python/generativeqc_compiler/common/**', 'python/generativeqc_compiler/integral/**', 'src/runtime/compensated_atomic.cuh', 'src/runtime/compensated_output.hpp', 'tools/validate_f_shells.py', 'tools/generativeqc_validation/f_shell.py', '!**/__pycache__/**', '!**/*.pyc', '!**/*.pyo') }}
          restore-keys: |
            f-shell-cuda-v2-12.9-sm120-
            f-shell-cuda-12.9-sm120-
      - name: Compile five representative f classes with release resources
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: >-
          python3 tools/validate_f_shells.py --tier compile --smoke
          --nvcc "$CUDACXX" --compile-jobs 2 --compile-timeout 900
          --output build/f-shell-smoke.json
      - name: Save f-shell release objects
        if: github.event_name != 'merge_group' && steps.f_shell_cache.outputs.cache-hit != 'true' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/f-shell-cache
          key: ${{ steps.f_shell_cache.outputs.cache-primary-key }}
      - name: Restore generated XC compile cache
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        id: xc_compile_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/xc-cache
          key: xc-cuda-12.9-sm120-${{ hashFiles('include/**', 'python/generativeqc_compiler/common/**', 'python/generativeqc_compiler/integral/**', 'python/generativeqc_compiler/xc/**', 'tools/validate_xc.py', '!**/__pycache__/**', '!**/*.pyc', '!**/*.pyo') }}
          restore-keys: |
            xc-cuda-12.9-sm120-
      - name: Compile generated XC derivative consumers
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: >-
          python3 tools/validate_xc.py --tier cuda-compile
          --functionals PBE --nvcc "$CUDACXX" --target sm_120
          --cache build/xc-cache --output build/xc-compile
      - name: Save generated XC compile cache
        if: github.event_name != 'merge_group' && steps.xc_compile_cache.outputs.cache-hit != 'true' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/xc-cache
          key: ${{ steps.xc_compile_cache.outputs.cache-primary-key }}
      - name: Compile native grid/XC region resources
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: >-
          python3 tools/validate_native_xc_resources.py
          --nvcc "$CUDACXX" --architecture sm_120
          --ao-radial-reuse
          --generated-dir build/cuda-release-sm120/generated
          --cmake-source build/cuda-release-sm120/generated/generated_grid_policy.cu
          --output build/native-xc-resource
          --functional PBE --npoint 4096 --tile-points 256 --nao 96 --spins 2
      - name: Restore stationary CUDA compile cache
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        id: stationary_cuda_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/stationary-cuda-compile
          key: stationary-cuda-12.9-sm120-${{ hashFiles('python/generativeqc_compiler/common/**', 'python/generativeqc_compiler/integral/**', 'python/generativeqc_compiler/method/**', 'python/generativeqc_compiler/tensor/**', 'tools/validate_stationary_cuda_compile.py', '!**/__pycache__/**', '!**/*.pyc', '!**/*.pyo') }}
          restore-keys: |
            stationary-cuda-12.9-sm120-
      - name: Compile generated r2SCAN stationary CUDA consumer
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: >-
          python3 tools/validate_stationary_cuda_compile.py
          --nvcc "$CUDACXX" --cache build/stationary-cuda-compile
          --architecture sm_120
      - name: Save stationary CUDA compile cache
        if: github.event_name != 'merge_group' && steps.stationary_cuda_cache.outputs.cache-hit != 'true' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/stationary-cuda-compile
          key: ${{ steps.stationary_cuda_cache.outputs.cache-primary-key }}
      - name: Restore TensorIR CUDA compile cache
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        id: tensor_static_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tensor-static-cuda-compile
          key: tensor-static-cuda-12.9-sm120-${{ hashFiles('python/generativeqc_compiler/common/**', 'python/generativeqc_compiler/tensor/**', 'tools/validate_tensor_cuda_compile.py', '!**/__pycache__/**', '!**/*.pyc', '!**/*.pyo') }}
          restore-keys: |
            tensor-static-cuda-12.9-sm120-
      - name: Compile generated TensorIR static-data artifacts
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: >-
          PYTHONPATH=python python3 tools/validate_tensor_cuda_compile.py
          --nvcc "$CUDACXX" --architecture sm_120
          --cache build/tensor-static-cuda-compile
      - name: Save TensorIR CUDA compile cache
        if: github.event_name != 'merge_group' && steps.tensor_static_cache.outputs.cache-hit != 'true' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tensor-static-cuda-compile
          key: ${{ steps.tensor_static_cache.outputs.cache-primary-key }}
      - name: Preserve generated XC resource reports
        if: always() && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xc-release-compile
          path: |
            build/xc-compile/**/compiler.log
            build/xc-compile/**/contract.json
            build/xc-compile/**/report.json
            build/xc-compile/summary.json
            build/native-xc-resource/compiler.log
            build/native-xc-resource/generated_grid_policy.cu
            build/native-xc-resource/report.json
          retention-days: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 14 }}
      - name: Preserve f-shell release resource report
        if: always() && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: f-shell-release-smoke
          path: |
            build/f-shell-smoke.json
            build/f-shell-cache/*/compile.json
            build/f-shell-cache/*/ptxas.txt
          retention-days: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 14 }}

  # The direct release shard is one indivisible NVCC object. Keep its cold
  # compile independent of the other resource validators, which previously
  # consumed its whole-job budget before this gate could finish. Preserve
  # the canonical production build path and release recipe for its ledger.
  cuda-direct-aot:
    name: CUDA 12.9 direct J/K AOT resources (sm_120)
    needs: merge_queue_liveness
    # Master alone publishes a default-branch snapshot for other PRs/queues.
    # PR-scoped caches cannot seed those refs; tags must not start this producer.
    if: needs.merge_queue_liveness.outputs.active != 'false' && (github.event_name != 'push' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDACXX: /usr/local/cuda-12.9/bin/nvcc
      LD_LIBRARY_PATH: /usr/local/cuda-12.9/lib64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select README-only CI scope
        id: prose_scope
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          PROSE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          PROSE_TARGET_REF: ${{ github.event.merge_group.base_ref || '' }}
          PROSE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          # Missing/failed classification retains normal coverage. Only a verified
          # README-only PR or complete unmerged queue can omit expensive steps.
          set -euo pipefail
          scope=full
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" ]] && \
            candidate="$(timeout 75s python3 tools/ci_prose_scope.py \
              --event "$GITHUB_EVENT_NAME" --base-sha "$PROSE_BASE_SHA" \
              --head-sha "$GITHUB_SHA" --target-ref="$PROSE_TARGET_REF" \
              --pr-head-sha="$PROSE_PR_HEAD_SHA")" && [[ "$candidate" == "prose" ]]; then
            scope=prose
          fi
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'README-only CI scope: %s\n' "$scope"
      - name: Add NVIDIA CUDA repository
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          curl --fail --silent --show-error --location --output cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring.deb
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Install CUDA 12.9 build dependencies
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          sudo apt-get install --yes \
            cuda-nvcc-12-9 \
            cuda-cuobjdump-12-9 \
            cuda-cudart-dev-12-9 \
            cuda-cccl-12-9 \
            libcublas-dev-12-9 \
            libcusolver-dev-12-9 \
            libcusparse-12-9 \
            libnvjitlink-12-9 \
            python3-numpy \
            python3-pytest
          "$CUDACXX" --version
      - name: Install ccache 4.14
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --retry-delay 2 --retry-max-time 60 --connect-timeout 15 --max-time 60 \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Install native CLI dependencies
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: ./.github/actions/install-native-cli-deps
      - name: Configure direct J/K AOT release context
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: >-
          cmake --preset cuda-release-sm120
          -DGENERATIVEQC_BUILD_TESTS=ON
          -DGENERATIVEQC_CUDA_FAST_COMPILE=OFF
          -DGENERATIVEQC_CUDA_COMPILE_JOBS=3
          -DGENERATIVEQC_COMPILER_CACHE=ccache
          -DCMAKE_CUDA_COMPILER="$CUDACXX"
      - name: Restore direct J/K AOT resource cache
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        id: direct_jk_aot_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/direct-jk-aot-cache
          # The validator compiles source emitted by the production AOT
          # generator. Do not invalidate this release-flag cache for unrelated
          # XC, method, tensor, or tooling changes on merge-group commits. The
          # validator's inner cache still keys generated bytes, preprocessed
          # identity, runtime headers, toolchain, flags, and generator ABI.
          # Include the inner implementation inputs in this immutable transport
          # key too: an exact stale snapshot otherwise cannot save its new object.
          # Exclude import-created bytecode so checkout mtimes do not churn keys.
          key: direct-jk-aot-12.9-sm120-${{ hashFiles('CMakeLists.txt', 'python/generativeqc_compiler/common/**', 'python/generativeqc_compiler/integral/**', 'src/scf/generated_shell_task.hpp', 'src/runtime/compensated_atomic.cuh', 'src/runtime/compensated_output.hpp', 'tools/generate_shell_kernels.py', 'tools/validate_direct_jk_aot_resources.py', '!**/__pycache__/**', '!**/*.pyc', '!**/*.pyo') }}
          restore-keys: |
            direct-jk-aot-12.9-sm120-
      - name: Qualify direct J/K AOT static resources (shard 6)
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        # Let the compiler stop its process group and write failure receipts
        # before the step/job deadline; leave time to retain those diagnostics.
        timeout-minutes: 22
        run: >-
          python3 tools/validate_direct_jk_aot_resources.py
          --nvcc "$CUDACXX" --cache build/direct-jk-aot-cache
          --output build/direct-jk-aot
          --cmake-cache build/cuda-release-sm120/CMakeCache.txt
          --generated-dir build/cuda-release-sm120/generated/production_shell_kernels
          --compile-timeout 1200
      - name: Save direct J/K AOT resource cache
        if: github.event_name != 'merge_group' && steps.direct_jk_aot_cache.outputs.cache-hit != 'true' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/direct-jk-aot-cache
          key: ${{ steps.direct_jk_aot_cache.outputs.cache-primary-key }}
      - name: Preserve direct J/K AOT resource qualification report
        if: always() && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: direct-jk-aot-resources
          path: |
            build/direct-jk-aot/report.json
            build/direct-jk-aot-cache/*/cuobjdump.txt
            build/direct-jk-aot-cache/*/compile.json
            build/direct-jk-aot-cache/*/compiler-cache.json
            build/direct-jk-aot-cache/*/nvcc.log
          retention-days: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 14 }}

  python:
    permissions:
      contents: read
      actions: read
    name: python (${{ matrix.shard }})
    needs: merge_queue_liveness
    if: needs.merge_queue_liveness.outputs.active != 'false' && github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        shard: [core-a, core-b, core-c, uccsd-forces, runtime-heavy, posthf, compiler-heavy, ecp-forces]
    runs-on: ubuntu-24.04
    # Full nightly/manual qualification includes expensive Hessian and Au replay.
    # Keep routine PR/merge-group feedback capped separately; do not truncate that tier.
    # The broad core suite is split deterministically by test file so routine
    # feedback does not leave one ~18-minute serial critical-path shard.
    # Keep the full test-step ceilings and leave setup/cache-save headroom.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 100 || 40 }}
    env:
      CCACHE_MAXSIZE: 2G
      # PySCF and NumPy can each fan out through BLAS/OpenMP. Keep those
      # libraries single-threaded so pytest-xdist owns the job-level parallelism.
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      # This job validates the CPU runtime; CUDA provider packaging/runtime has
      # dedicated CI. Keep the editable scikit-build reconfigure CPU-only too.
      GENERATIVEQC_ENABLE_CUDA: "OFF"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Offline retention tests recover real artifacts from historical commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Select README-only CI scope
        id: prose_scope
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          PROSE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          PROSE_TARGET_REF: ${{ github.event.merge_group.base_ref || '' }}
          PROSE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          # Missing/failed classification retains normal coverage. Only a verified
          # README-only PR or complete unmerged queue can omit expensive steps.
          set -euo pipefail
          scope=full
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" ]] && \
            candidate="$(timeout 75s python3 tools/ci_prose_scope.py \
              --event "$GITHUB_EVENT_NAME" --base-sha "$PROSE_BASE_SHA" \
              --head-sha "$GITHUB_SHA" --target-ref="$PROSE_TARGET_REF" \
              --pr-head-sha="$PROSE_PR_HEAD_SHA")" && [[ "$candidate" == "prose" ]]; then
            scope=prose
          fi
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'README-only CI scope: %s\n' "$scope"
      - name: Install uv and Python 3.11
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
          cache-suffix: "python-cpu-v1"
          prune-cache: true
      - name: Install ccache 4.14
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --retry-delay 2 --retry-max-time 60 --connect-timeout 15 --max-time 60 \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Restore shared Linux CPU ccache (Python native)
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        id: python_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-cpu-v4-ubuntu24-x86_64-${{ hashFiles('.github/workflows/ci.yml', '.github/actions/install-native-cli-deps/**', 'uv.lock', 'cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tests/native/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          restore-keys: |
            ccache-linux-cpu-v4-ubuntu24-x86_64-
      - name: Restore trusted CPU snapshot after primary miss
        if: steps.python_ccache.outcome == 'success' && steps.python_ccache.outputs.cache-matched-key == '' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/restore-cpu-ccache
        with:
          github-token: ${{ github.token }}
      - name: Reset ccache statistics
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: ccache --zero-stats
      - name: Prepare CPU Python test environment
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          uv venv --python 3.11
          mapfile -t ci_requirements < <(
            .venv/bin/python - <<'PY_INNER'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              config = tomllib.load(handle)
          requirements = [
              item
              for item in config["project"]["dependencies"]
              if not item.lstrip().startswith("nvidia-")
          ]
          requirements += config["project"]["optional-dependencies"]["test"]
          requirements += config["project"]["optional-dependencies"]["reference-test"]
          requirements += config["build-system"]["requires"]
          for item in dict.fromkeys(requirements):
              print(item)
          PY_INNER
          )
          uv pip install --python .venv/bin/python "${ci_requirements[@]}"
          # Exercise public autograd contracts without pulling CUDA-enabled
          # PyTorch wheels or project-declared NVIDIA runtime providers.
          uv pip install --python .venv/bin/python torch \
            --index-url https://download.pytorch.org/whl/cpu
          xtb_linalg="$(
            .venv/bin/python - <<'PY_INNER'
          from pathlib import Path
          import scipy

          site = Path(scipy.__file__).resolve().parent.parent
          matches = sorted((site / "scipy.libs").glob("libscipy_openblas*.so"))
          if len(matches) != 1:
              raise SystemExit(f"expected one SciPy OpenBLAS runtime, found {matches}")
          print(matches[0])
          PY_INNER
          )"
          echo "GENERATIVEQC_XTB_CPU_LINALG_LIBRARY=${xtb_linalg}" >> "$GITHUB_ENV"
      - name: Qualify owned sccache compiler lifetimes
        if: matrix.shard == 'compiler-heavy' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        env:
          GENERATIVEQC_REQUIRE_SCCACHE_TEST: "1"
        run: |
          uv pip install --python .venv/bin/python sccache==0.16.0
          PATH="$PWD/.venv/bin:$PATH" PYTHONPATH="$PWD/python:$PWD" \
            .venv/bin/python -m pytest -q \
              tests/python/test_compiler_cache.py \
              tests/python/test_compiler_cache_lifecycle.py \
              tests/python/test_sccache_lifecycle_integration.py
      - name: Install native CLI dependencies
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: ./.github/actions/install-native-cli-deps
      - name: Build the CPU native library
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          cmake -S . -B build -G Ninja \
            -DGENERATIVEQC_ENABLE_CUDA=OFF \
            -DGENERATIVEQC_BUILD_TESTS=OFF \
            -DGENERATIVEQC_PYTHON_WHEEL=ON \
            -DGENERATIVEQC_BUNDLE_XTB_OPENBLAS=OFF \
            -DGENERATIVEQC_XTB_CPU_LINALG_LIBRARY="$GENERATIVEQC_XTB_CPU_LINALG_LIBRARY" \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGENERATIVEQC_COMPILER_CACHE=ccache
          cmake --build build --parallel
      # All eight Python shards consume the same master CPU compiler cache;
      # no test shard races to publish an immutable partial snapshot.
      - name: Install GenerativeQC editable package
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          # Dependencies and build requirements are already present. Reuse the
          # native tree above so editable installation does not repeat codegen,
          # compilation, or the large CUDA-provider dependency installation.
          uv pip install --python .venv/bin/python --editable . \
            --no-deps --no-build-isolation -Cbuild-dir=build
      # Core and compiler-heavy reference tests need the external oracle inputs.
      # Builds and installed production paths above remain completely offline.
      - name: Restore pinned GFN1 and D3 reference inputs
        if: (matrix.shard == 'core-a' || matrix.shard == 'core-b' || matrix.shard == 'core-c' || matrix.shard == 'compiler-heavy') && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        id: gfn1_reference_sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/generativeqc-sources/xtbloom-gfn1-parameters
            .cache/generativeqc-sources/xtbloom-gfn1-d3
          key: gfn1-reference-inputs-v1-${{ hashFiles('upstream/manifest.json', 'tools/source_registry.py') }}
      - name: Prepare pinned GFN1 and D3 reference inputs
        if: (matrix.shard == 'core-a' || matrix.shard == 'core-b' || matrix.shard == 'core-c' || matrix.shard == 'compiler-heavy') && steps.gfn1_reference_sources.outputs.cache-hit != 'true' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: |
          .venv/bin/python tools/source_registry.py sync xtbloom-gfn1-parameters
          .venv/bin/python tools/source_registry.py sync xtbloom-gfn1-d3
      - name: Save pinned GFN1 and D3 reference inputs
        if: matrix.shard == 'core-a' && github.event_name != 'merge_group' && steps.gfn1_reference_sources.outputs.cache-hit != 'true' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/generativeqc-sources/xtbloom-gfn1-parameters
            .cache/generativeqc-sources/xtbloom-gfn1-d3
          key: ${{ steps.gfn1_reference_sources.outputs.cache-primary-key }}
      - name: Show ccache statistics
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: ccache --show-stats
      - name: Summarize compiler cache
        if: always() && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        run: python3 tools/report_ci_ccache.py --label "Python native ${{ matrix.shard }}"
      # Test-only probe and scientific CPU JIT objects are not produced by the
      # master CMake seed. Every Python shard can compile these test objects.
      # Retain their small ref-scoped overlay; never import it into shared caches.
      # Merge-group refs are ephemeral, so they restore but never publish caches.
      - name: Restore native Python probes
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        id: python_probe_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache-python-probes
          key: ccache-python-probes-v2-${{ matrix.shard }}-${{ hashFiles('cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py', 'tests/python/**', 'tests/native/**', 'benchmarks/**') }}
          restore-keys: |
            ccache-python-probes-v2-${{ matrix.shard }}-
      - name: Reset native probe ccache statistics
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache-python-probes
        run: ccache --zero-stats
      - name: Prepare bounded native diagnostics
        if: (matrix.shard == 'core-a' || matrix.shard == 'core-b' || matrix.shard == 'core-c') && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache-python-probes
          CCACHE_MAXSIZE: 256M
        run: |
          ccache --version
          ccache cc -std=c11 -fPIC -O2 -Wall -Wextra -Werror \
            -c tools/native_fault_record.c -o "$RUNNER_TEMP/native-fault-record.o"
          ccache cc -shared "$RUNNER_TEMP/native-fault-record.o" \
            -o "$RUNNER_TEMP/libnative-fault-record.so"
          .venv/bin/python -m pytest tests/test_ci_native_diagnostics.py -q
      - name: Run Python tests with coverage
        if: (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        id: python_tests
        timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 90 || 30 }}
        env:
          GENERATIVEQC_LIBRARY: ${{ github.workspace }}/build/libgenerativeqc.so
          GENERATIVEQC_BUILD_DIR: ${{ github.workspace }}/build
          CCACHE_DIR: ${{ runner.temp }}/ccache-python-probes
          CCACHE_MAXSIZE: 256M
        run: |
          export GENERATIVEQC_CI_SHARD="${{ matrix.shard }}"
          # Selection is sourced into this shell so its arrays flow into pytest.
          # GitHub Actions caps each inline run script at 21,000 characters.
          source .github/scripts/ci_select_python_shard.sh
          source .github/scripts/ci_collect_python_shard.sh
          diagnostic_args=()
          if [[ "${{ matrix.shard }}" == "core-a" || "${{ matrix.shard }}" == "core-b" || "${{ matrix.shard }}" == "core-c" ]]; then
            diagnostic_args+=(
              -p tools.pytest_native_diagnostics
              --native-diagnostics-dir="$PWD/.artifacts/native-diagnostics"
              --native-diagnostics-library="$RUNNER_TEMP/libnative-fault-record.so"
            )
          fi
          .venv/bin/python -m pytest "${collection_targets[@]}" -v \
            -o faulthandler_timeout=0 \
            -p tools.pytest_safe_diagnostics --diagnostic-timeout=900 \
            --diagnostics-dir="$PWD/.artifacts/python-diagnostics" \
            -n 4 --dist="$dist_mode" --durations=25 \
            --junitxml=".artifacts/pytest-${{ matrix.shard }}.xml" \
            "${collection_args[@]}" \
            "${coverage_args[@]}" \
            "${diagnostic_args[@]}" \
            "${extra_args[@]}"
      # Preserve valid probe compilations after test failures without freezing
      # the immutable complete key or promoting a PR snapshot to master.
      # A stats-only directory must not freeze an empty immutable snapshot.
      - name: Inspect native Python probe cache
        id: python_probe_contents
        shell: bash
        if: always() && github.event_name != 'merge_group' && steps.python_probe_ccache.outcome == 'success' && steps.python_probe_ccache.outputs.cache-primary-key != '' && steps.python_probe_ccache.outputs.cache-hit != 'true' && steps.python_tests.outcome != 'skipped' && steps.python_tests.outcome != '' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        timeout-minutes: 1
        continue-on-error: true
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache-python-probes
          CCACHE_MAXSIZE: 256M
        run: |
          ccache --print-stats --format=json | python3 -c '
          import json, sys
          count = json.load(sys.stdin)["files_in_cache"]
          if type(count) is not int or count < 0:
              raise ValueError("invalid ccache files_in_cache count")
          print("has-entries=" + str(count > 0).lower())
          ' >> "$GITHUB_OUTPUT"
      - name: Save native Python probes
        if: always() && github.event_name != 'merge_group' && steps.python_probe_ccache.outcome == 'success' && steps.python_probe_ccache.outputs.cache-primary-key != '' && steps.python_probe_ccache.outputs.cache-hit != 'true' && steps.python_tests.outcome != 'skipped' && steps.python_tests.outcome != '' && steps.python_probe_contents.outcome == 'success' && steps.python_probe_contents.outputs.has-entries == 'true' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache-python-probes
          key: ${{ steps.python_tests.outcome == 'success' && steps.python_probe_ccache.outputs.cache-primary-key || format('{0}-partial-{1}-{2}', steps.python_probe_ccache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}
      - name: Show post-test ccache statistics
        if: always() && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache-python-probes
          CCACHE_MAXSIZE: 256M
        run: ccache --show-stats
      - name: Preserve transient benchmark/debug artifacts on failure
        if: failure() && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-debug-${{ github.run_id }}-${{ matrix.shard }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Python coverage for the upload-only job
        if: github.event_name != 'merge_group' && (steps.prose_scope.outcome != 'success' || steps.prose_scope.outputs.scope != 'prose')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-python-${{ matrix.shard }}
          path: |
            coverage-python-${{ matrix.shard }}.xml
            .artifacts/pytest-${{ matrix.shard }}.xml
          include-hidden-files: true
          retention-days: 1


  cpu-benchmark:
    name: CPU performance (CodSpeed)
    # Publish PR-tier baselines on post-merge master pushes to avoid old fallback
    # comparisons. Scheduled/manual runs retain complete endpoint coverage.
    if: github.event_name != 'merge_group' && (github.event_name != 'push' || github.ref == 'refs/heads/master')
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    # PR CPU mismatches may use one bounded, no-upload ABBA diagnostic. Other
    # events keep the single-suite budget; no retry loop is permitted.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 65 || 15 }}
    env:
      # Non-PR events have no selector step to initialize the setup guard.
      GENERATIVEQC_CODSPEED_RUN: "1"
      CCACHE_MAXSIZE: 2G
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      # PR and master must execute the same bounded five-case sequence. Extra
      # preceding benchmarks can change allocator state despite cache resets.
      GENERATIVEQC_CODSPEED_EXTRA_CASES: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'wb97mv' || '' }}
      GENERATIVEQC_CODSPEED_TIER: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'pr' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select change-aware PR CodSpeed coverage
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(
            git diff --name-only --no-renames \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --
          )"
          # Skip only known non-performance files; unknown paths still run.
          # Selection stays identical to master whenever this job executes.
          relevant_files="$(grep -Ev '^(docs/|\.agents/|tests/|manifests/maintenance/|README(\..*)?$|CHANGELOG(\..*)?$|.*\.md$|tools/render_python_api_doc\.py$)' <<<"$changed_files" || true)"
          if [[ -z "$relevant_files" ]]; then
            echo "GENERATIVEQC_CODSPEED_RUN=0" >> "$GITHUB_ENV"
            echo "::notice::Skipping CPU performance for non-performance changes."
          else
            echo "GENERATIVEQC_CODSPEED_RUN=1" >> "$GITHUB_ENV"
          fi
      - name: Install uv and Python 3.11
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
          cache-suffix: "cpu-benchmark-v1"
          prune-cache: true
      - name: Install ccache 4.14
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --retry-delay 2 --retry-max-time 60 --connect-timeout 15 --max-time 60 \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 \
            "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
      - name: Restore shared Linux CPU ccache (CodSpeed)
        id: benchmark_ccache
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-cpu-v4-ubuntu24-x86_64-${{ hashFiles('.github/workflows/ci.yml', '.github/actions/install-native-cli-deps/**', 'uv.lock', 'cmake/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'CMakeLists.txt', 'include/**', 'src/**', 'tests/native/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
          restore-keys: |
            ccache-linux-cpu-v4-ubuntu24-x86_64-
      - name: Restore trusted CPU snapshot after primary miss
        if: steps.benchmark_ccache.outcome == 'success' && steps.benchmark_ccache.outputs.cache-matched-key == ''
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/restore-cpu-ccache
        with:
          github-token: ${{ github.token }}
      - name: Reset CPU benchmark ccache statistics
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: ccache --zero-stats
      - name: Build CPU benchmark library
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes nlohmann-json3-dev libssl-dev libarchive-dev
          cmake -S . -B build-benchmark -G Ninja \
            -DGENERATIVEQC_ENABLE_CUDA=OFF \
            -DGENERATIVEQC_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DGENERATIVEQC_COMPILER_CACHE=ccache
          cmake --build build-benchmark --target generativeqc --parallel
      - name: Show CPU benchmark ccache statistics
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: ccache --show-stats
      - name: Summarize compiler cache
        if: always() && env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: python3 tools/report_ci_ccache.py --label "CPU CodSpeed"
      - name: Install benchmark dependencies
        if: env.GENERATIVEQC_CODSPEED_RUN != '0'
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python \
            numpy pytest pytest-codspeed==5.0.3
      - name: Qualify PR CodSpeed comparison
        id: baseline
        if: github.event_name == 'pull_request' && env.GENERATIVEQC_CODSPEED_RUN != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CODSPEED_MERGE_SHA: ${{ github.sha }}
          CODSPEED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODSPEED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CODSPEED_REPO: ${{ github.repository }}
        run: |
          .venv/bin/python tools/codspeed_baseline.py qualify \
            --merge-sha "$CODSPEED_MERGE_SHA" --head-sha "$CODSPEED_HEAD_SHA" \
            --base-ref "$CODSPEED_BASE_REF" --repo "$CODSPEED_REPO"
      - name: Run CPU CodSpeed endpoint suite
        if: github.event_name != 'pull_request' || (env.GENERATIVEQC_CODSPEED_RUN != '0' && steps.baseline.outputs.qualified == 'true')
        uses: CodSpeedHQ/action@88472375d0a4572cf70a9f1fe3a4e0ab8da1b924 # v5.0.1
        env:
          PYTHONPATH: ${{ github.workspace }}/python
          GENERATIVEQC_LIBRARY: ${{ github.workspace }}/build-benchmark/libgenerativeqc.so
        with:
          # Hosted GitHub runners are noisy for wall-clock gating; simulation
          # provides the stable PR/scheduled regression signal without Macro Runner quota.
          # PR/master share RHF, PBE, WB97M-V, PBE-force and changed-geometry
          # RHF, in that order. Scheduled/manual runs retain the full tier.
          mode: simulation
          run: .venv/bin/python -m pytest benchmarks/test_cpu_codspeed.py --codspeed -q
      - name: Record successful master CodSpeed baseline
        if: github.event_name == 'push'
        run: |
          .venv/bin/python tools/codspeed_baseline.py record \
            --sha "${{ github.sha }}" --output codspeed-baseline/baseline.json
      - name: Publish exact-master CodSpeed baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codspeed-cpu-baseline-${{ github.sha }}
          path: codspeed-baseline/baseline.json
          if-no-files-found: error
          retention-days: 30

      - name: Set up pinned artifact-only CodSpeed diagnostic
        if: github.event_name == 'pull_request' && steps.baseline.outputs.paired_diagnostic == 'true' && contains(github.event.pull_request.labels.*.name, 'ci/codspeed-paired')
        uses: CodSpeedHQ/action@88472375d0a4572cf70a9f1fe3a4e0ab8da1b924 # v5.0.1
        env:
          CODSPEED_SKIP_UPLOAD: "true"
        with:
          runner-version: "5.0.1"
          mode: simulation
          # Bootstrap instruments without wrapping/nesting the real runners.
          run: "true"
          allow-empty: "true"

      - name: Compare exact baseline and head on this runner
        if: github.event_name == 'pull_request' && steps.baseline.outputs.paired_diagnostic == 'true' && contains(github.event.pull_request.labels.*.name, 'ci/codspeed-paired')
        env:
          CODSPEED_SKIP_UPLOAD: "true"
          CODSPEED_MERGE_SHA: ${{ github.sha }}
          CODSPEED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODSPEED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          .venv/bin/python tools/codspeed_pair.py \
            --merge-sha "$CODSPEED_MERGE_SHA" --head-sha "$CODSPEED_HEAD_SHA" \
            --base-ref "$CODSPEED_BASE_REF" \
            --output "$RUNNER_TEMP/codspeed-paired"

      - name: Preserve bounded same-runner diagnostic
        if: always() && github.event_name == 'pull_request' && steps.baseline.outputs.paired_diagnostic == 'true' && contains(github.event.pull_request.labels.*.name, 'ci/codspeed-paired')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codspeed-paired-diagnostic-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codspeed-paired/artifact/
          if-no-files-found: error
          retention-days: 7

  upload-coverage:
    name: upload-coverage (${{ matrix.batch }})
    timeout-minutes: 8
    needs: [cpu, python]
    if: ${{ github.event_name != 'merge_group' && github.event_name != 'push' && !cancelled() && needs.cpu.result == 'success' && needs.python.result == 'success' }}
    # Coverage reporting is observability rather than a correctness gate. A
    # Codecov or artifact-service outage must not fail the workflow.
    continue-on-error: true
    # Three reports share each runner to reduce queue admissions. All seven
    # action steps are individually bounded to one minute, leaving one minute
    # of the job budget for runner/action cleanup even if every step times out.
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: cpp-core
            reports:
              - artifact: coverage-report-cpp
                file: coverage/cpp/coverage-cpp.info
                directory: coverage/cpp
                flag: cpp
                name: code-coverage/cpp
              - artifact: coverage-report-python-core-a
                file: coverage/python-core-a/coverage-python-core-a.xml
                directory: coverage/python-core-a
                flag: python
                name: code-coverage/python-core-a
              - artifact: coverage-report-python-core-b
                file: coverage/python-core-b/coverage-python-core-b.xml
                directory: coverage/python-core-b
                flag: python
                name: code-coverage/python-core-b
          - batch: core-forces
            reports:
              - artifact: coverage-report-python-core-c
                file: coverage/python-core-c/coverage-python-core-c.xml
                directory: coverage/python-core-c
                flag: python
                name: code-coverage/python-core-c
              - artifact: coverage-report-python-uccsd-forces
                file: coverage/python-uccsd-forces/coverage-python-uccsd-forces.xml
                directory: coverage/python-uccsd-forces
                flag: python
                name: code-coverage/python-uccsd-forces
              - artifact: coverage-report-python-runtime-heavy
                file: coverage/python-runtime-heavy/coverage-python-runtime-heavy.xml
                directory: coverage/python-runtime-heavy
                flag: python
                name: code-coverage/python-runtime-heavy
          - batch: heavy
            reports:
              - artifact: coverage-report-python-posthf
                file: coverage/python-posthf/coverage-python-posthf.xml
                directory: coverage/python-posthf
                flag: python
                name: code-coverage/python-posthf
              - artifact: coverage-report-python-compiler-heavy
                file: coverage/python-compiler-heavy/coverage-python-compiler-heavy.xml
                directory: coverage/python-compiler-heavy
                flag: python
                name: code-coverage/python-compiler-heavy
              - artifact: coverage-report-python-ecp-forces
                file: coverage/python-ecp-forces/coverage-python-ecp-forces.xml
                directory: coverage/python-ecp-forces
                flag: python
                name: code-coverage/python-ecp-forces
    runs-on: ubuntu-24.04
    # Keep OIDC away from jobs that build or execute pull-request code. This
    # job checks out source metadata and consumes coverage artifacts only.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage report 1
        id: download_1
        timeout-minutes: 1
        # One missing artifact must not suppress the remaining reports.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.reports[0].artifact }}
          path: ${{ matrix.reports[0].directory }}
      - name: Upload coverage report 1 to Codecov
        if: ${{ !cancelled() && steps.download_1.outcome == 'success' }}
        timeout-minutes: 1
        # Also cover action setup, integrity-check, and OIDC failures.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ matrix.reports[0].file }}
          flags: ${{ matrix.reports[0].flag }}
          name: ${{ matrix.reports[0].name }}
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          version: v11.3.1
      - name: Download coverage report 2
        id: download_2
        timeout-minutes: 1
        # One missing artifact must not suppress the remaining reports.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.reports[1].artifact }}
          path: ${{ matrix.reports[1].directory }}
      - name: Upload coverage report 2 to Codecov
        if: ${{ !cancelled() && steps.download_2.outcome == 'success' }}
        timeout-minutes: 1
        # Also cover action setup, integrity-check, and OIDC failures.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ matrix.reports[1].file }}
          flags: ${{ matrix.reports[1].flag }}
          name: ${{ matrix.reports[1].name }}
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          version: v11.3.1
      - name: Download coverage report 3
        id: download_3
        timeout-minutes: 1
        # One missing artifact must not suppress the remaining reports.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.reports[2].artifact }}
          path: ${{ matrix.reports[2].directory }}
      - name: Upload coverage report 3 to Codecov
        if: ${{ !cancelled() && steps.download_3.outcome == 'success' }}
        timeout-minutes: 1
        # Also cover action setup, integrity-check, and OIDC failures.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ matrix.reports[2].file }}
          flags: ${{ matrix.reports[2].flag }}
          name: ${{ matrix.reports[2].name }}
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          version: v11.3.1


  native-cli-artifact:
    name: Native C++ CUDA CLI package (sm_120)
    # Master/tag/manual builds retain ordered CUDA qualification. Master also
    # consumes its trusted-cache publication decision. PR/queue builds below
    # share these package steps without waiting for the independent CUDA check.
    needs: cuda-compile
    if: >-
      needs.cuda-compile.result == 'success' &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # Master seeds both CUDA flag variants; PRs/merge groups compile only the CLI.
    timeout-minutes: 210
    permissions:
      contents: read
      actions: read
    env:
      FAST_CUDA_CACHE_ARTIFACT_ID: ${{ needs.cuda-compile.outputs.fast_cache_artifact_id }}
      FAST_CUDA_CACHE_RUN_ATTEMPT: ${{ needs.cuda-compile.outputs.fast_cache_run_attempt }}
      CUDACXX: /usr/local/cuda-12.9/bin/nvcc
      LD_LIBRARY_PATH: /usr/local/cuda-12.9/lib64
      CCACHE_MAXSIZE: 5G
      PUBLISH_CUDA_CACHE_SNAPSHOT: ${{ needs.cuda-compile.outputs.publish_cache_snapshot }}
    steps: &native_cli_package_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify native CLI packaging impact
        id: cli_scope
        shell: bash
        env:
          CLI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          CLI_TARGET_REF: ${{ github.event.merge_group.base_ref || '' }}
        run: |
          set -euo pipefail
          tier="$(python3 tools/native_cli_ci_scope.py \
            --event "$GITHUB_EVENT_NAME" --base-sha "$CLI_BASE_SHA" --head-sha "$GITHUB_SHA" \
            --target-ref="$CLI_TARGET_REF")"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Native CLI build tier: $tier"
      - name: Validate semantic version tag before building
        if: steps.cli_scope.outputs.tier != 'skip'
        id: cli_version
        shell: bash
        run: |
          version="$(sed -nE 's/^project\(GenerativeQC VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)"
          if [[ -z "$version" ]]; then
            echo "::error::Unable to resolve the CMake project version"
            exit 1
          fi
          release=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME must exactly match CMake project version v$version"
              exit 1
            fi
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Add NVIDIA CUDA repository
        if: steps.cli_scope.outputs.tier != 'skip'
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring.deb
          sudo apt-get update -o Acquire::Retries=3
      - name: Install CUDA 12.9 build dependencies
        if: steps.cli_scope.outputs.tier != 'skip'
        shell: bash
        run: |
          sudo apt-get install --yes \
            cuda-nvcc-12-9 cuda-cuobjdump-12-9 cuda-cudart-dev-12-9 \
            cuda-cccl-12-9 libcublas-dev-12-9 libcusolver-dev-12-9 \
            libcusparse-12-9 libnvjitlink-12-9 \
            libopenblas-dev libarchive-dev libssl-dev nlohmann-json3-dev \
            python3-numpy python3-pytest
          "$CUDACXX" --version
      - name: Install ccache 4.14
        if: steps.cli_scope.outputs.tier != 'skip'
        shell: bash
        run: |
          archive="ccache-${CCACHE_VERSION}-linux-x86_64-glibc.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --retry-delay 2 --retry-max-time 60 --connect-timeout 15 --max-time 60 \
            --output "/tmp/${archive}" \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 "/tmp/ccache-${CCACHE_VERSION}-linux-x86_64-glibc/ccache" \
            /usr/local/bin/ccache
          ccache --version
      - name: Test deterministic native CLI packager and static-force contracts
        if: steps.cli_scope.outputs.tier != 'skip'
        run: |
          python3 -m unittest discover -s tests/python -p test_native_cli_package.py
          python3 -m unittest discover -s tests/python -p test_native_cli_ci_scope.py
          python3 -m unittest discover -s tests/python -p test_native_cli_stationary_distribution.py
      - name: Restore shared Linux CUDA ccache
        if: steps.cli_scope.outputs.tier != 'skip'
        id: cli_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-linux-cuda-v4-12.9-sm120-${{ hashFiles('.github/workflows/ci.yml', '.github/actions/install-native-cli-deps/**', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'include/**', 'src/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'tools/**', 'tests/native/**', 'manifests/**', 'data/**', 'upstream/**') }}
          restore-keys: |
            ccache-linux-cuda-v4-12.9-sm120-
            ccache-native-cli-v1-cuda12.9-sm120-
            ccache-cuda-v2-12.9-sm120-
      # Recover an evicted/missing cache from trusted master. Prefix hits remain
      # usable: an older artifact must never replace a successfully restored cache.
      - name: Locate trusted master CLI ccache snapshot
        id: trusted_cli_ccache
        if: steps.cli_scope.outputs.tier != 'skip' && steps.cli_ccache.outcome == 'success' && steps.cli_ccache.outputs.cache-matched-key == '' && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: timeout --kill-after=2s 25s python3 tools/ci_cli_ccache_snapshot.py discover
      - name: Restore trusted master CLI ccache snapshot
        id: trusted_cli_ccache_download
        if: steps.trusted_cli_ccache.outcome == 'success' && steps.trusted_cli_ccache.outputs.artifact_id != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.trusted_cli_ccache.outputs.artifact_id }}
          run-id: ${{ steps.trusted_cli_ccache.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ steps.trusted_cli_ccache.outputs.stage }}
          merge-multiple: true
          digest-mismatch: error
      - name: Activate verified trusted CLI ccache snapshot
        id: trusted_cli_ccache_activate
        if: steps.trusted_cli_ccache_download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          CLI_CACHE_STAGE: ${{ steps.trusted_cli_ccache.outputs.stage }}
        run: python3 tools/ci_cli_ccache_snapshot.py activate
      - name: Discard incomplete trusted CLI cache download
        if: always() && steps.trusted_cli_ccache.outputs.stage != '' && steps.trusted_cli_ccache_activate.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          CLI_CACHE_STAGE: ${{ steps.trusted_cli_ccache.outputs.stage }}
        run: python3 tools/ci_cli_ccache_snapshot.py cleanup
      # Keep one small immutable miss delta per PR, outside every trusted cache.
      # No commit/run suffix: repeated updates must not accumulate cache snapshots.
      - name: Prepare isolated PR CLI compiler delta
        id: pr_cli_ccache
        if: github.event_name == 'pull_request' && steps.cli_scope.outputs.tier != 'skip'
        continue-on-error: true
        timeout-minutes: 1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/ci_pr_cli_ccache.py prepare
      - name: Restore only this PR CLI compiler delta
        id: pr_cli_ccache_restore
        if: github.event_name == 'pull_request' && steps.pr_cli_ccache.outputs.key != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pr_cli_ccache.outputs.path }}
          key: ${{ steps.pr_cli_ccache.outputs.key }}
      - name: Restore this run's master fast CUDA cache delta
        id: master_fast_ccache_download
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cli_scope.outputs.tier != 'skip' && env.FAST_CUDA_CACHE_ARTIFACT_ID != '' && env.FAST_CUDA_CACHE_RUN_ATTEMPT == github.run_attempt
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # The immutable ID comes only from this run's required CUDA job.
          # No cross-run lookup or artifact-name fallback is permitted here.
          artifact-ids: ${{ env.FAST_CUDA_CACHE_ARTIFACT_ID }}
          path: ${{ runner.temp }}/cuda-ccache-handoff
      - name: Check for an already-failed required CI sibling
        if: steps.cli_scope.outputs.tier != 'skip' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_required_failure_guard.py
      # The required cuda-compile job already checks fast CUDA on PRs/merge
      # groups. Only master seeds both compiler-flag identities here, on the
      # same runner that saves/publishes the shared cache snapshot.
      - name: Seed fast CUDA CI objects in the shared cache
        id: fast_cuda_seed
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cli_scope.outputs.tier != 'skip'
        env:
          # Strict ccache lookup admits only compatible compiler/source inputs.
          # Remote hits populate the local cache used by release and publication.
          CCACHE_REMOTE_STORAGE: ${{ steps.master_fast_ccache_download.outcome == 'success' && format('file://{0}/cuda-ccache-handoff read-only', runner.temp) || '' }}
        shell: bash
        run: |
          ccache --zero-stats
          echo "cache_stats_reset=true" >> "$GITHUB_OUTPUT" || \
            echo "::warning::Unable to record compiler-cache statistics boundary"
          cmake --preset cuda-release-sm120 \
            -DGENERATIVEQC_BUILD_TESTS=ON \
            -DGENERATIVEQC_CUDA_FAST_COMPILE=ON \
            -DGENERATIVEQC_CUDA_COMPILE_JOBS=3 \
            -DGENERATIVEQC_COMPILER_CACHE=ccache
          cmake --build --preset cuda-release-sm120 \
            --target generativeqc_cuda_runtime_tests --parallel 3
      - name: Report fast CUDA seed compiler cache
        if: always() && steps.cli_scope.outputs.tier != 'skip' && steps.fast_cuda_seed.outputs.cache_stats_reset == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: >-
          python3 tools/report_ci_ccache.py
          --label "CUDA native CLI fast seed (shared library)"
          --verbose --build-dir build/cuda-release-sm120
      # A Ninja log has no reliable invocation boundary. Only report a fresh
      # CLI tree; the master fast seed above owns a different build directory.
      - name: Record fresh CLI Ninja timing boundary
        id: cli_ninja_boundary
        if: steps.cli_scope.outputs.tier != 'skip'
        continue-on-error: true
        timeout-minutes: 1
        run: >-
          python3 tools/report_ci_ninja_timing.py
          --check-fresh --build-dir build/cuda-release-cli-sm120
      - name: Build monolithic C++ CUDA CLI (release or fast PR)
        id: native_cli_build
        if: steps.cli_scope.outputs.tier != 'skip'
        shell: bash
        env:
          CLI_FAST_COMPILE: ${{ steps.cli_scope.outputs.tier == 'fast' && 'ON' || 'OFF' }}
          # A local trusted-cache hit is never copied into this delta. Exact
          # restored deltas are immutable/read-only; later new misses stay local.
          # Reject even a primary-key prefix match returned by the cache service.
          CCACHE_REMOTE_STORAGE: ${{ github.event_name == 'pull_request' && steps.pr_cli_ccache.outputs.key != '' && steps.pr_cli_ccache_restore.outcome == 'success' && (steps.pr_cli_ccache_restore.outputs.cache-hit == 'true' || steps.pr_cli_ccache_restore.outputs.cache-matched-key == '') && format('file://{0}{1}', steps.pr_cli_ccache.outputs.path, steps.pr_cli_ccache_restore.outputs.cache-hit == 'true' && ' read-only' || '') || '' }}
          CCACHE_NORESHARE: "true"
        run: |
          ccache --zero-stats
          echo "cache_stats_reset=true" >> "$GITHUB_OUTPUT" || \
            echo "::warning::Unable to record compiler-cache statistics boundary"
          # PCH calls bypass strict ccache. Disable only this CI preset use;
          # retain normal header/macro validation instead of cache sloppiness.
          cmake --preset cuda-release-cli-sm120 \
            -DGENERATIVEQC_ENABLE_CXX_PCH=OFF \
            -DGENERATIVEQC_CUDA_FAST_COMPILE="$CLI_FAST_COMPILE"
          cmake --build --preset cuda-release-cli-sm120 --parallel 3
      - name: Report completed CLI Ninja command timings
        if: always() && steps.cli_scope.outputs.tier != 'skip' && steps.native_cli_build.outcome != '' && steps.native_cli_build.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 1
        env:
          FRESH_NINJA_LOG: ${{ steps.cli_ninja_boundary.outputs.fresh }}
        run: >-
          python3 tools/report_ci_ninja_timing.py
          --build-dir build/cuda-release-cli-sm120 --fresh-log "$FRESH_NINJA_LOG"
      - name: Show detailed CLI compiler cache statistics
        if: always() && steps.cli_scope.outputs.tier != 'skip' && steps.native_cli_build.outputs.cache_stats_reset == 'true'
        continue-on-error: true
        run: ccache --show-stats --verbose
      - name: Bound successful PR CLI compiler misses
        id: pr_cli_ccache_bound
        if: always() && github.event_name == 'pull_request' && steps.native_cli_build.outcome == 'success' && steps.pr_cli_ccache.outputs.key != '' && steps.pr_cli_ccache_restore.outcome == 'success' && steps.pr_cli_ccache_restore.outputs.cache-hit != 'true' && steps.pr_cli_ccache_restore.outputs.cache-matched-key == ''
        continue-on-error: true
        timeout-minutes: 1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/ci_pr_cli_ccache.py bound
      - name: Save this PR CLI compiler delta once
        if: always() && github.event_name == 'pull_request' && steps.native_cli_build.outcome == 'success' && steps.pr_cli_ccache_bound.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pr_cli_ccache.outputs.path }}
          key: ${{ steps.pr_cli_ccache.outputs.key }}
      - name: Verify full automatic CUDA XC catalog is compiled for distribution
        if: steps.cli_scope.outputs.tier != 'skip'
        shell: bash
        run: |
          PYTHONPATH=python python3 - <<'PY'
          import re
          from pathlib import Path
          from generativeqc_compiler.xc.automatic_semilocal import automatic_registry_entries

          build = Path("build/cuda-release-cli-sm120")
          cache = (build / "CMakeCache.txt").read_text()
          assert re.search(
              r"^GENERATIVEQC_ENABLE_AUTOMATIC_XC_CUDA_AOT:BOOL=ON$",
              cache, re.MULTILINE,
          ), "automatic CUDA XC AOT is disabled in the release CLI"
          assert re.search(
              r"^GENERATIVEQC_AUTOMATIC_XC_CUDA_FUNCTIONALS:STRING=$",
              cache, re.MULTILINE,
          ), "release CLI must package the entire automatic XC catalog"
          source_dir = build / "generated/libxc_semilocal_cuda"
          shards = sorted(source_dir.glob("generated_libxc_semilocal_cuda_*.cu"))
          assert len(shards) == 32, f"expected 32 CUDA shards, got {len(shards)}"
          present = [
              int(code, 16)
              for shard in shards
              for code in re.findall(r"case 0x([0-9a-f]+)U:", shard.read_text())
          ]
          expected = {entry.code for entry in automatic_registry_entries()}
          assert len(present) == len(expected) and set(present) == expected, (
              f"automatic CUDA XC package mismatch: "
              f"{len(present)} cases, {len(expected)} registrations"
          )
          print(f"Verified all {len(expected)} automatic CUDA XC registrations")
          PY
      - name: Verify compiler-selected CUDA graph programs are linked into the CLI
        if: steps.cli_scope.outputs.tier != 'skip'
        shell: bash
        run: |
          python3 tools/check_native_cli_stationary.py \
            --build-tree build/cuda-release-cli-sm120 \
            --cli build/cuda-release-cli-sm120/generativeqc
      - name: Smoke-test release-mode native command
        id: cli_smoke
        if: steps.cli_scope.outputs.tier != 'skip'
        shell: bash
        run: |
          cli="$PWD/build/cuda-release-cli-sm120/generativeqc"
          test -x "$cli"
          "$cli" --version | tee build/native-cli-version.txt
          grep -F "${{ steps.cli_version.outputs.version }}" build/native-cli-version.txt
          "$cli" methods --json > build/native-cli-methods.json
          python3 -m json.tool < build/native-cli-methods.json > /dev/null
          "$cli" basis list --json > build/native-cli-bases.json
          python3 -m json.tool < build/native-cli-bases.json > /dev/null
          if readelf -d "$cli" | grep -E 'NEEDED.*libgenerativeqc\.so'; then
            echo "::error::Monolithic CLI unexpectedly depends on libgenerativeqc.so"
            exit 1
          fi
          ldd "$cli"
          ccache --show-stats
      # GitHub-hosted ubuntu-24.04 builders do not have a GPU. On an attached
      # compatible Blackwell device, run the actual CLI E+F matrix; otherwise
      # report the missing device instead of mislabeling link checks as GPU QA.
      - name: Exercise ten CLI CUDA E+F endpoints on an attached sm_120 GPU
        if: steps.cli_scope.outputs.tier != 'skip'
        shell: bash
        run: |
          if command -v nvidia-smi >/dev/null 2>&1 && \
             nvidia-smi --query-gpu=compute_cap --format=csv,noheader 2>/dev/null | grep -Eq '^12[.]'; then
            python3 tests/native/test_cli_cuda_stationary.py \
              build/cuda-release-cli-sm120/generativeqc
          else
            echo "::notice::No sm_120 GPU on hosted CI: ten-method CLI E+F device test NOT RUN; run tests/native/test_cli_cuda_stationary.py under a real sm_120 Slurm allocation."
          fi
      - name: Summarize compiler cache
        if: always() && steps.cli_scope.outputs.tier != 'skip' && steps.native_cli_build.outputs.cache_stats_reset == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: >-
          python3 tools/report_ci_ccache.py
          --label "CUDA native CLI monolithic build"
          --build-dir build/cuda-release-cli-sm120
      # A cache snapshot can contain entries for long-abandoned source/flag
      # identities even when the 5 GiB cap was respected. Evict only entries
      # untouched for a week; hits during either seed/build refresh recency.
      # Do not clean consumer caches or delete the just-built compiler outputs.
      - name: Retire unused CUDA objects before publishing the cache
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.fast_cuda_seed.outcome != '' && steps.fast_cuda_seed.outcome != 'skipped' }}
        timeout-minutes: 2
        continue-on-error: true
        run: |
          ccache --evict-older-than 7d
          ccache --cleanup
          ccache --show-stats
      - name: Save complete shared CUDA ccache on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cli_ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cli_ccache.outputs.cache-primary-key }}
      # ccache retains successful compilations even if a later build/link fails.
      # Recover that master work without freezing the complete snapshot key.
      - name: Preserve partial master CUDA compiler work
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cli_ccache.outputs.cache-primary-key != '' && steps.cli_ccache.outputs.cache-hit != 'true' && steps.fast_cuda_seed.outcome != '' && steps.fast_cuda_seed.outcome != 'skipped' && steps.cli_smoke.outcome != 'success' }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ format('{0}-partial-{1}-{2}', steps.cli_ccache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}
      # An artifact mirrors the single master cache for ephemeral merge-group
      # refs. It does not represent an independently built compiler cache.
      - name: Publish trusted master CUDA ccache snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.PUBLISH_CUDA_CACHE_SNAPSHOT == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cuda-ccache-master-12.9-sm120-v3
          path: ~/.cache/ccache
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
      - name: Install and package native command and notices
        if: steps.cli_scope.outputs.tier != 'skip'
        shell: bash
        env:
          CLI_RELEASE: ${{ steps.cli_version.outputs.release }}
          CLI_VERSION: ${{ steps.cli_version.outputs.version }}
        run: |
          cmake --install build/cuda-release-cli-sm120 --prefix "$PWD/build/native-cli-prefix"
          args=()
          if [[ "$CLI_RELEASE" == 'true' ]]; then
            args+=(--release)
          fi
          python3 tools/package_native_cli.py \
            --prefix "$PWD/build/native-cli-prefix" \
            --output-dir dist \
            --version "$CLI_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$(git log -1 --format=%ct "$GITHUB_SHA")" \
            "${args[@]}"
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - name: Verify packaged executable and report byte sizes
        if: steps.cli_scope.outputs.tier != 'skip'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          [[ "${#archives[@]}" -eq 1 ]]
          archive="${archives[0]}"
          # CMake rewrites RUNPATH during installation; these are the exact
          # installed bytes consumed by the packager, not the build-tree ELF.
          cli="$PWD/build/native-cli-prefix/bin/generativeqc"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf "$archive" -C "$stage"
          packaged=("$stage"/*/bin/generativeqc)
          [[ "${#packaged[@]}" -eq 1 && -f "${packaged[0]}" ]]
          cmp "$cli" "${packaged[0]}"
          cp "$cli" "$stage/generativeqc-stripped"
          strip --strip-unneeded "$stage/generativeqc-stripped"
          {
            echo "### Native CUDA CLI sizes (${GITHUB_SHA:0:12})"
            echo ""
            echo '| Artifact | Size (bytes) |'
            echo '|---|---:|'
            echo "| Unstripped executable | $(stat -c '%s' "$cli") |"
            echo "| Stripped executable (estimate) | $(stat -c '%s' "$stage/generativeqc-stripped") |"
            echo "| tar.gz distribution | $(stat -c '%s' "$archive") |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload latest native CUDA CLI to GitHub Actions Artifacts
        if: steps.cli_scope.outputs.tier != 'skip'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generativeqc-native-cli-cuda12.9-sm120-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 7 || 30 }}
          overwrite: true

  native-cli-qualification:
    name: Qualify native C++ CUDA CLI package (sm_120)
    # Both required checks may begin after liveness. The full queued-range tier
    # selector and every build/link/package check are shared with the producer.
    needs: merge_queue_liveness
    if: >-
      needs.merge_queue_liveness.outputs.active != 'false' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
      actions: read
    env:
      CUDACXX: /usr/local/cuda-12.9/bin/nvcc
      LD_LIBRARY_PATH: /usr/local/cuda-12.9/lib64
      CCACHE_MAXSIZE: 5G
      PUBLISH_CUDA_CACHE_SNAPSHOT: 'false'
    steps: *native_cli_package_steps

  native-cli-release:
    name: Publish versioned native CLI to GitHub Releases
    needs: native-cli-artifact
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.native-cli-artifact.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require version tag on master history
        shell: bash
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::Release tag must point to a commit on master"
            exit 1
          }
      - name: Download verified distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: generativeqc-native-cli-cuda12.9-sm120-${{ github.sha }}
          path: dist
      - name: Publish only if this tagged version has no Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it and its assets unchanged."
            exit 0
          fi
          # A tag may have moved during the build. --verify-tag checks only
          # existence; require its current peeled commit to match these assets.
          git fetch --no-tags origin "$GITHUB_REF"
          current_tag_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          built_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [[ "$current_tag_commit" != "$built_commit" ]]; then
            echo "::error::Release tag moved after this artifact was built"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS

  pass:
    name: Pass CI checks
    timeout-minutes: 5
    needs: [merge_queue_liveness, cpu, cuda-compile, cuda-resources, cuda-direct-aot, python, native-cli-artifact, native-cli-qualification]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() && github.event_name != 'push' }}
    steps:
      - name: Accept an orphaned merge-group run
        if: needs.merge_queue_liveness.outputs.active == 'false'
        run: echo "The merge-group ref is gone; expensive CI jobs were intentionally skipped."
      - name: Decide whether the needed jobs succeeded or failed
        if: needs.merge_queue_liveness.outputs.active != 'false'
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          # Only the unused event branch may skip. Scheduled correctness runs
          # intentionally skip both; a selected PR/queue/manual build must pass.
          allowed-skips: ${{ github.event_name == 'schedule' && 'native-cli-artifact,native-cli-qualification' || (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'native-cli-artifact' || 'native-cli-qualification' }}
          jobs: ${{ toJSON(needs) }}
