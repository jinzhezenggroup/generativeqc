name: One-shot shell capacity expectation repair
on:
  push:
    branches: [agent/review-fixed-owner-repairs]
    paths: [.github/workflows/review-shell-capacity-once.yml]
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'jinzhezenggroup/generativeqc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check pytest numpy scipy pyyaml
      - name: Verify source identity, fix one expectation and test
        run: |
          python3 - <<'PY'
          import ast, hashlib, json, os, subprocess, tempfile
          from pathlib import Path
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'shell-capacity'
          out.mkdir()
          branch = 'perf/1477-stationary-fullrange-shell-join'
          expected = 'e92e9c9cb00860c2d2d918e085aa52e74ad355a6'
          old = 'ed28ffc46b3a388adcaf468a1721c01a70c493144890235400ab829d5dabfdee'
          new = '66548c399d2439070a7f579bc1070bb0298f4971db596ed487ede5822c2bde77'
          report = {'pr':1573, 'expected_head':expected}
          def run(*args, cwd=root, check=True, env=None):
              result = subprocess.run(args,cwd=cwd,capture_output=True,text=True,env=env)
              if check and result.returncode:
                  raise RuntimeError((result.stderr+result.stdout)[-5000:])
              return result
          try:
              ref = run('git','ls-remote','origin','refs/heads/'+branch).stdout.split()
              if not ref or ref[0]!=expected:
                  raise RuntimeError('head moved; no changes made')
              with tempfile.TemporaryDirectory() as temporary:
                  work = Path(temporary)/'checkout'
                  run('git','worktree','add','--detach',str(work),expected)
                  try:
                      qualifier = (work/'tools/dft_mp_v1/qualify_capacity.py').read_text()
                      assignment = [n for n in ast.parse(qualifier).body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='STATIONARY_ENDPOINT_OWNER_CONTRACT_SHA256' for t in n.targets)]
                      if len(assignment)!=1 or ast.literal_eval(assignment[0].value)!=new:
                          raise RuntimeError('audited qualifier contract changed')
                      source = (work/'python/generativeqc/_stationary_cuda.py').read_text()
                      matches = [n.name for n in ast.walk(ast.parse(source)) if isinstance(n,(ast.FunctionDef,ast.ClassDef)) and hashlib.sha256(ast.get_source_segment(source,n).encode()).hexdigest()==new]
                      if len(matches)!=1:
                          raise RuntimeError('actual endpoint source does not match audited contract')
                      report['source_owner'] = matches[0]
                      path = 'tests/python/test_dft_mp_v1_capacity.py'
                      file = work/path
                      content=file.read_text()
                      if content.count(old)!=1:
                          raise RuntimeError('test expectation changed')
                      file.write_text(content.replace(old,new,1))
                      env=dict(os.environ)
                      env['PYTHONPATH']=str(work/'python')+os.pathsep+str(work)
                      tests=[path]+[str(p.relative_to(work)) for pattern in ('test_stationary_shell*.py','test_stationary_source_seed*.py') for p in sorted((work/'tests/python').glob(pattern))]
                      result=run('python3','-m','pytest','-q','-o','addopts=','--import-mode=importlib',*tests,cwd=work,env=env,check=False)
                      (out/'tests.log').write_text(result.stdout+result.stderr)
                      report['tests']=tests
                      report['test_returncode']=result.returncode
                      report['test_summary']='\n'.join((result.stdout+result.stderr).splitlines()[-12:])
                      if result.returncode:
                          raise RuntimeError('capacity regression failed; no push')
                      run('git','diff','--check',cwd=work)
                      run('git','add','--',path,cwd=work)
                      run('git','-c','user.name=ChatGPT','-c','user.email=chatgpt@users.noreply.github.com','commit','-m','test(dft): align shell-join endpoint fingerprint expectation\n\nMatch the already-audited actual endpoint source. Keep all capacity, work\nand mutation guards unchanged; focused capacity regressions pass.\n\nAgent: ChatGPT\nModel: GPT-6 Astra Pro',cwd=work)
                      report['commit']=run('git','rev-parse','HEAD',cwd=work).stdout.strip()
                      report['tree']=run('git','rev-parse','HEAD^{tree}',cwd=work).stdout.strip()
                      (out/'repair.patch').write_text(run('git','diff',expected,report['commit'],cwd=work).stdout)
                      run('git','push','origin','HEAD:refs/heads/'+branch,cwd=work)
                      report['pushed']=True
                  finally:
                      run('git','worktree','remove','--force',str(work),check=False)
          except Exception as error:
              report['error']=str(error)
          (out/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report),flush=True)
          if 'error' in report: raise SystemExit(1)
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shell-capacity-repair
          path: ${{ runner.temp }}/shell-capacity/
          retention-days: 1
