name: Stage concurrent-head review repairs
on:
  push:
    branches: [agent/even-pr-repair-20260930]
    paths: [.github/workflows/even-pr-reviewed-objects-v2.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_AUTHOR_NAME: ChatGPT
      GIT_AUTHOR_EMAIL: noreply@openai.com
      GIT_COMMITTER_NAME: ChatGPT
      GIT_COMMITTER_EMAIL: noreply@openai.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Apply exact reviewed merges to scratch refs
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          master='634f9c60d72ce99d8ea0b9525aa474bdeb84906e'
          repair='6f37c4785fd73e53f8ccaba6ac549f903ee5bed6'
          records=[
            (1582,'00d398cd161c7b44ab8092b9b84ade0f97fbde3d','d4d85d4744838c357fccfbf7587d281718486ee9','4408ba522e0baf39a312c59388dcc7003db9878f'),
            (1586,'29fbc79e9e0c5336fafd81e80ac880ad2e3f0e96','b55e4beee402cb319ab06a0f39dad56cd2dd52a2','850e588dfe2362c9b1a11b172851efa9425f3cca'),
            (1590,'b0604d437a1871c25694d4eb816e1a7881e285c4','150f8a95365722cc62d65ba71c74209a2e508ed3','590ea1404e140859ed38efc46e9f3f6336095126'),
            (1592,'4402714536c85ba7a04ab51c53b78ba3c0d09482','2a077f76d043962c5780492fc163855f72f2c34a','2a077f76d043962c5780492fc163855f72f2c34a'),
          ]
          def git(*args,input=None,check=True):
              return subprocess.run(['git',*args],input=input,text=True,capture_output=True,check=check)
          git('fetch','--no-tags','--depth=128','origin',master,repair,*[r[1] for r in records])
          git('config','merge.conflictStyle','merge');git('config','core.autocrlf','false')
          results=[]
          for pr,head,pre_tree,expected in records:
              try:
                  git('reset','--hard');git('checkout','--detach',head)
                  git('update-ref','refs/remotes/fresh/master',master)
                  merged=git('merge','--no-commit','--no-ff','fresh/master',check=False)
                  if merged.returncode not in (0,1):raise RuntimeError(merged.stderr)
                  git('add','-A')
                  if git('write-tree').stdout.strip()!=pre_tree:raise RuntimeError('unreviewed pre-merge tree')
                  if pr==1582:
                      # The only conflict is the documentation paragraph advanced
                      # by this response-core slice over its now-merged parent.
                      git('checkout',head,'--','docs/developer/hessian.md')
                  elif pr==1586:
                      # Exact reviewed/tested source-identity repair blobs. The
                      # current head's other changes and master stay untouched.
                      git('checkout',repair,'--','src/cc/rccsdt_force.cpp','tests/python/test_cc_force_source_identity.py')
                  elif pr==1590:
                      path=Path('tests/native/test_mp2_gradient.cpp')
                      text=path.read_text()
                      if text.count('<<<<<<< HEAD\n')!=1 or text.count('>>>>>>> fresh/master\n')!=1:
                          raise RuntimeError('unexpected MP2 conflict shape')
                      prefix,rest=text.split('<<<<<<< HEAD\n',1)
                      ours,rest=rest.split('=======\n',1)
                      theirs,suffix=rest.split('>>>>>>> fresh/master\n',1)
                      # Keep both factorized-weight and canonical GEMM workspace
                      # assertions. The concurrent NaN/tolerance tests stay intact.
                      path.write_text(prefix+ours+theirs+suffix)
                  git('add','-A')
                  tree=git('write-tree').stdout.strip()
                  if tree!=expected:raise RuntimeError('unreviewed final tree: '+tree)
                  git('diff','--cached','--check')
                  message=(f'fix(review): reconcile PR #{pr} with current master and reviewed repairs\n\n'
                           'Preserve concurrent author changes. Exact pre-merge and final trees\n'
                           'match local review/test evidence. Original PR refs are updated\n'
                           'separately without force; required checks remain authoritative.\n\n'
                           'Agent: ChatGPT\nModel: GPT-6 Astra Pro\n')
                  commit=git('commit-tree',tree,'-p',head,'-p',master,input=message).stdout.strip()
                  ref=f'agent/even-pr-v2-{pr}-{head[:8]}'
                  git('push','origin',f'{commit}:refs/heads/{ref}')
                  result={'pr':pr,'head':head,'tree':tree,'commit':commit,'scratch_ref':ref}
              except Exception as error:result={'pr':pr,'error':str(error)}
              results.append(result);print('REVIEW_RESULT '+json.dumps(result),flush=True)
          Path('/tmp/review-round2.json').write_text(json.dumps(results,indent=2))
          if any('error' in r for r in results):raise SystemExit('failed closed; original PR refs unchanged')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-even-pr-round2
          path: /tmp/review-round2.json
          retention-days: 1
