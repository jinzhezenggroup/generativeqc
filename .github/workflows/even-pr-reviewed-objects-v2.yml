name: Stage concurrent-head review repairs
on:
  push:
    branches: [agent/even-pr-repair-20260930]
    paths: [.github/workflows/even-pr-reviewed-objects-v2.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_AUTHOR_NAME: ChatGPT
      GIT_AUTHOR_EMAIL: noreply@openai.com
      GIT_COMMITTER_NAME: ChatGPT
      GIT_COMMITTER_EMAIL: noreply@openai.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Apply exact reviewed merges to scratch refs
        env:
          PACKED: 
        run: |
          echo 'Manifest intentionally fails closed unless the exact local digest matches.'
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess
          from pathlib import Path
          packed=base64.b64decode(os.environ['PACKED'],validate=True)
          if hashlib.sha256(packed).hexdigest()!='1a87979cde577a11ef1c14f3e399871599a2125c5f6ee02d2b92a2770f5a8a16':
              raise SystemExit('review manifest digest mismatch')
          records=json.loads(gzip.decompress(packed))['records']
          def git(*args,input=None,check=True):
              return subprocess.run(['git',*args],input=input,text=True,capture_output=True,check=check)
          git('fetch','--no-tags','--depth=128','origin',*sorted({r['head'] for r in records}|{r['master'] for r in records}))
          git('config','merge.conflictStyle','merge');git('config','core.autocrlf','false')
          results=[]
          for r in records:
              try:
                  git('reset','--hard');git('checkout','--detach',r['head'])
                  git('update-ref','refs/remotes/fresh/master',r['master'])
                  merged=git('merge','--no-commit','--no-ff','fresh/master',check=False)
                  if merged.returncode not in (0,1):raise RuntimeError(merged.stderr)
                  git('add','-A')
                  if git('write-tree').stdout.strip()!=r['pre_tree']:raise RuntimeError('unreviewed pre-merge tree')
                  if r['patch']:git('apply','--index','-',input=r['patch'])
                  tree=git('write-tree').stdout.strip()
                  if tree!=r['tree']:raise RuntimeError('unreviewed final tree')
                  git('diff','--cached','--check')
                  commit=git('commit-tree',tree,'-p',r['head'],'-p',r['master'],input=r['message']).stdout.strip()
                  ref=f'agent/even-pr-v2-{r["pr"]}-{r["head"][:8]}'
                  git('push','origin',f'{commit}:refs/heads/{ref}')
                  result={'pr':r['pr'],'head':r['head'],'tree':tree,'commit':commit,'scratch_ref':ref}
              except Exception as e:result={'pr':r['pr'],'error':str(e)}
              results.append(result);print('REVIEW_RESULT '+json.dumps(result),flush=True)
          Path('/tmp/review-round2.json').write_text(json.dumps(results,indent=2))
          if any('error' in r for r in results):raise SystemExit('failed closed; original PR refs unchanged')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-even-pr-round2
          path: /tmp/review-round2.json
          retention-days: 1
