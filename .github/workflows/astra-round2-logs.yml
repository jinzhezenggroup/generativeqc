name: Round-two failure diagnostics
on:
  push:
    branches: [agent/astra-review-round2-20261001]
    paths: [.github/workflows/astra-round2-logs.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read selected job diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'round2-logs';out.mkdir()
          base='https://api.github.com/repos/jinzhezenggroup/generativeqc/'
          summary={}
          for number,job in [(1510,109975875326),(1633,110167728482),(1634,110169636646),(1635,110169915286),(1637,110188749882),(1640,110212742455),(1641,110215733184),(1642,110215257740)]:
            p=subprocess.run(['curl','--fail','--silent','--show-error','--location','-H','Authorization: Bearer '+os.environ['GH_TOKEN'],base+f'actions/jobs/{job}/logs'],capture_output=True,text=True)
            if p.returncode:
              summary[number]={'error':p.stderr};continue
            log=re.sub(r'(?m)^\d{4}-\d\d-\d\dT\S+ ', '', p.stdout)
            (out/f'{number}.log').write_text(log)
            failed='\n'.join(l for l in log.splitlines() if l.startswith('FAILED ') or l.startswith('ERROR ') or re.search(r'^=+ .*(failed|passed)',l))
            summary[number]={'job':job,'failures':failed}
          (out/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary),flush=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-round2-failure-logs
          path: ${{ runner.temp }}/round2-logs/
          retention-days: 1
