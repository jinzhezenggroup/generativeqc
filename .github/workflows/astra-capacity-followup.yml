name: Scoped capacity follow-up
on:
  push:
    branches: [agent/astra-capacity-followup-20261001]
    paths: [.github/workflows/astra-capacity-followup.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare isolated source-only test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/review-venv"
          "$RUNNER_TEMP/review-venv/bin/pip" install numpy pytest ruff==0.16.9
      - name: Validate fixed-head repair and retain review source
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          parent=1f97733a572d766c8868d41eb486c32ebdc02bfb
          vv10=fabcaade21c22028963cbcb45c3022f0252215d4
          result_branch=agent/astra-capacity-result-20261001
          git fetch --no-tags origin "$parent" "$vv10"
          mkdir -p "$GITHUB_WORKSPACE/review-output"
          git archive --format=tar.gz "$vv10" -o "$GITHUB_WORKSPACE/review-output/pr1645.tar.gz"
          git worktree add --detach "$RUNNER_TEMP/capacity-repair" "$parent"
          cp tests/python/test_dft_mp_v1_hybrid_route.py "$RUNNER_TEMP/capacity-repair/tests/python/"
          cd "$RUNNER_TEMP/capacity-repair"
          python3 - <<'PY'
          from pathlib import Path
          old = 'dee0b5dfd30d6ddefcf12e7f62e0b6d570e111fb084e385f2ec00cfa200ca8fd'
          new = '9ca4e0287b1b943cc8fa110585415f31307a7179a956391124a5ba58e8826386'
          for name in ('tools/dft_mp_v1/qualify_capacity.py', 'tests/python/test_dft_mp_v1_capacity.py'):
              path = Path(name)
              source = path.read_text()
              assert source.count(old) == 1, name
              source = source.replace(old, new)
              if name.startswith('tools/'):
                  old_text = 'PUBLIC_CUDA_HYBRID_FORCE_CONTRACT_SHA256 = ('
                  new_text = ('# The public hybrid route admits FP64 and component-wise AUTO requests.\n'
                              '# This frozen report still covers only FP64 rows; this source binding is not\n'
                              '# numerical qualification of AUTO or its strict-refined force handoff.\n' + old_text)
              else:
                  old_text = '    assert len(rows) == 35\n'
                  new_text = old_text + '    assert {row["level"] for row in rows} == {"fp64_energy_forces"}\n'
              assert source.count(old_text) == 1, name
              path.write_text(source.replace(old_text, new_text))
          PY
          ruff="$RUNNER_TEMP/review-venv/bin/ruff"
          "$ruff" check --fix tests/python/test_dft_mp_v1_hybrid_route.py
          "$ruff" format tests/python/test_dft_mp_v1_hybrid_route.py
          "$ruff" check tools/dft_mp_v1/qualify_capacity.py tests/python/test_dft_mp_v1_capacity.py tests/python/test_dft_mp_v1_hybrid_route.py
          "$ruff" format --check tools/dft_mp_v1/qualify_capacity.py tests/python/test_dft_mp_v1_capacity.py tests/python/test_dft_mp_v1_hybrid_route.py
          git diff --check
          PYTHONPATH=python:. "$RUNNER_TEMP/review-venv/bin/python" -m pytest \
            tests/python/test_dft_mp_v1_capacity.py \
            tests/python/test_dft_mp_v1_hybrid_route.py \
            tests/python/test_ks_component_precision_census.py \
            tests/python/test_global_hybrid_cuda_force_lowering.py \
            -q --tb=short | tee "$GITHUB_WORKSPACE/review-output/tests.log"
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add tools/dft_mp_v1/qualify_capacity.py tests/python/test_dft_mp_v1_capacity.py tests/python/test_dft_mp_v1_hybrid_route.py
          git commit -m 'fix(dft): bind frozen capacity audit to component precision admission' \
            -m 'Preserve fail-closed source auditing and FP64-only static qualification. Add 41 real predicate, MethodIR, promotion and mutation regressions. No scientific arithmetic, precision schedule, GPU acceptance gate or workflow is changed.' \
            -m 'Agent: ChatGPT
          Model: GPT-6 Astra Pro'
          test "$(git rev-parse HEAD^)" = "$parent"
          test -z "$(git ls-remote --heads origin "refs/heads/$result_branch")"
          git push origin "HEAD:refs/heads/$result_branch"
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'review-output'
          names = ('tools/dft_mp_v1/qualify_capacity.py', 'tests/python/test_dft_mp_v1_capacity.py', 'tests/python/test_dft_mp_v1_hybrid_route.py')
          report = {key: subprocess.check_output(['git', 'rev-parse', ref], text=True).strip() for key, ref in [('commit', 'HEAD'), ('tree', 'HEAD^{tree}'), ('parent', 'HEAD^')]}
          report['sha256'] = {}
          for name in names:
              path = root / 'repair' / name
              path.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, path)
              report['sha256'][name] = hashlib.sha256(path.read_bytes()).hexdigest()
          report['vv10_head'] = 'fabcaade21c22028963cbcb45c3022f0252215d4'
          (root / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-capacity-followup
          path: review-output/
          retention-days: 1
