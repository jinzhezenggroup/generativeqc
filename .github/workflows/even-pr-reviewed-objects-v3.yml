name: Stage reviewed even PR repairs v3
on:
  push:
    branches: [agent/even-pr-repair-20260930]
    paths: [.github/workflows/even-pr-reviewed-objects-v3.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_AUTHOR_NAME: ChatGPT
      GIT_AUTHOR_EMAIL: noreply@openai.com
      GIT_COMMITTER_NAME: ChatGPT
      GIT_COMMITTER_EMAIL: noreply@openai.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Reproduce checked merge trees on scratch refs only
        run: |
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          master='10913929dc78e73ec203d553b6f2040f9ff41c21'
          records=[
            {'pr':1584,'head':'be4e148e9910b5a39d9165eb027e00bde1a0b1f9','pre':'3292005f67048cdb8bba680932bf67ab1e99884c','tree':'38a300354e2e52582e80ed4afea40d08cd7e6ae6'},
            {'pr':1586,'head':'079ee575f54e519bb63ceeb0a23500510f1f14a5','pre':'2adf56dfe0d5d16d81bddc43039a22f9efb4da10','tree':'bd92a81b315b60ad0870a1bb7b2efe6cbcad582f'},
          ]
          def git(*args,input=None,check=True):
              return subprocess.run(['git',*args],input=input,text=True,capture_output=True,check=check)
          def resolve(path,operation):
              p=Path(path)
              pattern=re.compile(r'^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> origin/master\n',re.M|re.S)
              text,count=pattern.subn(lambda m:operation(m[1],m[2]),p.read_text())
              if count!=1: raise RuntimeError('unexpected conflict count: '+path)
              p.write_text(text)
          git('fetch','--no-tags','--depth=256','origin',master,*[r['head'] for r in records])
          git('config','merge.conflictStyle','merge')
          git('config','core.autocrlf','false')
          git('update-ref','refs/remotes/origin/master',master)
          results=[]
          for row in records:
              try:
                  git('reset','--hard')
                  git('checkout','--detach',row['head'])
                  merged=git('merge','--no-commit','--no-ff','origin/master',check=False)
                  if merged.returncode not in (0,1): raise RuntimeError(merged.stderr)
                  git('add','-A')
                  if git('write-tree').stdout.strip()!=row['pre']: raise RuntimeError('pre-merge tree mismatch')
                  if row['pr']==1584:
                      for path in ['src/methods/dft_method.hpp','tests/python/test_direct_shell_derivative_owner.py']:
                          resolve(path,lambda a,b:a+'\n\n'+b)
                      p=Path('src/methods/dft_method.hpp')
                      p.write_text(p.read_text().replace('std::vector<double>& output, std::string& detail);\n\n\n/** Borrow','std::vector<double>& output, std::string& detail);\n\n/** Borrow'))
                      p=Path('tests/python/test_direct_shell_derivative_owner.py')
                      p.write_text(p.read_text().replace('assert "task_sources =" in stationary\n\n\n\n','assert "task_sources =" in stationary\n\n\n'))
                  else:
                      resolve('src/cc/rccsdt_force.cpp',lambda a,b:'  auto raw = raw_hamiltonian(source, reference, max_bytes);\n')
                  git('add','-A')
                  tree=git('write-tree').stdout.strip()
                  if tree!=row['tree']: raise RuntimeError('final tree mismatch: '+tree)
                  git('diff','--cached','--check')
                  ref=f"agent/even-pr-v3-{row['pr']}-{row['head'][:8]}"
                  existing=git('ls-remote','origin',f'refs/heads/{ref}').stdout.strip()
                  if existing:
                      commit=existing.split()[0]
                      git('fetch','--no-tags','origin',commit)
                      if git('rev-parse',commit+'^{tree}').stdout.strip()!=tree: raise RuntimeError('scratch ref tree mismatch')
                      if git('show','-s','--format=%P',commit).stdout.strip()!=row['head']+' '+master: raise RuntimeError('scratch ref parent mismatch')
                  else:
                      message=(f"fix(review): reconcile PR #{row['pr']} with reviewed master changes\n\n"
                               'Exact local before/after trees reproduced. Preserve both production\n'
                               'interfaces, lifetime fixes, and independent test coverage.\n'
                               'Original PR refs and protected checks are handled separately.\n\n'
                               'Agent: ChatGPT\nModel: GPT-6 Astra Pro\n')
                      commit=git('commit-tree',tree,'-p',row['head'],'-p',master,input=message).stdout.strip()
                      git('push','origin',f'{commit}:refs/heads/{ref}')
                  result={'pr':row['pr'],'head':row['head'],'tree':tree,'commit':commit,'scratch_ref':ref}
              except Exception as e: result={'pr':row['pr'],'error':str(e)}
              results.append(result)
              print('REVIEW_RESULT '+json.dumps(result),flush=True)
          Path('/tmp/review-round3.json').write_text(json.dumps(results,indent=2))
          if any('error' in r for r in results): raise SystemExit('failed closed; original PR refs unchanged')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-even-pr-round3
          path: /tmp/review-round3.json
          retention-days: 1
