name: PR overlap

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report changed-file overlap with other open PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          current_files="$(mktemp)"
          if ! gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' | sort -u > "$current_files"; then
            rm -f "$current_files"
            echo "::warning title=PR overlap unavailable::Unable to list current PR files; overlap status is unknown."
            echo "## PR overlap report" >> "$GITHUB_STEP_SUMMARY"
            echo "Current-PR file enumeration failed. Overlap status is unknown; no clean result is claimed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          open_numbers="$(mktemp)"
          if ! gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[].number' > "$open_numbers"; then
            rm -f "$open_numbers" "$current_files"
            echo "::warning title=PR overlap unavailable::Unable to enumerate open PRs; overlap status is unknown."
            echo "## PR overlap report" >> "$GITHUB_STEP_SUMMARY"
            echo "Open-PR enumeration failed. Overlap status is unknown; no clean result is claimed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mapfile -t open_prs < <(grep -vx -- "$PR_NUMBER" "$open_numbers" || true)
          rm -f "$open_numbers"

          hotspot_re='^(docs/cuda_ownership\.json|cmake/GenerativeQCGeneratedSources\.cmake|include/generativeqc/generativeqc\.h|python/generativeqc/_native\.py|python/generativeqc/calculator\.py|python/generativeqc_compiler/tensor/types\.py|python/generativeqc_compiler/method/stationary_cuda\.py|src/methods/registry\.cpp|src/methods/dft_method\.cpp|src/dft/cuda_ks\.cpp|pyproject\.toml)$'

          {
            echo "## PR overlap report"
            echo
            echo "This check compares the PR's changed files with every other open PR."
            echo "It is advisory: overlap is a coordination signal, not proof of a merge conflict."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          overlap_prs=0
          hotspot_prs=0

          for other in "${open_prs[@]}"; do
            other_files="$(mktemp)"
            if ! gh api --paginate "repos/$REPO/pulls/$other/files?per_page=100" \
              --jq '.[].filename' | sort -u > "$other_files"; then
              rm -f "$other_files" "$current_files"
              echo "::warning title=PR overlap incomplete::Unable to list files for PR #$other; overlap status is incomplete."
              echo "**Incomplete:** file enumeration failed for PR #$other. Any overlaps above are partial; no clean result is claimed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            shared="$(comm -12 "$current_files" "$other_files" || true)"
            rm -f "$other_files"
            [[ -n "$shared" ]] || continue

            overlap_prs=$((overlap_prs + 1))
            shared_count="$(printf '%s\n' "$shared" | sed '/^$/d' | wc -l | tr -d ' ')"
            hot="$(printf '%s\n' "$shared" | grep -E "$hotspot_re" || true)"

            echo "### #$other — $shared_count shared file(s)" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              if [[ "$path" =~ $hotspot_re ]]; then
                printf -- '- **HOTSPOT** `%s`\n' "$path" >> "$GITHUB_STEP_SUMMARY"
              else
                printf -- '- `%s`\n' "$path" >> "$GITHUB_STEP_SUMMARY"
              fi
            done <<< "$shared"
            echo >> "$GITHUB_STEP_SUMMARY"

            if [[ -n "$hot" ]]; then
              hotspot_prs=$((hotspot_prs + 1))
              hot_csv="$(printf '%s\n' "$hot" | paste -sd ', ' -)"
              echo "::warning title=High-conflict overlap with PR #$other::Shared hotspot file(s): $hot_csv"
            else
              echo "::notice title=PR overlap with #$other::$shared_count shared changed file(s)"
            fi
          done

          if [[ "$overlap_prs" -eq 0 ]]; then
            echo "No changed-file overlap with other open PRs." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "---"
              echo "**Summary:** overlaps with $overlap_prs open PR(s); $hotspot_prs include known shared ownership/registry hotspots."
              echo
              echo "For hotspot overlap, prefer stacking on the owning PR or moving mutable registration/ownership data into per-domain shards instead of independently editing the aggregate file."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Temporary diagnostic on a separate fast workflow, to be removed after
      # committing the matched snapshot. No acceptance gate is weakened.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preview exact-source Libxc catalog identities (temporary)
        shell: bash
        run: |
          PYTHONPATH=python:. python3 - <<'PY'
          import base64
          import json
          import lzma
          from pathlib import Path

          from generativeqc_compiler.common.provenance import canonical_hash, file_hash
          from tools.generate_build_identity import _inventory, _source_identity

          root = Path.cwd()
          dirs = ("src", "include", "cmake", "python/generativeqc", "python/generativeqc_compiler")
          suffixes = {".py", ".json", ".cpp", ".hpp", ".h", ".cu", ".cuh", ".c", ".cmake", ".in"}
          files = {root / "CMakeLists.txt"}
          for directory in dirs:
              files.update(
                  p for p in (root / directory).rglob("*")
                  if p.is_file() and p.suffix in suffixes
              )
          live = {p.relative_to(root).as_posix(): file_hash(p) for p in sorted(files)}
          source = canonical_hash(live)
          native = _source_identity(
              root, _inventory(root, root / "cmake/GenerativeQCSourceIdentity.json")
          )
          snapshot_path = root / "manifests/libxc/native-qualification-snapshot.json.xz"
          original = json.loads(lzma.decompress(snapshot_path.read_bytes()))
          if not original["stale"] or original["endpoints"] or original["observed_endpoints"]:
              raise RuntimeError("Unexpected catalog admission: do not rewrite qualification")
          original["source_identity"] = source
          original["native_source_identity"] = native
          data = (json.dumps(original, sort_keys=True, separators=(",", ":"), allow_nan=False) + "\n").encode()
          snapshot = lzma.compress(data)
          report = (root / "docs/reference/libxc_qualification.md").read_text()
          import re
          report, first = re.subn(
              r"Current checked source inputs: \x60[0-9a-f]{64}\x60\.",
              "Current checked source inputs: \x60" + source + "\x60.",
              report,
          )
          report, second = re.subn(
              r"Current checked native input identity: \x60[0-9a-f]{64}\x60\.",
              "Current checked native input identity: \x60" + native + "\x60.",
              report,
          )
          if (first, second) != (1, 1):
              raise RuntimeError("Cannot match exactly two current-source catalog fields")
          print("GQC_SNAPSHOT_B64_START")
          print(base64.b64encode(snapshot).decode())
          print("GQC_SNAPSHOT_B64_END")
          print("GQC_REPORT_B64_START")
          print(base64.b64encode(report.encode()).decode())
          print("GQC_REPORT_B64_END")
          print("GQC_SOURCE_ID", source)
          print("GQC_NATIVE_ID", native)
          print("GQC_SNAPSHOT_SIZE", len(snapshot))
          PY
