name: Scoped open PR review snapshot
on:
  push:
    branches: [agent/astra-open-pr-round-20261002]
    paths: [.github/workflows/astra-open-pr-round.yml]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export identified source trees and review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, json, os, subprocess, urllib.request
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'open-pr-review'
          out.mkdir()
          api = 'https://api.github.com/repos/jinzhezenggroup/generativeqc/'
          def get(path):
              request = urllib.request.Request(api + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          def pages(path):
              rows=[]
              for page in range(1, 20):
                  values=get(path+('&' if '?' in path else '?')+f'per_page=100&page={page}')
                  if not isinstance(values,list):
                      raise RuntimeError('expected a paginated collection')
                  rows.extend(values)
                  if len(values)<100: return rows
              raise RuntimeError('pagination exceeded bounded review export')
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          master=get('git/ref/heads/master')['object']['sha']
          git('fetch','--no-tags','origin',master)
          manifest={'as_of':datetime.datetime.now(datetime.timezone.utc).isoformat(),'master':master,'snapshots':{},'prs':[]}
          previous=None
          def snapshot(sha):
              global previous
              if sha in manifest['snapshots']: return
              try: tree=git('rev-parse',sha+'^{tree}')
              except subprocess.CalledProcessError:
                  git('fetch','--no-tags','origin',sha)
                  tree=git('rev-parse',sha+'^{tree}')
              args=['-c','user.name=ChatGPT','-c','user.email=chatgpt@users.noreply.github.com','commit-tree',tree,'-m','Local review snapshot of '+sha+'\n\nAgent: ChatGPT\nModel: GPT-6 Astra Pro']
              if previous: args+=['-p',previous]
              local=git(*args); previous=local
              manifest['snapshots'][sha]={'original':sha,'tree':tree,'snapshot':local}
          snapshot(master)
          opened=pages('pulls?state=open&sort=created&direction=asc')
          numbers=sorted({pr['number'] for pr in opened}|{1649,1650})
          for number in numbers:
              pr=get(f'pulls/{number}'); folder=out/str(number); folder.mkdir()
              (folder/'pr.json').write_text(json.dumps(pr,indent=2))
              head=pr['head']['sha']; snapshot(head)
              target=pr['base']['sha']; snapshot(target)
              base=git('merge-base',master,head); snapshot(base)
              actual_base=git('merge-base',target,head); snapshot(actual_base)
              record={'number':number,'title':pr['title'],'state':pr['state'],'draft':pr['draft'],'merged':pr['merged'],'head':head,'branch':pr['head']['ref'],'base_ref':pr['base']['ref'],'base_sha':target,'merge_base':base,'actual_merge_base':actual_base,'mergeable':pr['mergeable'],'mergeable_state':pr['mergeable_state']}
              manifest['prs'].append(record)
              endpoints=[('reviews',f'pulls/{number}/reviews',True),('inline',f'pulls/{number}/comments',True),('comments',f'issues/{number}/comments',True),('runs',f'actions/runs?head_sha={head}&per_page=100',False),('checks',f'commits/{head}/check-runs?per_page=100',False)]
              def export(item):
                  name,path,paginated=item
                  try: payload=pages(path) if paginated else get(path)
                  except Exception as error: payload={'error':str(error)}
                  (folder/(name+'.json')).write_text(json.dumps(payload,indent=2))
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
                  list(pool.map(export,endpoints))
              (folder/'pr.diff').write_text(git('diff','--binary',actual_base,head)+'\n')
              (folder/'master-relative.diff').write_text(git('diff','--binary',base,head)+'\n')
              (folder/'upstream.diff').write_text(git('diff','--binary',base,master)+'\n')
              print(json.dumps(record),flush=True)
          git('update-ref','refs/heads/review-snapshots',previous)
          git('bundle','create',str(out/'sources.bundle'),'refs/heads/review-snapshots')
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: astra-open-pr-review
          path: ${{ runner.temp }}/open-pr-review/
          retention-days: 1
