name: Remaining PR diagnostic
on:
  push:
    branches: [ci/remaining-pr-repair-20260930-astra]
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle exact repair inputs without runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/repair-inputs
          git bundle create /tmp/repair-inputs/repair.bundle \
            origin/master origin/agent/1575-control-vjp \
            origin/perf/1479-fuse-geometry-reduction \
            origin/perf/1477-stationary-fullrange-shell-join \
            origin/perf/1611-stationary-implicit-grid-owners \
            origin/perf/1612-wb97mv-resident-grid-points \
            origin/perf/1613-stationary-resident-grid-weights \
            origin/agent/review-wb-residency-master
          cp -r repair-reports /tmp/repair-inputs/
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin > /tmp/repair-inputs/refs.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remaining-pr-repair-inputs
          path: /tmp/repair-inputs/
          retention-days: 1
