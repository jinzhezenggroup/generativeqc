name: Advisory work audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    name: Source work inventory (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inventory source work without a findings gate
        run: |
          mkdir -p .artifacts
          python3 tools/audit_native_work.py --format json > .artifacts/work-audit.json
          python3 tools/audit_native_work.py --summary-only
      - name: Compare source-bound DF producer work against PR base (advisory)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Keep checkout shallow; fetch only the immutable base object.
          git fetch --no-tags --depth=1 origin "${BASE_SHA}" || \
            echo "::warning::Unable to fetch base commit; producer-work report will be INCOMPLETE"
          python3 tools/ratchet_producer_schedule.py \
            --base-sha "${BASE_SHA}" \
            --output .artifacts/producer-work-ratchet.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-work-audit
          path: |
            .artifacts/work-audit.json
            .artifacts/producer-work-ratchet.json
          retention-days: 14
