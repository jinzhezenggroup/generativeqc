name: Advisory work audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    name: Source work inventory (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inventory source work without a findings gate
        run: |
          mkdir -p .artifacts
          python3 tools/audit_native_work.py --format json > .artifacts/work-audit.json
          python3 tools/audit_native_work.py --summary-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-work-audit
          path: .artifacts/work-audit.json
          retention-days: 14
