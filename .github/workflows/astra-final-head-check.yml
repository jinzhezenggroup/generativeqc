name: Scoped final-head review verification
on:
  push:
    branches: [agent/astra-review-all-20261001-1535]
    paths: [.github/workflows/astra-final-head-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python3 -m pip install pytest numpy scipy pyyaml ruff==0.16.9
      - name: Preserve concurrent fixes and verify their exact trees
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python3 - <<'PY'
          import json,os,subprocess,tempfile
          from pathlib import Path
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'final-head-check';out.mkdir()
          targets={
              1652:('909311ac467b833ccb13f0764f8c0536e2c3dd18',['test_dft_mp_v1_capacity.py','test_stationary_aot_no_compiler.py','test_stationary_composite_cuda_routing.py','test_wb97mv_work_route_evidence.py']),
              1653:('c3fb01c29f05884848c1701ab94acdcf4695dc83',['test_direct_hf_retirement.py','test_cuda_ownership.py','test_cuda_ownership_pairing.py','test_cuda_ownership_publication.py']),
              1657:('579fbdaf4d925d606e7f419e9586f166d9227afb',['test_gfn2_population_cuda_arithmetic.py','test_gfn2_cuda_provenance.py','test_gfn2_electronic_native_codegen.py','test_gfn2_electronic_population.py','test_gfn2_fused_electronic_codegen.py']),
              1661:('8b7c5dfdab55386f6bf046d62c8646ca92716611',['test_ks_warm_orbital_failure.py']),
          }
          reports=[]
          def run(*args,cwd=root,env=None,check=True):
              p=subprocess.run(args,cwd=cwd,env=env,capture_output=True,text=True)
              if check and p.returncode:raise RuntimeError((p.stdout+p.stderr)[-8000:])
              return p
          for number,(head,tests) in targets.items():
              report={'pr':number,'head':head};directory=out/str(number);directory.mkdir()
              try:
                  run('git','fetch','--no-tags','origin',head)
                  with tempfile.TemporaryDirectory(prefix='final-head-') as temporary:
                      work=Path(temporary)/'checkout';run('git','worktree','add','--detach',str(work),head)
                      try:
                          files=[]
                          if number==1652:
                              validated='7ff45c55e0b0967f1870621db5914ca60d2ae899'
                              files=['tests/python/test_stationary_aot_no_compiler.py','tests/python/test_wb97mv_work_route_evidence.py']
                              run('git','fetch','--no-tags','origin',validated)
                              run('git','checkout',validated,'--',*files,cwd=work)
                              run('python3','-m','ruff','check',*files,cwd=work)
                              run('python3','-m','ruff','format','--check',*files,cwd=work)
                          env=dict(os.environ);env['PYTHONPATH']=os.pathsep.join([str(work/'python'),str(work),str(work/'tests/python')])
                          result=run('python3','-m','pytest','-q','-o','addopts=','--import-mode=importlib',*['tests/python/'+t for t in tests],cwd=work,env=env,check=False)
                          (directory/'tests.log').write_text(result.stdout+result.stderr)
                          report['returncode']=result.returncode;report['summary']='\n'.join((result.stdout+result.stderr).splitlines()[-12:])
                          if result.returncode:raise RuntimeError('focused verification failed')
                          if files:
                              changed=set(run('git','diff','--cached','--name-only',cwd=work).stdout.splitlines())
                              if changed!=set(files):raise RuntimeError('unexpected changed file set')
                              run('git','diff','--cached','--check',cwd=work)
                              run('git','-c','user.name=ChatGPT','-c','user.email=chatgpt@users.noreply.github.com','commit','-m','test(dft): finish composite AOT and radial route fixtures\n\nPreserve the concurrent stronger point-model tests and current production\nrouter. Repair only the absent-owner fixture and AST radial assertion.\nFocused regressions pass; full PR CI remains required.\n\nAgent: ChatGPT\nModel: GPT-6 Astra Pro',cwd=work)
                              report['commit']=run('git','rev-parse','HEAD',cwd=work).stdout.strip()
                              (directory/'repair.patch').write_text(run('git','diff',head,'HEAD',cwd=work).stdout)
                              branch='agent/astra-composite-final-tests-1535'
                              if run('git','ls-remote','origin','refs/heads/'+branch).stdout.strip():raise RuntimeError('result exists; no overwrite')
                              run('git','push','origin','HEAD:refs/heads/'+branch,cwd=work)
                          report['tree']=run('git','rev-parse','HEAD^{tree}',cwd=work).stdout.strip()
                      finally:run('git','worktree','remove','--force',str(work),check=False)
              except Exception as error:report['error']=str(error)
              reports.append(report);(out/'report.json').write_text(json.dumps(reports,indent=2)+'\n');print(json.dumps(report),flush=True)
          if any('error' in p for p in reports):raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-final-head-verification
          path: ${{ runner.temp }}/final-head-check/
          retention-days: 1
