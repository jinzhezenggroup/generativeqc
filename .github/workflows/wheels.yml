name: Python wheels

# Build with CUDA 12.9 while keeping NVIDIA provider DSOs outside the GenerativeQC
# wheel. The wheel metadata declares the separately distributed providers as
# Linux runtime dependencies, and the installed-wheel test proves lazy provider
# resolution through a CUDA-backed native call.
on:
  # Qualify every master push and seed the default-branch compiler cache that
  # later PRs can restore. Keep PR qualification scoped to wheel/link contracts.
  # Weekly and explicit maintainer qualification remain available.
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [master]
  pull_request:
    paths:
      - ".github/workflows/wheels.yml"
      - "cmake/GenerativeQCCudaImplib.cmake"
      - "cmake/cuda_wheel_payload.ld"
      - "cmake/3rdparty/implib/**"
      - "pyproject.toml"
      # Wheel-specific native launcher and explicit tuner packaging changes.
      # Avoid triggering the expensive CUDA wheel for every CLI/CMake edit.
      - "src/cli/wheel_launcher.cpp"
      - "python/generativeqc/tune_cli.py"
      - "python/ci/prepare-wheel-build.sh"
      - ".github/actions/restore-wheel-ccache/**"
      - "tools/ci_cpu_ccache_snapshot.py"
      - "python/ci/repair-wheel.sh"
      - "src/runtime/nvidia_host_api/**"
      - "tools/generate_cuda_implib.py"
      - "tools/link_cuda_implib.py"
      - "tools/generate_nvidia_host_api.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  # Coalesce pending PR runs by PR number, and other runs by ref.
  # Preserve every in-flight wheel qualification.
  cancel-in-progress: false

jobs:
  build_wheels:
    permissions:
      contents: read
      actions: read
    name: Build CUDA manylinux wheel
    runs-on: ubuntu-24.04
    # Multi-architecture compilation needs a larger finite budget than the
    # single-target wheel. Reserve 30 minutes for setup, cache retention and
    # payload checks within GitHub-hosted runners' six-hour job limit.
    # A full wheel run remains the acceptance gate; this budget is not a timing
    # guarantee. Keep repair, smoke and payload checks required.
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit generated CUDA ABI call coverage
        run: python3 tools/generate_nvidia_host_api.py --check-usage

      - name: Restore ccache
        id: wheel_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          # Immutable run snapshots let a later attempt retain additional entries.
          key: ccache-wheel-v3-manylinux_x86_64-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-wheel-v3-manylinux_x86_64-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'python/generativeqc_compiler/**', 'python/generativeqc/**', 'tools/**', 'pyproject.toml', 'manifests/xtbloom-d3.json', 'data/parameters/d3_production.bin', 'python/generativeqc_compiler/common/d3_data.py') }}
            ccache-wheel-v3-manylinux_x86_64-
            ccache-wheel-v2-manylinux_x86_64-

      - name: Restore trusted wheel snapshot after primary miss
        if: steps.wheel_ccache.outcome == 'success' && steps.wheel_ccache.outputs.cache-matched-key == ''
        timeout-minutes: 2
        continue-on-error: true
        uses: ./.github/actions/restore-wheel-ccache
        with:
          github-token: ${{ github.token }}

      # Independent source-only cache; exact science keys limit stale growth.
      - name: Restore stationary AOT semantic sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/stationary-aot-source-cache
          key: stationary-aot-source-v1-${{ hashFiles('python/generativeqc_compiler/common/**', 'python/generativeqc_compiler/integral/**', 'python/generativeqc_compiler/method/**', 'python/generativeqc_compiler/dft/**', 'python/generativeqc_compiler/xc/**', 'python/generativeqc_compiler/tensor/**', 'src/integrals/**', 'src/dft/stationary_gradient_cuda.cuh', 'tools/generate_stationary_force_aot.py') }}
      - name: Restore cibuildwheel tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-${{ runner.os }}-manylinux_x86_64-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            cibw-${{ runner.os }}-manylinux_x86_64-

      - name: Build and test wheel
        id: wheel_build
        timeout-minutes: 330
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2
        env:
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache
          # cibuildwheel mounts the host root at /host inside the manylinux
          # container, so the compiler cache survives the container lifetime.
          # scikit-build-core creates a fresh /tmp/tmp*/build directory on every
          # invocation. Normalize those transient absolute paths before ccache
          # hashes the CMake/NVCC command line; otherwise generated-source and
          # generated-include paths make identical compilations miss across runs.
          CIBW_ENVIRONMENT: >-
            GENERATIVEQC_ENABLE_CUDA=ON
            GENERATIVEQC_ENABLE_AOT_SHELLS=ON
            GENERATIVEQC_STATIONARY_AOT_SOURCE_CACHE=/host${{ runner.temp }}/stationary-aot-source-cache
            GENERATIVEQC_CUDA_ARCHITECTURES="80-real;86-real;89-real;90-real;100-real;120"
            CMAKE_ARGS="-DGENERATIVEQC_AOT_PROFILE=portable -DGENERATIVEQC_AOT_PROFILES=sm_120"
            CCACHE_DIR=/host${{ runner.temp }}/ccache
            CCACHE_MAXSIZE=3G
            CCACHE_BASEDIR=/tmp
            CCACHE_COMPILERCHECK=content
            GQC_WHEEL_SNAPSHOT_ID=${{ github.run_id }}-${{ github.run_attempt }}
        with:
          package-dir: .
          output-dir: wheelhouse
          extras: "uv"

      - name: Prepare stationary source cache for host archive
        if: ${{ always() }}
        shell: bash
        run: bash .github/scripts/prepare-stationary-source-cache.sh

      # ccache stores completed compiler outputs, so retain useful entries after
      # a compile failure/step timeout. Tool environments retain success-only saves.
      # Keep ordinary Actions cache saves, including useful partial compiler work.
      - name: Save completed compiler cache entries
        if: ${{ always() && steps.wheel_ccache.outputs.cache-primary-key != '' }}
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.wheel_ccache.outputs.cache-primary-key }}

      - name: Verify wheel payload and CUDA linkage
        id: wheel_payload
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import subprocess
          import tempfile
          import zipfile

          wheels = glob.glob("wheelhouse/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              # Check the repaired artifact: vendored trampoline notices must
              # reach users together with the native code generated from them.
              metadata_dirs = {
                  name.split("/", 1)[0]
                  for name in names
                  if name.endswith(".dist-info/METADATA")
              }
              assert len(metadata_dirs) == 1, metadata_dirs
              metadata_dir = metadata_dirs.pop()
              for license_file in ("LICENSE", "LICENSES/implib-MIT.txt", "THIRD_PARTY_NOTICES.md"):
                  installed_notice = f"{metadata_dir}/licenses/{license_file}"
                  assert installed_notice in names, installed_notice
                  assert archive.read(installed_notice) == pathlib.Path(license_file).read_bytes()
              assert "generativeqc/lib/libgenerativeqc.so" in names, sorted(
                  name
                  for name in names
                  if "generativeqc" in name and name.endswith((".so", ".dll", ".dylib"))
              )
              # The wheel installs a native PATH command, not a Python
              # console-script shim; the full executable stays by the DSO.
              scripts = sorted(
                  name for name in names
                  if name.endswith(".data/scripts/generativeqc")
              )
              assert len(scripts) == 1, scripts
              assert archive.read(scripts[0]).startswith(b"\x7fELF"), scripts
              assert archive.read("generativeqc/bin/generativeqc").startswith(b"\x7fELF")
              for header in ("generativeqc.h", "generated_method_ids.h"):
                  source = pathlib.Path("include/generativeqc") / header
                  installed = f"generativeqc_compiler/assets/include/generativeqc/{header}"
                  assert installed in names, installed
                  assert archive.read(installed) == source.read_bytes()
              cuda_provider_names = (
                  "libcudart.so",
                  "libcublas.so",
                  "libcublasLt.so",
                  "libcusolver.so",
                  "libcusparse.so",
                  "libnvJitLink.so",
                  "libcuda.so",
              )
              bundled_cuda = [
                  name
                  for name in names
                  if pathlib.PurePosixPath(name).name.startswith(cuda_provider_names)
              ]
              assert not bundled_cuda, bundled_cuda
              with tempfile.TemporaryDirectory() as directory:
                  native = pathlib.Path(directory) / "libgenerativeqc.so"
                  native.write_bytes(archive.read("generativeqc/lib/libgenerativeqc.so"))
                  dynamic = subprocess.check_output(
                      ["readelf", "-d", str(native)], text=True
                  )

          for soname in ("libcudart.so.12", "libcublas.so.12", "libcusolver.so.11"):
              assert f"Shared library: [{soname}]" not in dynamic, dynamic
          assert "Shared library: [libcuda.so.1]" not in dynamic, dynamic
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generativeqc-wheel-manylinux_x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

      - name: Decide whether the wheel snapshot needs refresh
        id: wheel_snapshot_refresh
        if: github.repository == 'jinzhezenggroup/generativeqc' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --kill-after=2s 35s python3 tools/ci_cpu_ccache_snapshot.py refresh --profile wheel
      - name: Package bounded wheel compiler snapshot
        id: wheel_snapshot
        if: github.repository == 'jinzhezenggroup/generativeqc' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.wheel_build.outcome == 'success' && steps.wheel_payload.outcome == 'success' && steps.wheel_snapshot_refresh.outputs.publish != 'false'
        timeout-minutes: 2
        continue-on-error: true
        run: python3 tools/ci_cpu_ccache_snapshot.py package --profile wheel
      - name: Publish bounded wheel compiler snapshot
        if: steps.wheel_snapshot.outcome == 'success'
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-ccache-master-manylinux-cuda12.9-multiarch-v2-${{ github.run_attempt }}
          path: ${{ steps.wheel_snapshot.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  pass:
    name: Pass building wheels
    timeout-minutes: 5
    needs: [build_wheels]
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Decide whether the wheel build succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
