name: Scoped reviewed repair validation
on:
  push:
    branches: [agent/astra-review-all-20261001-1535]
    paths: [.github/workflows/astra-validate-repairs.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pr: [1651, 1652, 1653, 1654, 1655, 1657, 1659, 1660]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python3 -m pip install pytest numpy scipy pyyaml matplotlib ruff==0.16.9 clang-format==23.1.1 cmake ninja
      - name: Reconcile scoped fixes, check formatting, and require regressions
        env:
          PR_NUMBER: ${{ matrix.pr }}
          GH_TOKEN: ${{ github.token }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, subprocess, tempfile, urllib.request
          from pathlib import Path
          root=Path.cwd(); number=int(os.environ['PR_NUMBER'])
          out=Path(os.environ['RUNNER_TEMP'])/'reviewed-repair';out.mkdir()
          helper=root/'.github/astra-reviewed-repairs.py'
          spec=importlib.util.spec_from_file_location('review_repairs',helper)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          minimum,branch=module.HEADS[number]
          report={'pr':number,'minimum':minimum,'branch':branch}
          allowed={
              1651:{'.pre-commit-config.yaml','tools/dft_mp_v1/qualify_capacity.py','tests/python/test_dft_mp_v1_capacity.py','tests/python/test_stationary_cuda_merge_boundary.py','tests/python/test_direct_shell_derivative_owner.py','tests/python/test_cuda_rsh_derivative_weights.py','tests/python/test_pbe0_benchmark.py'},
              1652:{'tools/dft_mp_v1/qualify_capacity.py','tests/python/test_dft_mp_v1_capacity.py','tests/python/test_stationary_aot_no_compiler.py','tests/python/test_wb97mv_work_route_evidence.py'},
              1653:{'docs/cuda_ownership/files/'+p+'.json' for p in ('src/scf/cuda/direct_bounded_dddd.cu','src/xtb/native/src/backends/cuda/gfn2_geometry.cu','src/xtb/native/src/backends/cuda/gfn2_pairlist.cu','src/xtb/native/src/backends/cuda/gfn2_repulsion.cu')}|{'docs/cuda_ownership/direct_hf_retirement.json','tests/python/test_direct_hf_retirement.py'},
              1654:{'tools/dft_mp_v1/qualify_capacity.py','tests/python/test_dft_mp_v1_capacity.py','python/generativeqc/_stationary_cuda.py','tests/python/test_libxc_snapshot_domain.py','tests/python/test_public_cpu_item_hamiltonian.py','tests/python/test_stationary_df_provider_failure.py'},
              1655:{'python/generativeqc_compiler/method/nonlocal_pair.py','src/dft/nonlocal_correlation/vv10_runtime_cuda.cu','tests/python/test_nonlocal_local_scale_codegen.py'},
              1657:{'tools/generate_gfn2_electronic_cuda.py','src/xtb/native/CUDA_SOURCE_PROVENANCE.json','tests/python/test_gfn2_population_scalar_fma.py'},
              1659:{'tools/dft_mp_v1/qualify_capacity.py','tests/python/test_dft_mp_v1_capacity.py'},
              1660:{'src/dft/rks.cpp','src/dft/uks.cpp','src/dft/cosx_scf.hpp'},
          }[number]
          def run(*args,cwd=root,check=True,env=None):
              result=subprocess.run(args,cwd=cwd,capture_output=True,text=True,env=env)
              if check and result.returncode:
                  raise RuntimeError((result.stdout+result.stderr)[-10000:])
              return result
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/jinzhezenggroup/generativeqc/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          try:
              pr=api(f'pulls/{number}')
              if pr['state']!='open':raise RuntimeError('original PR is no longer open; no writes')
              if pr['head']['ref']!=branch:raise RuntimeError('PR branch changed')
              head=pr['head']['sha'];report['starting_head']=head
              run('git','fetch','--no-tags','origin',head)
              run('git','merge-base','--is-ancestor',minimum,head)
              (out/'concurrent.patch').write_text(run('git','diff',minimum,head).stdout)
              with tempfile.TemporaryDirectory(prefix='review-fix-') as temporary:
                  work=Path(temporary)/'checkout'
                  run('git','worktree','add','--detach',str(work),head)
                  try:
                      module.apply(number,work)
                      if number==1651:
                          base='6ccecb1b41d604018d738f814a6cb44d2e191996'
                          historical=run('git','diff','--name-only','--diff-filter=M',base,minimum,'--','*.patch',cwd=work).stdout.splitlines()
                          allowed.update(historical)
                          report['historical_restores']={p:run('git','rev-parse',base+':'+p,cwd=work).stdout.strip() for p in historical}
                      pyfiles=sorted(p for p in allowed if p.endswith('.py'))
                      if pyfiles:
                          run('python3','-m','ruff','check','--fix',*pyfiles,cwd=work)
                          run('python3','-m','ruff','format',*pyfiles,cwd=work)
                      native=sorted(p for p in allowed if p.endswith(('.cpp','.hpp','.cu')))
                      if native:run('clang-format','-i',*native,cwd=work)
                      report['audit_bindings']=module.bind(number,work)
                      if pyfiles:
                          run('python3','-m','ruff','check',*pyfiles,cwd=work)
                          run('python3','-m','ruff','format','--check',*pyfiles,cwd=work)
                      run('git','add','--',*sorted(allowed),cwd=work)
                      changed=set(run('git','diff','--cached','--name-only',cwd=work).stdout.splitlines())
                      if not changed or not changed<=allowed:raise RuntimeError('unexpected or empty changed-file set')
                      report['files']=sorted(changed)
                      run('git','diff','--cached','--check','--','.',':(glob,exclude)benchmarks/results/**/*.patch',cwd=work)
                      env=dict(os.environ);env['PYTHONPATH']=str(work/'python')+os.pathsep+str(work)
                      if module.TESTS[number]:
                          command=['python3','-m','pytest','-q','-o','addopts=','--import-mode=importlib']+['tests/python/'+p for p in module.TESTS[number]]
                          result=run(*command,cwd=work,check=False,env=env)
                          (out/'tests.log').write_text(result.stdout+result.stderr)
                          report['test_summary']='\n'.join((result.stdout+result.stderr).splitlines()[-15:])
                          if result.returncode:raise RuntimeError('focused acceptance tests failed; no result push')
                      else:
                          result=run('cmake','-S','.','-B','build-review','-G','Ninja','-DGENERATIVEQC_ENABLE_CUDA=OFF','-DCMAKE_BUILD_TYPE=Release',cwd=work,check=False,env=env)
                          (out/'configure.log').write_text(result.stdout+result.stderr)
                          if result.returncode:raise RuntimeError('CPU configure failed')
                          result=run('cmake','--build','build-review','--parallel','4',cwd=work,check=False,env=env)
                          (out/'build.log').write_text(result.stdout+result.stderr)
                          if result.returncode:raise RuntimeError('native CPU build failed')
                          result=run('ctest','--test-dir','build-review','--output-on-failure','--parallel','2',cwd=work,check=False,env=env)
                          (out/'tests.log').write_text(result.stdout+result.stderr)
                          report['test_summary']='\n'.join((result.stdout+result.stderr).splitlines()[-15:])
                          if result.returncode:raise RuntimeError('native CPU tests failed')
                      result_branch=f'agent/astra-reviewed-{number}-1535'
                      if run('git','ls-remote','origin','refs/heads/'+result_branch).stdout.strip():raise RuntimeError('result ref exists; no overwrite')
                      message=module.TITLES[number]+'\n\nPreserve current parent history, unchanged scientific limits and strict\nfailure publication. Focused acceptance tests pass; full PR CI remains\nrequired. No NVIDIA runtime or performance qualification claim.\n\nAgent: ChatGPT\nModel: GPT-6 Astra Pro'
                      run('git','-c','user.name=ChatGPT','-c','user.email=chatgpt@users.noreply.github.com','commit','-m',message,cwd=work)
                      report['commit']=run('git','rev-parse','HEAD',cwd=work).stdout.strip()
                      report['tree']=run('git','rev-parse','HEAD^{tree}',cwd=work).stdout.strip()
                      (out/'repair.patch').write_text(run('git','diff',head,'HEAD',cwd=work).stdout)
                      run('git','push','origin','HEAD:refs/heads/'+result_branch,cwd=work)
                      report['result_branch']=result_branch;report['pushed']=True
                  finally:run('git','worktree','remove','--force',str(work),check=False)
          except Exception as error:
              report['error']=str(error)
          (out/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report),flush=True)
          if 'error' in report:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-reviewed-${{ matrix.pr }}-1535
          path: ${{ runner.temp }}/reviewed-repair/
          retention-days: 1
