name: Round-two Hessian parent reconciliation
on:
  push:
    branches: [agent/astra-review-round2-20261001]
    paths: [.github/workflows/astra-review-round2.yml]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check pytest numpy scipy pyyaml
      - name: Preserve exact child delta and current master
        run: |
          python3 - <<'PY'
          import json,os,subprocess,tempfile
          from pathlib import Path
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'hessian-restack';out.mkdir()
          head='e0ea0a1b723de8b1bafa77f828e6030d3da2e041';parent='c8a70a63439d64c3cb9e1f0e20d3af62eb129f9c';branch='chatgpt/180-rks-hessian-cuda-second'
          report={'pr':1642,'head':head,'original_parent':parent}
          def run(*args,cwd=root,env=None,check=True,input=None):
            p=subprocess.run(args,cwd=cwd,env=env,capture_output=True,text=True,input=input)
            if check and p.returncode:raise RuntimeError((p.stderr+p.stdout)[-6000:])
            return p
          try:
            live=run('git','ls-remote','origin','refs/heads/'+branch).stdout.split()
            if not live or live[0]!=head:raise RuntimeError('child head moved; no changes made')
            master=run('git','rev-parse','origin/master').stdout.strip();report['master']=master
            child_files=set(run('git','diff','--name-only',parent,head).stdout.splitlines())
            other_files=set(run('git','diff','--name-only',parent,master).stdout.splitlines())
            report['child_files']=sorted(child_files);report['other_files']=sorted(other_files)
            if child_files & other_files:raise RuntimeError('upstream overlaps child; manual review required')
            patch=run('git','diff','--binary',parent,head).stdout
            with tempfile.TemporaryDirectory(prefix='hessian-parent-') as temp:
              work=Path(temp)/'source';run('git','worktree','add','--detach',str(work),master)
              try:
                run('git','apply','--index','-',cwd=work,input=patch)
                env=dict(os.environ);env['PYTHONPATH']=str(work/'python')+os.pathsep+str(work)
                files=['test_hessian_rks_output_budget.py','test_hessian_rks_second_backend.py','test_rks_hessian_production_owner.py','test_hessian_rks_import_contract.py']
                test=run('python3','-m','pytest','-q','-o','addopts=','--import-mode=importlib',*['tests/python/'+f for f in files],cwd=work,env=env)
                (out/'tests.log').write_text(test.stdout+test.stderr);report['tests']=test.stdout
                run('git','diff','--cached','--check',cwd=work)
                tree=run('git','write-tree',cwd=work).stdout.strip();report['tree']=tree
                message='fix(hessian): reconcile CUDA second-integral child with landed parent\n\nPreserve current master and replay only the reviewed child delta; parent\nand intervening master file sets are disjoint from the child. Retain both\nhistories and unchanged numerical gates. Backend/output/ownership tests\npass; this does not qualify the new CUDA route on an NVIDIA device.\n\nAgent: ChatGPT\nModel: GPT-6 Astra Pro'
                commit=run('git','-c','user.name=ChatGPT','-c','user.email=chatgpt@users.noreply.github.com','commit-tree',tree,'-p',head,'-p',master,'-m',message,cwd=work).stdout.strip();report['commit']=commit
                (out/'master-relative.patch').write_text(run('git','diff',master,commit,cwd=work).stdout)
                (out/'parent-reconciliation.patch').write_text(run('git','diff',head,commit,cwd=work).stdout)
                run('git','push','origin',commit+':refs/heads/'+branch,cwd=work);report['pushed']=True
              finally:run('git','worktree','remove','--force',str(work),check=False)
          except Exception as e:report['error']=str(e)
          (out/'report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report),flush=True)
          if 'error' in report:raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: astra-round2-hessian-restack
          path: ${{ runner.temp }}/hessian-restack/
          retention-days: 1
