# Temporary read-only inventory to identify exact open CodeQL findings.
# Removed from the repair branch after findings are captured.
name: Temporary code scanning inventory

on:
  push:
    branches:
      - agent/code-scanning-repairs-20261009

permissions:
  contents: read
  security-events: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: List open code scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate -X GET \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
            --jq '.[] | {number, rule_id: .rule.id, severity: .rule.severity, security_severity: .rule.security_severity_level, description: .rule.description, path: .most_recent_instance.location.path, start_line: .most_recent_instance.location.start_line, message: .most_recent_instance.message.text}'
