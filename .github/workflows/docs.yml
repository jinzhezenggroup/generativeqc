name: Documentation

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Sphinx build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: docs/requirements.txt
      - name: Install documentation dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python -r docs/requirements.txt
      - name: Test documentation helpers
        run: |
          .venv/bin/python -m unittest discover -s tests/python -p test_sphinx_repository_links.py
          .venv/bin/python -m unittest discover -s tests/python -p test_python_api_docs.py
      - name: Enforce public API docstrings with Ruff D1xx
        run: .venv/bin/python tools/check_public_api_docstrings.py --ruff .venv/bin/ruff
      - name: Build documentation with warnings as errors
        env:
          PYTHONPATH: python
        run: .venv/bin/python -m sphinx -W --keep-going -b html docs docs/_build/html
